`,im=[{id:`R-001`,title:`[가상] 면류 보존료 사용기준 개정 고시`,notice:`이 문서는 시연용 가상 고시이며 실제 법령이 아닙니다.`,effective_date:`2027-03-01`,articles:[{no:`제1조`,text:`면류(유탕면 포함)의 스프류에 사용하는 보존료의 사용량은 최종 제품 기준 1.0g/kg 이하로 한다. 종전 기준은 2.0g/kg 이하였다.`},{no:`제2조`,text:`제1조에 따라 보존료 사용량을 줄이는 경우 제조업체는 개정 시행일 이전에 보관 안정성 시험 성적서를 구비하여야 한다.`},{no:`제3조`,text:`이 고시 시행 전에 제조한 제품은 유통기한까지 판매할 수 있다.`}]},{id:`R-002`,title:`[가상] 알레르기 유발물질 표시 기준 개정 고시`,notice:`이 문서는 시연용 가상 고시이며 실제 법령이 아닙니다.`,effective_date:`2027-01-01`,articles:[{no:`제1조`,text:`알레르기 유발물질 표시 대상에 '참깨'와 '메밀'이 포함됨을 명확히 하고, 원재료명 표시란 바로 옆 또는 아래에 별도 구획으로 표시하여야 한다.`},{no:`제2조`,text:`알레르기 표시 글자 크기는 원재료명 표시 글자 크기 이상이어야 하며 굵은 글씨로 표시하여야 한다.`},{no:`제3조`,text:`같은 제조라인에서 알레르기 유발물질을 사용한 다른 제품을 제조하는 경우 '혼입 가능성' 문구를 표시하여야 한다.`}]},{id:`R-003`,title:`[가상] 식용유지류 산가 기준 및 출고 검사 강화 고시`,notice:`이 문서는 시연용 가상 고시이며 실제 법령이 아닙니다.`,effective_date:`2027-06-01`,articles:[{no:`제1조`,text:`식용유지류의 산가 기준을 0.6 이하에서 0.4 이하로 강화한다. 단, 압착 식용유지는 종전 기준을 적용한다.`},{no:`제2조`,text:`유탕 처리 식품에 사용하는 유지는 제조 시점 산가가 1.0 이하이어야 한다.`},{no:`제3조`,text:`제조업체는 출고 전 로트별로 산가 및 과산화물가 검사 결과를 기록하고 2년간 보관하여야 한다.`}]}],am=[{id:`SC-001`,supplier_id:`SUP-01`,title:`케이싱 롤 두께 불균일 (COA는 정상)`,text:`새봄케이싱 롤 CS-0618 입고. 롤 안에서 두께가 고르지 않음. 손으로 만져도 차이가 느껴짐. COA는 정상 값으로 와 있음. 아직 생산에는 안 쓰고 창고에 보관 중. 작년 11월에도 비슷한 일이 있었음. 다음 입고 예정은 7/3.`},{id:`SC-002`,supplier_id:`SUP-02`,title:`컵 실링 불량 누수 (귀책 불명확)`,text:`발효유 컵 실링 불량으로 누수 5개 발견. 오후 3~4시 생산분. 필름 로트 DS-0611. 필름 두께는 규격 범위 안이었음. 그런데 우리 쪽 실링 온도 설정이 142에서 138로 바뀐 기록이 있고 누가 바꿨는지 모름. 필름 문제인지 우리 설정 문제인지 아직 모름.`},{id:`SC-003`,supplier_id:`SUP-03`,title:`원유 로트 변경 후 산도 상승 (규격 이내)`,text:`6/9 입고 3번 탱크 원유로 만든 우유에서 산도가 평소보다 높게 나옴(0.158~0.162). 규격은 0.18 이하라 합격은 한 상태. 입고할 때 원유 산도 검사 기록은 정상이었다고 함. 원인은 모르겠고 로트가 바뀐 것만 확인됨.`},{id:`SC-004`,supplier_id:`SUP-05`,title:`소스 병 라벨 들뜸·박리`,text:`소스 병 라벨이 들뜨거나 떨어지는 병을 출하 전 검사에서 약 80병 발견. 라벨 로트 ML-0523. 접착력 시험은 우리 쪽에서 안 했음. 보관 온도는 정상. 지난번 접착력 성적서를 요청했을 때 회신이 많이 늦었던 적이 있음.`},{id:`SC-005`,supplier_id:`SUP-04`,title:`금속검출기 반응 시기 사용 향신료 로트 (원인 미확정)`,text:`6/26 소시지라인 ·점검 주기를 재설정하고, 원인이 확인될 때까지 충진량과 실링 검사를 강화합니다.\\n2. C라인: 모터 과열 원인을 분석하고, 동일 설비의 예방점검을 확대합니다.\\n3. A라인: 롤러를 교체하거나 점검하고, 금속검출기 성능을 검증합니다. 검출품은 이물 여부를 확인한 뒤 처리합니다.\\n4. 세 건 모두 설비 원인이 의심되므로 정비 이력과 점검 주기를 함께 검토합니다.\\n\\n## 5. 한계\\n- 제공 데이터는 일 단위 요약뿐이어서 원인은 모두 가설입니다. 현장 확인 결과로 확정해야 합니다."},"0f318f0143306e":{"headline":"TUM-01 진공 텀블러(high): 베어링 온도 +18%(z=13), 진동 +44.7%(z=7.6) 동반 상승 — 가장 먼저 점검 필요","assessments":[{"machine_id":"TUM-01","probable_failure_mode":"베어링 마모/윤활 불량으로 인한 베어링 손상 (추정)","evidence":["bearing_temp_c 기준 평균 50.17 → 최근 59.19 (+18%, z=13)","vibration_mms 기준 평균 1.6 → 최근 2.31 (+44.7%, z=7.6)","두 지표의 변동폭도 기준 대비 각각 4.6배, 3.3배로 커짐(spread_ratio)","같은 설비에서 온도·진동이 함께 상승 — 과거 HOM-01 고장 전조(베어링 온도·진동 동반 상승)와 유사한 패턴","고장 이력은 없음(breakdowns 비어 있음)"],"actions":[{"action":"베어링 온도·진동 현장 실측 확인(휴대용 측정기), 그리스 상태·급유량 점검","urgency":"immediate","owner":"설비보전"},{"action":"베어링 및 구동부 정렬·체결 상태 점검, 필요 시 계획 정지 후 베어링 교체 검토","urgency":"within_week","owner":"설비보전"},{"action":"점검 중 일일 온도·진동 추이 모니터링 및 임계 초과 시 가동 중단 판단 기준 공유","urgency":"immediate","owner":"생산(육가공) / 설비보전"}],"spare_parts":["구동부 베어링 세트","베어링용 그리스(식품용 H1 등급 여부 확인 필요)","오일씰/축 씰"]},{"machine_id":"CUT-01","probable_failure_mode":"커팅부 마모(칼날·베어링) 또는 부하 증가 (추정)","evidence":["vibration_mms 기준 2.99 → 3.28 (+9.9%, z=3.7)","motor_current_a 기준 117.89 → 124.07 (+5.2%, z=4.5)","wear_index_latest 52.4","위험도 medium, 고장 이력 없음"],"actions":[{"action":"칼날 마모·밸런스 및 체결 상태 점검, 필요 시 연마/교체","urgency":"within_week","owner":"설비보전"},{"action":"모터 전류·진동 추이 주간 확인, 상승 지속 시 TUM-01 수준으로 격상 검토","urgency":"within_week","owner":"생산(육가공)"},{"action":"다음 정기 PM 때 베어링·벨트 상태 점검 포함","urgency":"next_pm","owner":"설비보전"}],"spare_parts":["커터 칼날 세트","주축 베어링","구동 벨트(해당 시)"]},{"machine_id":"HOM-01","probable_failure_mode":"과거 고장: 균질 밸브 시트 파손 및 피스톤 씰 마모(2026-06-11, 340분 정지). 현재 위험도 low — 재발 가능성은 추정","evidence":["2026-06-11 고장, 정지 340분, 부품 교체 후 재가동","고장 전조: vibration_mms +77.5%(z=22.1), bearing_temp_c +11.2%(z=7.2), motor_temp_c +4.9%(z=3.4)","process_pressure_bar는 평균 변화 +0.8%(z=0.  지표와 함께 확인(보조 지표)","rationale":"PAS-01 전조에서 +4.6%(z=4.0)"},{"machine_type":"텀블러·커터(육가공 회전설비)","metric":"bearing_temp_c / vibration_mms","rule":"온도 +10% 또는 진동 +20% 이상(z≥5)이 동시에 나타나면 즉시 점검(초안)","rationale":"과거 육가공 설비 고장 이력은 없어 HOM-01 전조 패턴을 참고한 추정. 현재 TUM-01이 이 패턴에 해당"}],"pm_plan_markdown":"# 이번 주 예방정비 우선순위 (초안 — 담당자 검토 필요)\\n\\n| 순위 | 설비 | 위험도 | 핵심 작업 | 시점 |\\n|---|---|---|---|---|\\n| 1 | TUM-01 진공 텀블러 | high | 베어링 온도·진동 실측, 그리스·정렬 점검, 필요 시 계획 정지 후 베어링 교체 | 즉시 |\\n| 2 | CUT-01 사일런트 커터 | medium | 칼날 마모·체결 점검, 전류·진동 주간 추적 | 주중 |\\n| 3 | HOM-01 고압 균질기 1호 | low (고장 이력) | 교체 부품(밸브 시트·피스톤 씰) 상태 확인, 압력 변동 모니터링 | 다음 PM |\\n| 4 | PAS-01 UHT 살균기 | low (고장 이력) | 압력 추이 확인, 가스켓 상태 점검 | 다음 PM |\\n| 5 | STF-01 진공 스터퍼 | low (고장 이력) | 호스 클램프 체결 확인 | 다음 PM |\\n\\n## 참고\\n- TUM-01은 온도·진동이 함께 크게 올라 있어(z=13, z=7.6) 다른 작업보다 먼저 진행하는 것을 권장합니다.\\n- TUM-01 점검 결과에 따라 계획 정지가 필요할 수 있으므로 생산 일정 조율이 필요합니다.\\n- 고장 유형은 모두 추정이며, 현장 실측 결과로 확정해야 합니다.\\n- 위 경보 기준은 과거 고장 1건씩에서 얻은 값이라 표본이 적습니다. 운영하면서 보정이 필요합니다."},"0c49d19553fe75":{"headline":"6월 말 기준 우유라인 6/9~11(균질 불량 후 균질기 밸브 시트 파손 긴급정지)과 소시지라인 6/24~26(유화 불량·케이싱 파열, 수율 하락 지속)이 핵심 이상 구간입니다.","findings":[{"line":"우유라인","dates":"2026-06-09 ~ 2026-06-10","problem":"수율 96.61%, 96.37%로 라인 중앙값 99.14% 대비 약 2.5~2.8%p 하락. 두 날 모두 '균질 불량으로 지방 분리 의심 팩 증가' 기록.","hypotheses":[{"cause":"균질기 밸브 시트 마모·손상이 진행되어 균질 압력이 불안정해졌고, 그 결과 지방 분리 불량이 발생했을 가능성(추정)","evidence":"6/9~10 균질 불량 기록 직후 6/11에 균질기 밸브 시트 파손으로 긴급 정지(340분)가 발생함. 같은 설비 계통이 연속 관련됨.","how_to_verify":"교체한 밸브 시트의 마모·파손 상태 확인, 균질기 압력 기록(6/8~6/11)과 정비 이력 점검, 6/9~10 생산 로트의 지방 분리 불량 팩 수량 확인"},{"cause":"균질 압력·온도 등 운전 조건 설정 이탈(추정)","evidence":"하락 원인이 균질 불량으로 기록되어 있으나 설정값 데이터는 제공되지 않음.","how_to_verify":"6/9~10 운전 조건 기록과 표준 조건 비교, 작업자 설정 변경 이력 확인"}]},{"line":"우유라인","dates":"2026-06-11","problem":"다운타임 340분, 달성률 62%로 급락. 수율은 98.95%로 정상 범위.","hypotheses":[{"cause":"균질기 밸브 시트 파손에 따른 긴급 정지와 부품 교체가 직접 원인","evidence":"다운타임 사유가 '균질기 밸브 시트 파손으로 긴급 정지, 부품 교체'로 명시됨. 수율은 정상이므로 손실은 가동시간 감소에서 발생.","how_to_verify":"정지 시작·종료 시각, 부품 재고·조달 시간 확인, 예방정비 주기에 밸브 시트가 포함되어 있었는지 확인"},{"cause":"6/9~10 전조 증상 시 조기 정지·점검이 이뤄지지 않아 고장으로 확대(추정)","evidence":"균질 불량이 2일 연속 기록되었고, 같은 기간 다운타임 사유는 CIP 세척 대기(33분), 라벨 교체(30분)로 균질기 점검과 무관함.","how_to_verify":"6/9~10 품질 이상 발생 시 설비 점검 요청 여부와 대응 기록 확인"}]},{"line":"소시지라인","dates":"2026-06-24 ~ 2026-06-26","problem":"수율이 95.89% → 95.29% → 94.78%로 3일 연속 하락해 라인 중앙값 98.37% 대비 약 2.5~3.6%p 낮음. 유화 불량과 케이싱 파열이 증가했고 하락 폭이 커지는 추세.","hypotheses":[{"cause":"커터 칼날 마모로 인한 유화 불량과 그에 따른 케이싱 파열 증가","evidence":"3일 모두 '유화 불량 및 케이싱 파열 증가, 커터 칼날 마모 의심' 기록. 수율이 일자별로 계속 악화됨(칼날 교체 없이 진행된 정황, 추정).","how_to_verify":"커터 칼날 상태와 교체 이력 점검, 유화물 점도·온도 확인, 칼날 교체 후 수율 회복 여부 확인"},{"cause":"케이싱 자체 문제(로트 불량, 규격·보관 상태) 또는 충전 압력 문제(추정)","evidence":"6/24, 6/26 다운타임 사유가 케이싱 교체이고 케이싱 파열 증가가 기록됨. 다만 케이싱 로트 정보는 제공되지 않음.","how_to_verify":"사용 케이싱 로트·공급처 확인, 보관 상태 점검, 충전 압력 설정값 확인"},{"cause":"포장기 센서 설정 문제로 인한 부수적 손실(추정, 가능성 낮음)","evidence":"6/25 다운타임 사유가 포장기 센서 재설정(50분)이나 불량 기록은 유화·케이싱 문제로 집중됨.","how_to_verify":"6/25 센서 재설정 전후 불량 유형(포장 불량 vs 유화·케이싱 불량) 비교"}]}],"report_markdown":"# 생산 현황 보고서 (초안)\\n\\n> 본 초안은 사람이 검토할 자료입니다. 수치는 사전 계산된 값을 그대로 사용했고, 원인은 가설(추정)입니다.\\n\\n## 1. 요약\\n- 우유라인: 6/9~10 균질 불량으로 수율이 떨어졌고, 6/11 균질기 밸브 시트 파손으로 긴급 정지(340분, 달성률 62%)가 발생했습니다.\\n- 소시지라인: 6/24~26 유화 불량·케이싱 파열로 수율이 95.89% → 95.29% → 94.78%로 계속 하락했습니다(커터 칼날 마모 의심).\\n\\n## 2. 라인별 지표\\n| 라인 | 평균 수율(%) | 평균 달성률(%) | 총 다운타임(분) | 가동률(%) |\\n|---|---|---|---|---|\\n| 우유 | 98.98 | 96.05 | 1,096 | 95.61 |\\n| 발효유 | 98.98 | 98.44 | 721 | 97.11 |\\n| 소시지 | 98.12 | 97.74 | 818 | 96.72 |\\n| 햄 | 98.67 | 97.60 | 725 | 97.10 |\\n\\n- 우유라인은 달성률(96.05%)과 가동률(95.61%)이 4개 라인 중 가장 낮고, 총 다운타임(1,096분)이 가장 큽니다. 6/11 정지 340분이 큰 비중을 차지합니다.\\n- 소시지라인은 평균 수율(98.12%)이 가장 낮습니다.\\n- 발효유·햄라인은 이상치가 없었습니다.\\n\\n## 3. 이상 사항 및 원인 가설\\n\\n### 3-1. 우유라인 6/9~6/11\\n| 일자 | 수율(%) | 달성률(%) | 다운타임(분) | 비고 |\\n|---|---|---|---|---|\\n| 6/9 | 96.61 | 96.78 | 33 (CIP 세척 대기) | 균질 불량, 지방 분리 의심 팩 증가 |\\n| 6/10 | 96.37 | 97.40 | 30 (라벨 교체) | 동일 |\\n| 6/11 | 98.95 | 62.00 | 340 (균질기 밸브 시트 파손) | 긴급 정지·부품 교체 |\\n\\n- 가설 1 (추정): 밸브 시트 마모가 진행되면서 균질 불량이 나타났고, 6/11에 파손으로 이어졌습니다. 근거는 균질 불량 기록 직후 균질기 파손이 발생한 점입니다.\\n- 가설 2 (추정): 균질 압력·온도 등 운전 조건이 표준에서 이탈했습니다. 설정값 데이터가 없어 확인이 필요합니다.\\n- 확인 사항: 파손 부품 상태, 균질기 압력 기록, 정비 이력, 6/9~10 지방 분리 불량 로트 수량, 정지 시각, 부품 조달 시간.\\n- 개선 제안: 균질 불량이 반복되면 설비 점검을 먼저 하도록 기준을 정하고, 밸브 시트를 예방정비 항목에 포함하는 방안을 검토합니다.\\n\\n### 3-2. 소시지라인 6/24~6/26\\n| 일자 | 수율(%) | 달성률(%) | 다운타임(분) | 비고 |\\n|---|---|---|---|---|\\n| 6/24 | 95.89 | 95.45 | 64 (케이싱 교체) | 유화 불량·케이싱 파열 증가 |\\n| 6/25 | 95.29 | 97.05 | 50 (포장기 센서 재설정) | 동일 |\\n| 6/26 | 94.78 | 97.99 | 38 (케이싱 교체) | 동일 |\\n\\n- 가설 1 (추정): 커터 칼날 마모로 유화가 불량해지고 케이싱 파열이 늘었습니다. 현장 기록에도 칼날 마모 의심이 있습니다.\\n- 가설 2 (추정): 케이싱 로트·보관 상태 또는 충전 압력 문제입니다. 케이싱 교체가 반복되었으나 로트 정보는 없습니다.\\n- 가설 3 (추정, 가능성 낮음): 포장기 센서 문제입니다. 불량 기록은 유화·케이싱에 집중되어 있습니다.\\n- 확인 사항: 칼날 상태·교체 이력, 유화물 온도·점도, 케이싱 로트, 충전 압력, 칼날 교체 후 수율 회복 여부.\\n- 개선 제안: 하락이 3일 연속 이어졌으므로 칼날을 우선 점검·교체하고, 이후 수율 추이를 확인합니다.\\n\\n## 4. 후속 조치 (제안)\\n1. 우유라인: 균질기 정비 이력을 점검하고 밸브 시트의 교체 주기를 재검토합니다.\\n2. 소시지라인: 커터 칼날을 점검·교체하고, 케이싱 로트를 확인합니다.\\n3. 두 건 모두 조치 후 1주간 수율과 불량 추이를 모니터링합니다.\\n4. 이상 징후가 2일 이상 이어질 때 설비 점검으로 연결하는 기준을 마련합니다.\\n\\n## 5. 한계\\n- 제공된 데이터에는 설비 설정값, 원료·케이싱 로트, 정비 기록이 없어 원인을 확정할 수 없습니다.\\n- 위 가설은 현장 확인 후 확정해야 합니다."},"1f19574e5c4de4":{"summary":"[가상 고시] 2027-03-01부터 면류(유탕면 포함)의 스프에 쓰는 보존료 상한이 최종 제품 기준 2.0g/kg 이하에서 1.0g/kg 이하로 절반이 됩니다(제1조). 이 때문에 보존료를 줄이는 업체는 시행일 전까지 보관 안정성 시험 성적서를 갖춰야 합니다(제2조). 시행일 전에 만든 제품은 유통기한까지 판매할 수 있습니다(제3조). 자사 품목 중 직접 해당하는 것은 봉지라면(P-RAMEN) 1개입니다. 품목 카드에는 현재 보존료 사용량이 없으므로 기준 초과 여부는 확인이 필요합니다. 오늘(2026-10-13) 기준으로 시행일까지 약 4.5개월 남았습니다.","impacts":[{"product_id":"P-RAMEN","article_no":"제1조","quoted_text":"면류(유탕면 포함)의 스프류에 사용하는 보존료의 사용량은 최종 제품 기준 1.0g/kg 이하로 한다.","level":"high","reason":"면류(유탕면) 제품이고 원재료에 '보존료(스프용)'가 있어 바로 적용 대상입니다. 현재 사용량은 품목 카드에 없어 1.0g/kg 초과 여부는 알 수 없습니다. 1.0g/kg을 넘으면 배합을 바꿔야 하고, 사용량을 줄이면 제2조에 따라 시행일 전에 보관 안정성 시험 성적서를 갖춰야 합니다. 유통기한은 180일입니다.","actions":["[품질/연구소] 현행 스프 보존료 사용량을 최종 제품 기준(g/kg)으로 다시 계산해 1.0g/kg 이하인지 확인","[연구소] 초과 시 보존료 저감 배합을 개발하고 대체 보존 방안 검토(수분·염도 등 조정 가능성 검토)","[품질] 저감 배합으로 보관 안정성 시험을 계획·실시하고, 2027-03-01 전까지 성적서 구비(제2조). 유통기한 180일을 고려하면 실측 시험 기간이 빠듯하므로 곧바로 착수 필요","[생산/A라인] 스프 투입 공정 배합표·작업표준서를 개정하고 배합 전환 일정 수립","[구매] 스프 원료 공급처의 보존료 함량 사양서를 다시 받고, 사양 변경 시 협의","[영업/물류] 시행 전 제조분의 유통기한 내 판매 계획 수립(제3조), 제조일자로 재고 관리"]},{"product_id":"P-SAUCE","article_no":"","quoted_text":"","level":"none","reason":"보존료(소르빈산칼륨)를 쓰지만 소스류 제품입니다. 이번 개정은 면류 스프류의 보존료만 다루므로 해당하지 않습니다. 다만 이 소스를 면류 스프 원료로 납품·전용한다면 따로 검토해야 합니다(추정).","actions":[]},{"product_id":"P-OIL","article_no":"","quoted_text":"","level":"none","reason":"식용유지류이고 보존료를 쓰지 않아 면류 스프 보존료 기준과 관계없습니다.","actions":[]},{"product_id":"P-CURRY","article_no":"","quoted_text":"","level":"none","reason":"즉석조리식품(레토르트)이고 원재료에 보존료가 없어 해당하지 않습니다.","actions":[]},{"product_id":"P-DUMPLING","article_no":"","quoted_text":"","level":"none","reason":"만두류이고 보존료를 쓰지 않아 해당하지 않습니다(밀가루를 쓰지만 면류 스프 제품이 아님).","actions":[]}],"general_actions":["[품질] 이번 개정 고시가 실제로 공포된 원문인지 확인(현재 '가상' 고시)하고 시행일(2027-03-01) 일정 등록","[품질] 개발 중이거나 출시 예정인 면류 제품, 외부 위탁(OEM) 면류 제품 중 스프에 보존료를 쓰는 것이 있는지 추가 확인","[품질/생산] 시행일 기준으로 제조일자를 구분해 재고를 관리하는 체계 마련(제3조 경과조치 대응)","[품질] 검토 결과와 조치 이력을 문서로 남기고 담당자가 최종 검토·승인"]},"0d1217bd05e86f":{"headline":"안양공장 원료창고 '원료 보관 구분(알레르기)'(심각도 상) 시정 기한이 27일 지났으므로 오늘 바로 격리하고 시정을 끝내야 함. 참깨 원료가 일반 원료 선반에 섞여 보관되어 교차오염 위험이 있음.","plant_assessments":[{"plant":"안양공장","summary":"위험도 high. 점검 6회, 60항목 중 부적합 7건(11.7%). 시정 미완료 3건 중 1건이 기한 초과임. 2026-05-12 원료창고 점검에서 '참깨 원료가 일반 원료 선반에 혼재 보관'(심각도 상)이 지적됐고, 기한 2026-05-19가 지나 27일 초과된 상태. 기한을 넘겨 종결한 건이 2건, 평균 종결 소요일은 23.3일로 세 공장 중 가장 길다. 월별 부적합은 6월 2건으로 5월(1건)보다 늘었다.","probable_causes":["추정: 원료창고 안에 알레르기 원료 전용 보관 구역이나 표시가 정해져 있지 않거나 지켜지지 않음","추정: 시정조치 기한을 추적·독촉하는 체계가 약함(기한 넘겨 종결 2건, 평균 23.3일 소요가 근거)","추정: 시정 담당자 지정이나 완료 확인 절차가 불명확함"],"actions":[{"action":"참깨 원료를 즉시 전용 구역으로 옮겨 격리하고 알레르기 표시를 함. 혼재 보관 기간에 같은 선반에 있던 일반 원료의 교차오염 가능성을 검토하고, 필요하면 해당 원료·제품의 영향 범위를 평가함","urgency":"immediate","owner":"품질관리팀 / 원료창고(자재)팀"},{"action":"알레르기 원료 보관 기준 비치, 3일치 누락\\n  - 추정 원인: 기록 담당자·주기 불명확, 기록지 비치 관리 미흡, 형식적 종결\\n  - 조치: 기록지 즉시 비치하고 누락 기간 확인, 담당자 정·부 지정과 일일 확인, 근본원인 분석과 자동 기록 장치 검토\\n- **평택공장 / 포장실 / 방충망·출입문 밀폐**: 6회 중 4회(2026-02, 03, 05, 06), 최신 심각도 중\\n  - 최신 지적: 포장실 출입문 자동 닫힘 장치 고장\\n  - 추정 원인: 임시 조치만 반복, 예방정비 대상에서 빠짐\\n  - 조치: 장치 즉시 수리(공무팀), 방충망·출입문 전수 점검, 예방정비 항목에 포함\\n\\n### 3.3 공통 문제\\n- **포충등 관리 기록**: 2026-06에 안양·음성·평택 3개 공장 모두 부적합\\n\\n## 4. 본사 차원 조치(안)\\n1. 포충등 관리 기록의 표준 양식·주기·확인자를 정해 3개 공장에 배포\\n2. 기록류 담당자 정·부 지정과 관리자 일일 확인 기준 마련\\n3. 미종결·기한 임박 지적을 주간 단위로 모니터링하고, 기한 초과 시 상위 보고하는 절차 마련\\n4. 반복 지적 종결 시 근본원인 분석과 효과 확인 기록 의무화 검토\\n\\n## 5. 다음 점검 중점 항목\\n| 공장 | 항목 | 사유 |\\n|---|---|---|\\n| 안양공장 | 원료 보관 구분(알레르기) | 심각도 상, 기한 27일 초과 |\\n| 음성공장 | 냉장·냉동 온도 기록 | 6회 중 4회 반복, 악화 |\\n| 평택공장 | 방충망·출입문 밀폐 | 6회 중 4회 반복 |\\n| 전 공장 | 포충등 관리 기록 | 2026-06 3개 공장 공통 부적합 |\\n"},"140883c9592bb7":{"summary":"[가상] 알레르기 표시 기준 개정 고시(시행 2027-01-01) 요약: ① 표시 대상에 참깨·메밀이 포함된다는 점을 명확히 하고, 알레르기 표시는 원재료명 표시란 바로 옆이나 아래에 별도 칸으로 따로 표시해야 합니다(제1조). ② 알레르기 표시 글자는 원재료명 글자 이상 크기의 굵은 글씨여야 합니다(제2조). ③ 같은 제조라인에서 다른 알레르기 유발물질 사용 제품을 만들면 '혼입 가능성' 문구를 표시해야 합니다(제3조). 자사 5개 품목은 모두 알레르기 유발물질이 있어 제1·2조에 따른 라벨 개정이 필요합니다. 참깨(참기름)를 쓰는 고기만두가 가장 직접적인 영향을 받습니다. 제공된 품목 카드상으로는 품목마다 전용 라인(A~E)을 쓰고 있어 제3조 적용 근거는 확인되지 않습니다. 다만 카드에 없는 다른 제품을 같은 라인에서 생산하는지는 확인이 필요합니다.","impacts":[{"product_id":"P-DUMPLING","article_no":"제1조","quoted_text":"알레르기 유발물질 표시 대상에 '참깨'와 '메밀'이 포함됨을 명확히 하고, 원재료명 표시란 바로 옆 또는 아래에 별도 구획으로 표시하여야 한다.","level":"high","reason":"원재료 '참기름'에서 나오는 참깨가 개정 조문에 이름이 명시된 표시 대상입니다. 밀·대두·돼지고기·참깨 모두를 별도 구획으로 표시하도록 라벨을 바꿔야 합니다. 제2조(원재료명 이상 크기의 굵은 글씨)도 함께 적용됩니다.","actions":["품질팀: 참기름(참깨)·간장(대두·밀)·두부(대두) 등 원재료별 알레르기 유발물질 표시가 빠지지 않았는지 재검증","디자인/마케팅: 원재료명 표시란 바로 옆이나 아래에 알레르기 별도 구획을 만들고, 원재료명 이상 크기의 굵은 글씨로 시안 수정(제2조)","생산관리팀: D라인에서 카드에 없는 다른 알레르기 유발물질 사용 제품을 만드는지 확인하고, 해당하면 '혼입 가능성' 문구 추가(제3조)","구매/자재: 기존 포장재 재고를 소진하고 신규 포장재로 바꾸는 일정을 시행일(2027-01-01) 전으로 수립"]},{"product_id":"P-RAMEN","article_no":"제1조","quoted_text":"알레르기 유발물질 표시 대상에 '참깨'와 '메밀'이 포함됨을 명확히 하고, 원재료명 표시란 바로 옆 또는 아래에 별도 구획으로 표시하여야 한다.","level":"medium","reason":"밀·대두·쇠고기를 별도 구획 방식으로 표시하도록 라벨 배치를 바꿔야 합니다. 제2조 글자 크기·굵기 요건도 적용됩니다. 카드상 참깨·메밀 원재료는 없습니다.","actions":["디자인/마케팅: 봉지면 포장 알레르기 표시를 별도 구획으로 만들고, 원재료명 이상 크기의 굵은 글씨로 수정","품질팀: 스프 원료(간장분말, 효모추출물 등)의 하위 원재료에 참깨·메밀이 섞였는지 원료 규격서로 확인(카드에 정보 없음)","생산관리팀: A라인을 다른 제품과 같이 쓰는지 확인(제3조 해당 여부)"]},{"product_id":"P-SAUCE","article_no":"제1조","quoted_text":"알레르기 유발물질 표시 대상에 '참깨'와 '메밀'이 포함됨을 명확히 하고, 원재료명 표시란 바로 옆 또는 아래에 별도 구획으로 표시하여야 한다.","level":"medium","reason":"대두·밀(간장 유래)을 별도 구획으로 표시하도록 병 라벨을 바꿔야 합니다. 제2조도 적용됩니다. 카드상 참깨·메밀 원재료는 없습니다.","actions":["디자인/마케팅: 병 라벨 알레르기 표시를 별도 구획으로 만들고, 원재료명 이상 크기의 굵은 글씨로 수정(라벨 면적이 좁으니 레이아웃 검토)","품질팀: 간장·변성전분 등 원료 규격서에서 참깨·메밀 혼입 여부 확인","생산관리팀: B라인 공용 여부 확인(제3조)"]},{"product_id":"P-CURRY","article_no":"제1조","quoted_text":"알레르기 유발물질 표시 대상에 '참깨'와 '메밀'이 포함됨을 명확히 하고, 원재료명 표시란 바로 옆 또는 아래에 별도 구획으로 표시하여야 한다.","level":"medium","reason":"밀·우유·닭고기를 별도 구획으로 표시하도록 파우치·외포장 라벨을 바꿔야 합니다. 제2조도 적용됩니다. 카드상 참깨·메밀 원재료는 없습니다.","actions":["디자인/마케팅: 파우치·외포장의 알레르기 표시를 별도 구획으로 만들고, 굵은 글씨·크기 기준에 맞게 수정","품질팀: 카레분말(복합원료)의 하위 원재료에 참깨·메밀이 들어 있는지 공급사 자료로 확인","생산관리팀: C라인 공용 여부 확인(제3조)"]},{"product_id":"P-OIL","article_no":"제1조","quoted_text":"알레르기 유발물질 표시 대상에 '참깨'와 '메밀'이 포함됨을 명확히 하고, 원재료명 표시란 바로 옆 또는 아래에 별도 구획으로 표시하여야 한다.","level":"medium","reason":"원재료가 대두유 하나뿐이어도 대두가 알레르기 표시 대상이므로 별도 구획 표시로 라벨을 바꿔야 합니다. 제2조도 적용됩니다. 변경 범위는 작은 편입니다.","actions":["디자인/마케팅: 1.8L 용기 라벨의 대두 표시를 별도 구획으로 만들고, 굵은 글씨·크기 기준 반영","생산관리팀: E라인에서 다른 유지(예: 참기름 등)를 충진하는지 확인하고, 해당하면 '혼입 가능성' 문구 추가(제3조, 카드에 정보 없음)"]}],"general_actions":["품질팀: 전 품목의 알레르기 유발물질 목록과 원료 규격서(복합원료의 하위 원재료 포함)를 대조해 참깨·메밀이 섞였는지 일괄 점검","생산관리팀: A~E 라인별 생산 품목 전체 목록(카드에 없는 품목 포함)과 공용 설비 사용 현황을 조사해 제3조 '혼입 가능성' 문구 대상 확정","디자인/마케팅: 알레르기 표시 공통 표준 양식 마련(원재료명 표시란 바로 옆이나 아래 별도 구획, 원재료명 이상 글자 크기, 굵은 글씨)","구매/자재: 품목별 포장재 재고를 파악하고, 시행일(2027-01-01) 전에 신규 포장재로 바꾸는 일정 수립","법무/RA: 실제 고시 원문과 경과조치(재고 포장재 사용 허용 여부 등)를 확인(본 개정 조문은 가상이며 경과조치 내용 없음)"]},"13a11009c8dc3f":{"headline":"햄 중량을 먼저 봐야 합니다. 규격 하한(195g) 미달이 3건(최악값 193.8g) 발생했고, 평균이 계속 내려가면서 최근 Cpk가 0.58까지 떨어졌습니다. 분석 데이터는 2026-06-30까지이므로 현재 상태를 즉시 확인해야 합니다.","assessments":[{"series_key":"햄|중량","interpretation":"햄 중량이 점점 가벼워지고 있습니다. 6/20부터 11개가 연속으로 기준 평균(199.9g)보다 낮았고, 최근 평균은 197.35g입니다. 6/10 이후로는 하루에 약 0.23g씩 줄어들었으며, 6/23·6/24·6/27에는 규격 하한 195g을 밑돌았습니다(최악값 193.8g). 값의 흩어짐도 기준선보다 커졌습니다(표준편차 1.30→2.16). 평균이 내려간 데다 흩어짐까지 커져서 하한 미달품이 계속 나올 수 있는 상태입니다(최근 Cpk 0.58). 이 추세가 이어지면 평균 자체도 약 4일 뒤 하한에 닿는다는 계산이 나와 있습니다(6/30 기준).","probable_causes":["추정: 6/10 무렵부터 서서히 하락했으므로 갑작스러운 단발 사고보다는 점진적으로 변하는 요인(예: 설정값 드리프트, 마모 등)일 수 있음. 실제 원인은 입력 데이터로 확인되지 않음","추정: 평균 하락과 함께 산포도 커졌으므로 중량 편차를 키우는 변동 요인이 추가되었을 수 있음"],"actions":[{"action":"현재 생산분의 중량을 즉시 재측정해 6/30 이후에도 하락이 이어졌는지 확인","urgency":"immediate","owner":"품질팀"},{"action":"규격 이탈일(6/23, 6/24, 6/27) 제품의 로트를 특정하고 출하 여부를 확인한 뒤 격리·선별·재검사 범위 결정","urgency":"immediate","owner":"품질팀"},{"action":"부적합 보고서(NCR)를 작성하고 시정조치 요청","urgency":"immediate","owner":"품질팀"},{"action":"6/10 전후 중량에 영향을 주는 공정 조건(충전·성형·가열 감량 등)의 설정 변경 이력과 설비 상태 점검","urgency":"within_week","owner":"생산팀/설비팀"},{"action":"원인을 시정한 뒤 중심값을 기준 평균(약 199.9g) 근처로 되돌리고, 산포가 기준 수준으로 줄었는지 Cpk로 재확인","urgency":"within_week","owner":"생산팀"}],"needs_ncr":true},{"series_key":"발효유|pH","interpretation":"발효유 pH는 평균이 그대로입니다(4.406→4.401). 다만 값이 들쑥날쑥한 정도가 기준선의 2배로 커졌고(표준편차 0.043→0.088), 관리한계 밖 값이 6월에 4건(6/1, 6/15, 6/21, 6/29) 나왔습니다. 아직 모두 규격(4.1~4.7) 안이라 합격이지만, 공정 능력이 1.59에서 1.13으로 떨어졌습니다. 조기 경보로 봐야 할 상황입니다.","probable_causes":["추정: 평균은 유지되면서 산포만 커졌으므로 배치마다 결과가 달라지는 요인(발효 조건 편차 등)일 수 있음. 실제 원인은 입력 데이터로 확인되지 않음"],"actions":[{"action":"관리한계를 벗어난 4개 일자(6/1, 6/15, 6/21, 6/29) 배치의 제조 기록을 비교해 공통점 확인","urgency":"within_week","owner":"품질팀/생산팀"},{"action":"pH 측정기 교정 상태와 측정 방법의 일관성 점검(측정 변동이 섞였는지 배제)","urgency":"within_week","owner":"품질팀"},{"action":"산포를 키운 원인을 조치한 뒤 Cpk를 1.33 이상으로 회복했는지 확인","urgency":"next_pm","owner":"생산팀"}],"needs_ncr":false},{"series_key":"소시지|수분","interpretation":"소시지 수분은 평균이 기준과 같고(60.43%), 관리한계 이탈이나 추세도 없습니다. 다만 흩어짐이 조금 커져서(표준편차 0.323→0.439) 최근 Cpk가 1.27로 목표 1.33을 약간 밑돕니다. 규격 상한 62%까지는 여유가 있어 당장 위험하지는 않지만 지켜볼 필요가 있습니다.","probable_causes":["추정: 평균 변화 없이 산포만 소폭 늘었음. 특정 원인을 단정할 근거는 입력 데이터에 없음"],"actions":[{"action":"최근 산포가 커진 구간의 배치 기록을 검토하고, 다음 정기 점검 때 수분에 영향을 주는 공정 조건 확인","urgency":"next_pm","owner":"생산팀"},{"action":"Cpk를 계속 추적해 1.33 회복 여부 확인","urgency":"next_pm","owner":"품질팀"}],"needs_ncr":false},{"series_key":"소시지|염도","interpretation":"소시지 염도가 짜지는 쪽으로 옮겨갔습니다. 6/5부터 26개가 연속으로 기준 평균(1.899%)보다 높았고, 최근 평균은 1.988%입니다. 관리한계 밖 값도 7건(6/17~6/29) 나왔습니다. 6/10 이후로는 하루 약 0.004%씩 계속 오르고 있어, 이대로면 약 48일 뒤 규격 상한 2.2%에 닿는다는 계산입니다(6/30 기준). 아직 합격이고 Cpk도 1.77로 충분하지만, 평균 이동과 추세가 함께 나타나는 조기 경보 상태입니다.","probable_causes":["추정: 6/5 무렵을 기점으로 한쪽으로 치우쳤으므로 그 시점의 배합·원료·설정 변경 같은 요인일 수 있음. 실제 원인은 입력 데이터로 확인되지 않음","추정: 이동 이후에도 상승 추세가 이어지므로 변화 요인이 아직 진행 중일 수 있음"],"actions":[{"action":"현재 염도를 측정해 6/30 이후에도 상승이 이어졌는지 확인(추세대로라면 상한 도달 예상 시점이 가까워졌을 수 있음)","urgency":"immediate","owner":"품질팀"},{"action":"6/5 전후의 배합비, 원료(염지제 등) 로트, 계량 설정 변경 이력 확인","urgency":"within_week","owner":"생산팀/품질팀"},{"action":"원인을 찾으면 염도 중심값을 기준(약 1.90%)으로 되돌리기","urgency":"within_week","owner":"생산팀"}],"needs_ncr":false},{"series_key":"우유|산도","interpretation":"우유 산도가 6/10부터 21개 연속으로 기준 평균(0.150%)보다 높아졌습니다(최근 평균 0.158%). 관리한계 밖 값도 6월 중 8건 나왔습니다. 추세 기울기는 의미가 없는 수준이라(t=0.4), 서서히 오른다기보다 한 번에 높아진 뒤 그 수준에 머무는 모양입니다. 규격 상한 0.18%까지는 여유가 있고 Cpk도 1.53이라 아직 합격입니다. 다만 기준에서 벗어난 상태가 계속되고 있어 조기 경보로 봐야 합니다.","probable_causes":["추정: 6/10 무렵 계단식으로 올라갔으므로 그 시점에 원유·보관·공정 조건 중 무언가가 바뀌었을 수 있음. 실제 원인은 입력 데이터로 확인되지 않음"],"actions":[{"action":"6/10 전후의 원유 입고처·로트, 보관 온도·시간, 공정 조건 변경 이력 비교","urgency":"within_week","owner":"품질팀/생산팀"},{"action":"현재 산도 수준을 확인하고, 원인이 정해지면 기준 수준(약 0.150%)으로 회복했는지 검증","urgency":"within_week","owner":"품질팀"}],"needs_ncr":false}],"monitoring_suggestions":[{"target":"햄|중량","suggestion":"원인 시정이 확인될 때까지 검사 빈도를 늘려 로트마다(또는 교대마다) 중량을 측정합니다. 경보 기준은 관리하한 196.0g 미만 1건, 또는 199.9g 미만 연속 5개로 잡고, 197g 아래에 경고선을 두어 하한 미달 전에 미리 조정할 것을 제안합니다."},{"target":"발효유|pH","suggestion":"평균보다 산포를 보는 관리도(R 또 er","severity":"critical","severity_reason":"조리한 라면에서 약 2cm 크기의 금속성 경질 이물이 나왔다는 신고입니다. 섭취했다면 구강·소화관을 다칠 수 있는 물리적 위해이고, 어린이가 함께 먹는 상황이었습니다. 실제 섭취·상해는 없었으나(신고 내용 기준) 위해 가능성이 높습니다. 공정상 금속검출 단계가 있는데도 2cm 금속이 빠져나왔다면 검출기 이상이나 감도 문제, 또는 검출 이후 혼입 가능성이 있어 같은 로트(A0912-03) 전체에 영향이 있을 수 있습니다(추정). 이물의 실물과 출처는 아직 확인되지 않았습니다.","health_risk":true,"immediate_actions":["고객 연락처·구매처·구매일, 제품 포장(로트·유통기한 표기 부분 포함)과 이물 실물을 보존해 달라고 요청하고, 사진을 먼저 받기","방문 또는 택배로 이물·남은 제품·포장지를 회수하고, 회수 경로와 인계 기록 남기기","실제 섭취·상해 여부(어린이 포함)를 다시 확인하고, 이상이 있으면 진료를 안내하고 비용 처리 절차 알리기","로트 A0912-03 재고·출하 현황을 파악하고, 창고 재고는 임시 출하 보류(품질 책임자 판단)","보관 중인 로트 A0912-03 시료를 금속검출기로 재검사하고 개봉 육안검사하기","A라인 금속검출기 작동·감도를 즉시 확인(Fe/SUS/Non-Fe 테스트피스)","품질 책임자·경영진에 보고하고, 관할 기관 보고 필요 여부와 회수 필요 여부를 검토 개시","고객센터 응대 내용과 접수 시간을 클레임 대장에 기록"],"investigation_items":["회수한 이물 분석: 재질(SUS·알루미늄·철 등), 형상, 크기, 자성 여부, 가공 흔적, 조리·열 이력 흔적","이물을 설비·부품과 대조: 압연 롤러, 절단 칼날, 증숙·유탕 컨베이어 망, 스프 투입기, 포장기 칼날, 볼트·너트·스크린 등의 손상·결손 여부","로트 A0912-03 생산일 A라인 금속검출기 기록: 시작·중간·종료 감도 점검 결과, 리젝트 수량과 리젝트품 처리 내역, 검출기 정지·바이패스 이력","같은 날 설비 점검·수리·부품 교체 이력과 작업 전후 공구·부품 수량 점검 기록","스프·원료(고춧가루 등 분말) 입고 로트의 이물 검사 성적과 협력사 금속검출 여부","원료 체·자석(마그넷) 점검 기록과 부착물 확인","같은 로트·인접 로트의 유사 클레임 이력","금속검출 이후 혼입 가능성 검토(포장 이후 공정, 박스 포장 시 혼입 경로)","유통·소비자 단계 혼입 가능성 검토(조리 도구, 냄비 등): 이물의 조리 흔적 및 재질 비교로 판단, 단정 금지","로트 A0912-03 생산량·출하처 목록 확보(회수 대비)"],"report_to_authority":true,"reply_draft":"고객님, 안녕하세요. 한결 고객센터입니다.\\n\\n먼저 저희 '한결 매운라면'을 드시다가 금속으로 보이는 이물을 발견하셔서 많이 놀라셨을 줄 압니다. 특히 자녀분과 함께 드시는 음식이라 걱정이 더 크셨을 것 같습니다. 진심으로 사과드립니다. 혹시 고객님이나 가족분 중에 드신 뒤 몸에 이상이 있으시면 바로 알려 주십시오. 진료가 필요하시면 안내해 드리고 관련 절차도 도와드리겠습니다.\\n\\n제품과 이물을 보관해 주셔서 감사합니다. 현재 저희는 아래와 같이 조치하고 있습니다.\\n1. 고객님 댁에 담당자가 방문하거나 택배로 이물, 남은 제품, 포장지(로트번호 A0912-03 표기 부분 포함)를 회수하겠습니다. 회수 전까지는 지금 상태 그대로 보관해 주시면 감사하겠습니다.\\n2. 회수한 이물은 재질과 형태를 분석하겠습니다. 함께 해당 로트의 생산·검사 기록, 생산 설비 상태, 금속검출 공정 기록도 조사하겠습니다.\\n3. 같은 로트의 보관 제품도 추가로 검사하겠습니다.\\n\\n조사를 마치면 원인과 재발 방지 대책을 정리해 고객님께 직접 설명드리겠습니다. 보상은 조사 결과와 관계없이 고객님께서 겪으신 불편을 고려해 별도로 안내드리겠습니다. 조사 기간은 회수 후 약 OO일(영업일 기준)이 걸릴 예정이며, 진행 상황은 비기한이 인쇄된 부분을 사진으로 보내 주시면 큰 도움이 됩니다.\\n2. 의사 소견서와 진료비 영수증 사본\\n\\n조사 결과는 ○영업일 안에 담당자가 직접 연락드려 설명드리겠습니다. 진료비 등 보상은 확인 절차에 따라 성실하게 안내드리겠습니다. 궁금하신 점은 언제든 담당자(○○○, 연락처 ○○○-○○○○)에게 연락 주십시오.\\n\\n다시 한번 깊이 사과드립니다.\\n한결 고객센터 드림"},"08c31f1642c365":{"is_claim":true,"category":"quantity","severity":"major","severity_reason":"표시량은 180g인데 소비자가 잰 무게는 120g입니다(약 33% 부족). 표시기준의 내용량 허용오차를 크게 넘을 가능성이 높아 표시·법규 문제로 이어질 수 있습니다. 충진 공정 이상이라면 같은 로트(C0919-01) 전체에 영향이 있을 수 있고, SNS에 공개된 건이라 평판 위험도 큽니다. 현재 제보에는 건강 위해 정황이 없어 critical은 아닙니다. 다만 실링 불량이나 누액으로 내용물이 빠진 것이라면 레토르트 제품의 미생물 위험이 생기므로 확인 결과에 따라 등급을 올려야 합니다. 120g이 내용물만 잰 무게인지, 포장째 잰 무게인지는 확인되지 않았습니다.","health_risk":false,"immediate_actions":["SNS에 공개 1차 응대(사과와 확인 중 안내)를 하고, 개인정보와 상세 확인은 DM 또는 고객센터로 옮기기","소비자에게 확인 요청: 사진(파우치 전체, 로트·유통기한 표시면, 실링부), 잰 무게가 내용물만인지 포장 포함인지, 개봉 전 파우치가 부풀거나 새거나 젖어 있었는지, 구입처와 구입일","가능하면 해당 제품 실물(포장재 포함) 회수 요청","보관 중인 C0919-01 보관 샘플과 창고 재고를 확보하고, 재고는 출하 보류(Hold)","보관 샘플과 재고에서 일정 수량을 뽑아 내용량 긴급 측정(빈 파우치 무게를 뺀 순중량 기준), 실링부 외관·누액도 함께 확인","품질책임자에게 보고하고, 같은 로트의 다른 클레임 접수 여부 확인"],"investigation_items":["C0919-01 충진 기록: 충진기 설정값, 충진량 측정 기록, 시간대별 측정값 추이","중량 선별기(체크웨이어) 기록: 하한 설정값, 불량 배출 건수, 작동·검증(테스트 피스) 기록, 우회 운전 여부","C라인 충진기 정비·고장·비가동 기록, 해당 일자의 노즐 막힘이나 원료 공급 중단 여부","원료 상태 편차: 점도와 건더기(감자·당근 등) 비율이 충진량에 준 영향, 조리 배치 기록","실링 공정: 실링 강도 측정 기록(기준 20N 이상), 실링 불량 발생 여부. 누액으로 내용물이 줄었을 가능성 확인","레토르트 살균 기록(F0 4 이상): 같은 로트의 파우치 파손·팽창 발생 여부","검사·포장 공정의 출하 전 중량 검사 기록과 샘플링 결과","같은 로트·같은 기간 생산분의 과거 내용량 클레임 이력","로트 출하량과 유통처 현황(회수가 필요할 때를 대비)"],"report_to_authority":true,"reply_draft":"안녕하세요, 한결식품입니다.\\n드신 '한결 순한 카레'의 내용량이 표시된 양(180g)보다 적어 많이 실망하셨을 텐데 진심으로 사과드립니다. 알려주셔서 감사합니다.\\n\\n말씀하신 제품(로트 C0919-01)은 지금 같은 로트의 보관 샘플과 생산·검사 기록을 확인하고 있습니다. 원인은 확인 후 정확하게 안내드리겠습니다.\\n\\n정확한 확인을 위해 개인 메시지(DM)로 아래 내용을 알려주시면 감사하겠습니다.\\n- 제품 사진(파우치 전체, 유통기한·로트 표시 부분, 봉합 부분)\\n- 측정하신 120g이 내용물만의 무게인지, 포장째 잰 무게인지\\n- 개봉 전 파우치가 새거나 젖어 있거나 부풀어 있지는 않았는지\\n- 구입처와 구입일, 연락처\\n\\n혹시 파우치가 새 있었거나 부풀어 있었다면 드시지 말고 보관해 주시면 감사하겠습니다. 제품을 회수할 수 있다면 회수 방법도 따로 안내드리겠습니다. 교환이나 환불 등 보상은 확인 결과와 함께 안내드리겠습니다.\\n\\n조사가 끝나면 결과와 재발 방지 대책도 직접 알려드리겠습니다. 다시 한번 불편을 드려 죄송합니다.\\n\\n한결식품 고객지원팀 드림"},"1b7c2a217bc2ee":{"is_claim":true,"category":"spoilage","severity":"major","severity_reason":"쩐내가 나고 튀김이 빨리 어두워지는 것은 유지 산패(산화·가수분해)를 의심할 수 있는 증상입니다(추정). 산가(규격 0.6 이하)와 과산화물가(규격 10 이하)는 규격 항목이므로, 제조 단계에서 기준을 넘었다면 같은 로트 전체의 문제가 될 수 있습니다. 반면 개봉 후 관리(가스레인지 근처 보관, 빛 노출, 재사용 등) 때문일 가능성도 있어 원인은 아직 확정할 수 없습니다. 이물·알레르기처럼 바로 위해가 생기는 경우는 아니지만, 산패한 기름을 먹으면 소화기 불편이 생길 수 있고 규격 위반 가능성도 있어 major로 판단했습니다. 보관 샘플이 규격을 넘으면 critical로 올려야 합니다.","health_risk":true,"immediate_actions":["고객에게 해당 제품 사용 중단을 안내하고, 남은 제품과 용기를 회수 요청(사진: 로트·유통기한 표시면, 남은 양)","고객 추가 확인: 개봉일, 사용 횟수(튀김유 재사용 여부), 보관 위치(가스레인지·창가 근처 여부, 실온 정도), 뚜껑을 잘 닫아 두었는지, 섭취 후 불편 증상 여부","섭취 후 이상 증상이 있으면 의료기관 진료를 안내하고 내용을 기록","O0910-05 보관 샘플을 확보하고 관능검사(냄새·색) 실시, 산가·과산화물가 긴급 분석","같은 로트·인접 로트에 비슷한 클레임이 있는지 확인(고객센터·유통처)","결과가 나올 때까지 O0910-05 출하 보류 검토. 창고·유통 재고 수량 파악","보관 샘플이나 회수품이 산가·과산화물가 규격을 넘으면 회수 및 관할 기관 보고 여부를 즉시 검토"],"investigation_items":["O0910-05 출하검사 성적서의 산가·과산화물가 실측값, 규격 대비 여유","보관 샘플과 회수품의 산가·과산화물가·관능 비교(유통·소비자 보관 영향과 제조 문제를 구분)","정제·탈취 공정 기록: 탈취 온도·진공도·시간, 이탈 이력","원료 대두유(조유) 입고 로트의 산가·과산화물가 성적과 원료 저장 기간·탱크 조건","충진 공정(E라인): 질소 치환 여부와 헤드스페이스 산소 관리, 충진 온도 기록","캡핑 토크와 밀봉 불량 여부(산소 유입 가능성)","용기 재질의 차광성, 출하 후 유통·보관 온도와 직사광선 노출 이력","산화방지제 사용 여부와 투입량 기록(해당하는 경우)","같은 로트와 인접 로트의 클레임 이력, 추세"],"report_to_authority":false,"reply_draft":"안녕하십니까, 고객님. 한결 콩기름(1.8L)을 사용하시면서 평소와 다른 냄새와 튀김 색 변화로 불편을 겪으셨다니 진심으로 사과드립니다.\\n\\n현재 원인을 정확히 확인하기 위해 아래와 같이 조치하고 있습니다.\\n- 같은 생산 로트(O0910-05)의 보관 샘플로 품질 분석(산가·과산화물가 등)을 진행하고 있습니다.\\n- 생산·출하 기록을 점검하고 있습니다.\\n\\n정확한 확인을 위해 다음 사항을 부탁드립니다.\\n1. 해당 제품은 사용을 멈춰 주시기 바랍니다.\\n2. 남은 제품을 버리지 말고 보관해 주시면, 저희가 직접 회수해 분석하겠습니다. 회수 일정은 담당자가 따로 연락드리겠습니다.\\n3. 개봉하신 시기, 사용 횟수, 보관 장소(가스레인지 근처인지 등)를 알려주시면 원인 확인에 큰 도움이 됩니다.\\n4. 혹시 드신 뒤 몸에 이상이 있으시면 바로 의료기관 진료를 받으시고 저희에게도 알려주시기 바랍니다.\\n\\n분석 결과는 확인되는 대로 안내드리고, 결과에 따라 제품 교환이나 환불 등 적절한 보상을 해 드리겠습니다. 다시 한번 불편을 드려 죄송합니다.\\n\\n[담당자명 / 연락처]"},"18f67ef2bbf3ba":{"is_claim":true,"category":"foreign_matter","severity":"major","severity_reason":"개봉 직후 면 사이에서 살아 있는 벌레가 발견됐다는 이물 클레임이고, 사진 증거가 있습니다. 위생상 위해 가능성이 있고 벌레는 행정 보고 대상 이물이라 '중대(major)'로 분류했습니다. 금속·유리처럼 날카로운 이물이나 독성·알레르기 위해는 아니어서 '치명(critical)'으로 보지는 않았습니다. 다만 같은 로트에서 클레임이 추가로 들어오거나 포장 내부 서식이 확인되면 critical로 올려야 합니다. 참고로 유통기한 내년 3월과 소비기한 180일을 맞춰 보면 9월 20일 전후 생산으로 추정되며, 로트번호 A0920-02와 맞습니다(추정).","health_risk":true,"immediate_actions":["고객 응대: 당일 회신하고, 남은 제품·포장지·벌레를 버리지 말고 밀봉 비닐에 보관해 달라고 요청합니다. 회수 방문이나 택배 수거 일정을 잡습니다.","첨부 사진을 원본 해상도로 확보합니다. 벌레의 종류와 성장 단계(유충·성충·번데기)를 1차 판독합니다. 예를 들어 화랑곡나방 유충인지, 쌀바구미 같은 저장 곡물 해충인지 확인합니다.","구입처, 구입일, 보관 장소와 기간, 개봉 일시, 포장 손상(구멍·찢김) 여부를 고객에게 확인합니다.","관할 기관 이물 보고 대상인지 검토합니다. 벌레는 소비자 이물 신고 시 영업자 보고 대상으로 알려져 있으므로 품질·법무 담당이 기한과 절차를 확인한 뒤 보고합니다.","로트 A0920-02의 보관 샘플을 확보하고 개봉 검사를 합니다. 창고·유통 재고는 표본 점검을 하고, 결과가 나올 때까지 출하 보류를 검토합니다.","같은 로트와 인접 로트의 클레임 이력을 조회합니다. 홈페이지, 콜센터, 유통사 채널을 모두 확인합니다.","클레임 대장에 등록하고 품질팀장에게 보고합니다(major 등급)."],"investigation_items":["벌레 동정: 종, 성장 단계, 생사 여부를 확인하고 필요하면 외부 기관에 의뢰합니다. 생산 후 약 3주가 지났으므로(추정) 이 기간과 벌레의 성장 단계가 맞는지 따져 봅니다.","유탕 공정 기록(A0920-02): 유탕 온도·시간 기록을 확인합니다. 유탕을 거친 뒤에는 벌레가 살아남기 어려워서 냉각 이후 단계나 유통 중에 들어갔을 가능성을 검토합니다(추정이며 단정하지 않음).","냉각, 스프 투입, 포장 구역의 방충·방서 기록을 봅니다. 포충등·트랩 모니터링 결과, 해당일 전후 포획 수와 종류, 방역업체 점검 보고서가 대상입니다.","스프 원료(고춧가루, 양파분말 등)를 조사합니다. 입고 검사 기록, 공급사 성적서(COA), 원료 보관 조건, 저장 해충 관리 기록을 확인합니다.","포장재와 밀봉 상태를 확인합니다. 회수품 포장에 핀홀이나 벌레가 뚫은 흔적(천공)이 있는지, 실링 강도와 실링 불량 기록, 포장 필름 입고 검사 기록을 봅니다.","보관 샘플과 같은 로트 재고를 개봉 검사합니다. 벌레, 배설물, 거미줄 모양 실(화랑곡나방 유충 흔적)이 있는지 봅니다.","출하 후 이력을 확인합니다. 자사 창고와 물류센터의 보관 조건 및 방충 기록, 유통·판매처 보관 환경을 확인할 수 있는 범위에서 조사합니다.","같은 날 A라인의 생산 기록을 확인합니다. 설비 세척·위생 점검표, 공정 중 이상이나 정지 이력이 대상입니다."],"report_to_authority":true,"reply_draft":"안녕하세요, 고객님. 한결 고객지원팀입니다.\\n\\n먼저 저희 '한결 매운라면'을 드시려다 이런 일을 겪게 해 드려 진심으로 사과드립니다. 사진과 함께 자세히 알려 주셔서 감사합니다.\\n\\n[조치 사항]\\n보내 주신 내용과 사진은 품질관리팀에 바로 전달했습니다. 해당 제품(로트 A0920-02)은 생산 기록, 공정 위생 기록, 같은 로트 보관 샘플을 기준으로 원인을 조사하고 있습니다. 정확한 원인을 밝히려면 실물을 확인해야 해서 부탁을 드립니다. 남은 제품과 포장지, 발견하신 벌레를 버리지 말고 비닐봉지 등에 밀봉해 보관해 주세요. 담당자가 회수 방법(방문 또는 택배 수거)을 따로 안내해 드리겠습니다.\\n\\n[후속 안내]\\n원인 조사에 참고하려 하니 아래 내용을 알려 주시면 감사하겠습니다.\\n- 구입처와 구입 시기\\n- 구입 후 보관 장소와 기간\\n- 포장에 구멍이나 찢어진 곳이 있었는지\\n\\n조사 결과는 확인되는 대로 고객님께 직접 알려 드리겠습니다. 제품 교환이나 환불도 원하시는 방법으로 도와드리겠습니다. 회신이나 회수 일정 안내를 받으실 연락처를 남겨 주시면 담당자가 바로 연락드리겠습니다.\\n\\n다시 한번 불편을 드려 죄송합니다. 더 안전한 제품을 만들 수 있도록 철저히 확인하겠습니다.\\n\\n한결 고객지원팀 드림"},"07563d28c18c3d":{"is_claim":true,"category":"labeling","severity":"major","severity_reason":"날짜 표시 오류(유통기한이 제조일보다 앞선 날짜)입니다. 이물·알레르기와 달리 직접적인 위해 근거는 없습니다. 다만 둘 중 어느 날짜가 맞는지 확인되기 전에는 소비자가 섭취해도 되는지 판단할 수 없습니다. 날짜 인쇄는 보통 로트 단위로 설정되므로 로트 B0921-02 전체가 영향을 받았을 가능성이 있습니다(추정). 또한 제조일이나 기한을 사실과 다르게 표시한 경우 법적 표시 위반이나 회수 대상에 해당할 수 있어 major로 분류합니다. 실제 날짜 기준으로 기한이 지난 제품이 유통된 것으로 확인되면 상향을 검토해야 합니다.","health_risk":false,"immediate_actions":["고객에게 확인 전까지 섭취를 보류하도록 안내하고, 제품 회수(수거)와 교환·환불을 안내합니다.","고객에게 라벨 사진(제조일·기한·로트 인쇄 부분)을 받고, 구매처와 구매일을 확인합니다.","로트 B0921-02의 사내 재고와 보류 샘플을 출하 보류하고, 라벨 날짜 인쇄 상태를 바로 확인합니다.","로트 B0921-02의 출하처와 수량을 파악해 유통 재고 회수에 대비합니다.","품질 책임자에게 보고하고, 표시 위반·회수 대상 해당 여부와 관할 기관 보고 필요성을 법규 기준으로 검토하도록 요청합니다.","같은 날 B라인에서 라벨링한 다른 로트도 날짜 이상이 있는지 확인합니다."],"investigation_items":["로트 B0921-02의 실제 제조일을 생산일지와 배합·충진 기록으로 확인하고, 라벨의 제조일과 기한 중 어느 쪽이 틀렸는지 판정합니다.","실제 제조일에 소비·유통기한 설정값(365일)을 더해 정상 기한을 계산하고, 라벨과 비교합니다.","라벨링 공정의 날짜 인쇄 설정 기록을 확인합니다. 인쇄기 날짜·기한 입력값, 작업 시작 시 설정 확인 기록, 변경 이력, 작업자를 봅니다.","라벨링 공정의 첫 제품과 주기별 표시 확인 기록이 있는지, 검사에서 왜 놓쳤는지 확인합니다.","인쇄기 날짜가 자동 계산인지 수동 입력인지, 시스템 시계 오류나 입력 실수가 있었는지 확인합니다.","라벨 원지가 '유통기한' 문구가 들어간 옛 라벨인지 확인합니다. 소비기한 표시제가 시행되었으므로 표시 기준에 맞는지도 함께 점검합니다.","보류 샘플과 사내 재고에서 같은 오류가 로트 전체에 있는지, 일부 구간에만 있는지 확인합니다.","실제 기한을 넘긴 제품이 유통 중인지 확인합니다. 해당되면 보류 샘플의 품질 상태(brix 38~42, pH 4.6 이하, 관능)도 확인합니다.","출하 기록으로 로트 B0921-02의 유통 범위와 수량을 확인합니다."],"report_to_authority":true,"reply_draft":"고객님, 안녕하세요. 한결 고객센터입니다.\\n\\n먼저 구매하신 '한결 데리야끼 소스(병)'의 날짜 표시가 잘못되어 불편과 걱정을 드린 점 진심으로 사과드립니다.\\n\\n말씀하신 제품(로트 B0921-02)은 지금 생산·라벨링 기록으로 실제 제조일과 기한을 확인하고 있습니다. 표시된 날짜가 맞는지 확인되기 전까지는 드시지 말고 보관해 주시기 바랍니다. 해당 제품은 저희가 회수해 정확한 원인을 조사하겠습니다. 새 제품으로 교환하거나 환불해 드리겠습니다. 확인에 도움이 되도록 라벨(날짜 인쇄 부분) 사진과 구매처를 알려주시면 감사하겠습니다.\\n\\n조사 결과는 확인되는 대로 이 연락처로 안내드리겠습니다. 같은 문제가 다시 생기지 않도록 표시 공정의 확인 절차도 점검하겠습니다. 다시 한번 불편을 드려 죄송합니다.\\n\\n한결 고객센터 드림"},"172c3c424c78dd":{"is_claim":false,"category":"taste_odor","severity":"inquiry","severity_reason":"소비자가 직접 '불량이 아닌 의견'이라고 밝혔습니다. 이물·알레르기·부패·이상 증상 같은 건강 위해 요소도 언급되지 않았습니다. 내용은 맛(매움·짠맛)에 대한 개인 의견과 레시피 변경 여부 문의입니다. 다만 '예전 맛과 완전히 다르다'는 표현은 스프 투입량 편차나 배합 이상의 신호일 수 있습니다(추정). 나트륨 규격(1인분 최대 1800mg)과 관련된 내용이라 해당 로트를 간단히 확인할 것을 권장합니다. 같은 로트에서 비슷한 의견이 반복되면 minor 이상으로 재분류를 검토해야 합니다.","health_risk":false,"immediate_actions":["SNS 게시글 원문 캡처·보관, 접수 대장에 '의견/문의(taste_odor)'로 등록 (로트 A0924-01)","마케팅/R&D에 '새로 나온 매운라면'이 리뉴얼·신제품·레시피 변경에 해당하는지 확인 (회신 전에 사실관계 확정 필요)","SNS 채널에서 1차 공감·감사 응대를 하고, 상세 확인은 DM이나 고객센터로 안내","로트 A0924-01 및 인접 로트에 비슷한 맛 관련 의견·클레임이 있는지 조회","보관 샘플(같은 로트)이 있으면 관능 확인 요청"],"investigation_items":["레시피·배합비 변경 이력: 스프 배합표 버전, 변경일, 적용 시작 로트, 변경 승인 기록","로트 A0924-01 스프 투입 공정 기록: 스프 투입기 설정값, 중량 체크 기록(스프 중량 편차), 이상 발생 기록","스프 원료 로트 추적: 고춧가루(매운맛 강도/스코빌 등 COA), 정제염·간장분말 입고 로트 및 공급사 변경 여부","로트 A0924-01 나트륨 분석값과 규격(1인분 ≤1800mg) 적합 여부 확인. 기록이 없으면 보관 샘플로 분석 검토","보관 샘플 관능평가: 표준품 또는 이전 로트와 매운맛·짠맛 비교","같은 기간 A라인 생산 로트의 소비자 의견 추이(SNS·고객센터)"],"report_to_authority":false,"reply_draft":"안녕하세요, 한결입니다.\\n한결 매운라면을 드셔 보시고 소중한 의견을 남겨 주셔서 감사합니다. 기대하신 맛과 달라 아쉬우셨을 텐데 죄송합니다.\\n\\n말씀해 주신 내용(제조번호 A0924-01, 스프가 맵고 짜게 느껴지며 예전 맛과 다르다는 점)은 담당 부서에 그대로 전달했습니다. 레시피 변경 여부와 해당 제조 로트의 생산 기록을 확인하고 있습니다.\\n\\n확인 결과는 정리되는 대로 다시 안내드리겠습니다. 더 자세한 상담이 필요하시면 DM이나 고객센터([연락처])로 편하게 연락 주세요.\\n앞으로도 더 좋은 맛을 드릴 수 있도록 고객님의 의견을 꼼꼼히 살피겠습니다. 감사합니다.\\n\\n※ 검토 메모: 레시피 변경 사실이 확인되기 전에는 '변경되었다/변경되지 않았다'를 회신에 쓰지 말 것."},"1f3f0e18548949":{"title":"우유 산도 상승 추세(규격 이내) 확인 – 6/10 이후 0.158~0.162, 3번 탱크 원유 로트 변경과의 관련성 조사 필요","nc_type":"other","severity":"minor","severity_reason":"측정값(0.158~0.162)이 규격(0.18 이하) 이내라서 메모 기준으로는 규격 부적합이 아닙니다. 다만 평소 수준(0.150 근처)에서 계속 올라간 이상 추세(trend deviation)이고 재검사를 하지 않아 데이터 신뢰성이 확인되지 않았습니다. 그래서 잠정적으로 minor로 분류합니다. 재검사나 원유 조사 결과에 따라 상향될 수 있습니다.","facts":[{"label":"이상 시작 시점","value":"6/10부터","source_quote":"우유 산도 6/10부터 계속 0.158~0.162 나옴"},{"label":"측정값 범위","value":"산도 0.158~0.162 (지속)","source_quote":"우유 산도 6/10부터 계속 0.158~0.162 나옴"},{"label":"규격","value":"0.18 이하 (합격)","source_quote":"규격은 0.18 이하라서 합격이긴 한데"},{"label":"평소 수준","value":"0.150 근처","source_quote":"원래 0.150 근처였음"},{"label":"원유 로트 변경","value":"6/9에 3번 탱크 원유 입고 로트 변경","source_quote":"6/9에 3번 탱크 원유 입고 로트가 바뀌었음"},{"label":"재검사 여부","value":"미실시","source_quote":"재검사는 아직 안 함"},{"label":"담당자","value":"박OO","source_quote":"담당 박OO"}],"affected_scope":"[메모로 알 수 있는 것] 6/10 이후 측정한 우유의 산도가 계속 0.158~0.162로 나왔습니다. 6/9에 3번 탱크 원유 입고 로트가 바뀌었습니다.\\n[메모로 알 수 없는 것] 해당 제품 로트, 생산 수량, 출하 여부, 제품명(품목)을 알 수 없습니다. 산도 상승 제품이 3번 탱크 원유만 쓴 것인지, 다른 탱크 원유와 섞인 것인지도 확인되지 않았습니다. 원유 단계에서도 산도가 올랐는지, 측정 시점(원유/공정/완제품)과 단위(예: 젖산 %)도 메모에 없습니다. 현재(10/13) 기준으로 이 추세가 계속되는지와 해당 연도도 확인이 필요합니다.","immediate_actions":["6/10 이후 측정 시료(보관 시료가 있으면)와 현재 생산품으로 산도를 재검사하고, 측정기 교정 상태와 시약을 함께 점검","3번 탱크 원유(6/9 입고 로트)와 다른 탱크 원유의 산도를 비교 측정","현재 재고(미출하분)의 로트를 파악하고, 품질 책임자가 판단할 때까지 출하 보류 여부를 검토","6/9 원유 로트의 입고검사 기록(산도, 온도, 세균수 등)과 공급자 정보 확보"],"disposition":{"proposal":"undetermined","reason":"규격 이내라서 현 시점에서 불합격 처분 근거는 없습니다. 하지만 재검사를 하지 않았고 원인과 영향 범위도 확인되지 않았습니다. 재검사와 원유 조사 결과를 본 뒤 정상 출하할지 보류할지 정하자는 제안이며, 최종 판정은 품질 책임자가 합니다. 미출하 재고의 임시 보류 여부도 품질 책임자의 판단 사항입니다."},"five_whys":[{"why":"왜 우유 산도가 평소(0.150 근처)보다 높게 나오는가?","answer":"6/10부터 0.158~0.162가 계속 측정되고 있음. 측정 오차인지 실제 상승인지는 재검사를 하지 않아 미확인","basis":"memo"},{"why":"왜 6/10부터 상승했는가?","answer":"하루 전인 6/9에 3번 탱크 원유 입고 로트가 바뀜. 시점이 맞아 관련 가능성이 있음(인과는 미확인)","basis":"memo"},{"why":"왜 원유 로트 변경이 산도에 영향을 줄 수 있는가?","answer":"새 로트 원유의 초기 산도나 세균수가 높았거나, 수송·저장 온도 관리에 차이가 있었을 가능성(추정)","basis":"assumption"},{"why":"왜 입고 단계에서 걸러지지 않았는가?","answer":"원유 입고검사 기준이 규격 합부만 판정하고 평소 대비 추세 변화는 관리하지 않았을 가능성(추정)","basis":"assumption"}],"corrective_actions":["재검사 결과로 실제 산도가 올랐는지 확정(측정 오류 배제)","3번 탱크 원유 로트와 산도 상승의 관련성을 원유와 제품 산도 비교로 검증","관련성이 확인되면 공급자에게 원유 품질(산도, 세균수, 수송 온도) 개선을 요청하고 입고검사를 강화","3번 탱크 세척·살균(CIP) 기록과 저장 온도·시간 기록 점검"],"preventive_actions":["산도에 경고 기준(alert/action level)을 두어 규격 이내라도 평소 대비 이탈하면 즉시 보고하는 추세 관리 도입(예: 관리도)","원유 로트나 공급자가 바뀔 때 초기 몇 로트의 산도 등 품질 지표를 집중 모니터링","이상 추세가 확인되면 재검사를 언제까지 해야 하는지 절차서에 명시"],"missing_info":["해당 연도와 현재(10/13)까지 추세가 계속되는지, 6/10 이후 전체 측정 데이터가 있는지?","산도 단위와 시험 방법(예: 젖산 %, 적정법)은 무엇인지?","측정 시점은 원유, 살균 후, 완제품 중 어디인지?","산도가 오른 제품의 품목, 로트 번호, 생산 수량, 출하 여부와 출하처는?","해당 제품이 3번 탱크 원유만 썼는지, 다른 탱크 원유를 섞었는지?","6/9 입고 원유 로트 번호, 공급자, 입고검사 결과(산도, 온도, 세균수)는?","다른 탱크 원유를 쓴 제품의 산도도 올랐는지?","측정 장비 교정 이력, 시약 교체, 측정자 변경이 있었는지?","같은 기간 공정 조건(살균 온도·시간, 저장 온도·시간, CIP)에 변경이 있었는지?","'0.150 근처'라는 평소 수준의 근거 데이터(기간, 평균, 편차)는?","재검사 계획과 담당자 박OO의 소속·직책은?"],"report_to_authority":false,"report_markdown":"# 부적합(이상 추세) 보고서 – 초안\\n\\n> 사람이 검토할 초안입니다. 최종 판정은 품질 책임자가 합니다.\\n\\n## 1. 개요\\n| 항목 | 내용 |\\n|---|---|\\n| 제목 | 우유 산도 상승 추세(규격 이내), 6/10 이후 0.158~0.162 |\\n| 유형 | 이상 추세(규격 이내), 원인 조사 필요 |\\n| 등급(잠정) | Minor. 재검사 결과에 따라 재평가 |\\n| 발생 일자 | 6/10부터 (연도 확인 필요) |\\n| 발견 / 담당자 | 박OO (소속·직책 확인 필요) |\\n| 대상 제품 / 로트 / 수량 | 확인 필요 |\\n| 측정 시점 / 단위 / 시험법 | 확인 필요 |\\n| 출하 여부 | 확인 필요 |\\n\\n## 2. 현상 (메모 기준 사실)\\n- 우유 산도가 6/10부터 계속 **0.158~0.162**로 나옵니다.\\n- 규격은 **0.18 이하**라서 측정값은 **합격**입니다.\\n- 평소 수준은 **0.150 근처**였습니다.\\n- **6/9에 3번 탱크 원유 입고 로트가 변경**됐습니다.\\n- **재검사는 아직 하지 않았습니다.**\\n\\n## 3. 영향 범위\\n- 알 수 있는 것: 6/10 이후 측정한 우유 산도가 계속 올라 있고, 6/9에 3번 탱크 원유 로트가 바뀌었습니다.\\n- 확인 필요: 해당 제품과 로트, 수량, 출하 여부, 3번 탱크 원유를 쓴 범위, 현재까지 추세가 이어지는지 여부\\n\\n## 4. 즉시 조치 (제안)\\n1. 보관 시료와 현 생산품 산도 재검사, 측정기 교정·시약 점검\\n2. 3번 탱크 원유(6/9 로트)와 다른 탱크 원유의 산도 비교\\n3. 미출하 재고 파악 및 출하 보류 여부 검토(품질 책임자 판단)\\n4. 6/9 원유 로트 입고검사 기록과 공급자 정보 확보\\n\\n## 5. 처분 (제안)\\n- **보류 판단(미결정)**: 규격 이내라 불합격 근거는 없습니다. 재검사와 조사 결과를 본 뒤 결정할 것을 제안합니다.\\n\\n## 6. 원인 분석 (5Why, 원인 미확정)\\n| 단계 | 질문 | 답 | 근거 |\\n|---|---|---|---|\\n| 1 | 왜 산도가 평소보다 높은가? | 6/10부터 0.158~0.162 지속. 재검사를 안 해 측정 오차인지 미확인 | 메모 |\\n| 2 | 왜 6/10부터인가? | 6/9 3번 탱크 원유 로트 변경과 시점이 맞음(인과 미확인) | 메모 |\\n| 3 | 왜 원유 로트가 영향을 주는가? | 원유 초기 산도·세균수, 수송·저장 온도 차이 가능성 | 추정 |\\n| 4 | 왜 입고에서 걸러지지 않았나? | 입고검사가 규격 합부만 보고 추세는 관리하지 않았을 가능성 | 추정 |\\n\\n## 7. 시정 조치 (제안)\\n- 재검사로 실제 상승 여부 확정\\n- 원유 로트와 산도 상승의 관련성 검증\\n- 관련성이 확인되면 공급자 개선 요청과 입고검사 강화\\n- 3번 탱크 CIP·저장 온도 기록 점검\\n\\n## 8. 재발 방지 (제안)\\n- 산도 경고 기준(alert/action level)과 추세 관리 도입\\n- 원유 로트·공급자 변경 시 초기 로트 집중 모니터링\\n- 이상 추세 발견 시 재검사 기한을 절차서에 명시\\n\\n## 9. 관할 기관 보고\\n- 메모 기준 규격 이내이므로 보고 대상은 아닌 것으로 판단합니다. 재검사에서 규격을 벗어나거나 위해 우려가 확인되면 재검토합니다.\\n\\n## 10. 현장 확인 필요 사항\\n- 연도와 현재까지 추세가 이어지는지, 전체 측정 데이터\\n- 산도 단위·시험법, 측정 시점\\n- 제품, 로트, 수량, 출하 여부와 출하처\\n- 3번 탱크 원유 사용 범위, 다른 탱크 원유 제품의 산도\\n- 6/9 원유 로트 번호, 공급자, 입고검사 결과\\n- 장비 교정, 시약, 측정자 변경 여부\\n- 공정 조건 변경 여부\\n- 평소 수준(0.150)의 근거 데이터\\n- 재검사 계획, 담당자 소속·직책\\n\\n| 작성 | 검토 | 승인(품질 책임자) |\\n|---|---|---|\\n| 확인 필요 | 확인 필요 | 확인 필요 |\\n"},"1a7f03587a302a":{"title":"햄 슬라이스 중량 하한 규격 미달(6/24 194.2g×2, 6/27 193.8g×1) 부적합 보고서(초안)","nc_type":"spec_deviation","severity":"major","severity_reason":"식품 안전 위해는 아니지만 중량 미달은 내용량 표시 문제(소비자 클레임·법적 허용오차 문제)로 이어질 수 있습니다. 서로 다른 두 날짜(6/24, 6/27)에 발생했고, 6/20부터 평균이 낮아졌다는 현장 관찰이 있어 일회성이 아닌 공정 경향일 가능성이 있습니다(추정). 해당 생산분도 이미 포장되어 창고에 있습니다. 미달 폭은 하한 대비 0.8~1.2g입니다. 표시중량과 법적 허용오차를 확인한 뒤 등급을 다시 판단해야 합니다.","facts":[{"label":"제품/검사 항목","value":"햄 슬라이스 중량","source_quote":"햄 슬라이스 중량"},{"label":"1차 발생(6/24)","value":"6/24 오후 검사에서 194.2g 2개","source_quote":"6/24 오후 검사에서 194.2g 두 개 나옴"},{"label":"규격","value":"195~205g","source_quote":"(규격 195~205)"},{"label":"2차 발생(6/27)","value":"193.8g 1개","source_quote":"6/27에도 193.8g 1개"},{"label":"충진기 설정값 확인 여부","value":"미확인","source_quote":"충진기 설정값은 아직 안 봤음"},{"label":"경향 관찰","value":"6/20부터 평균이 낮아진 느낌(정량 데이터 없는 현장 관찰)","source_quote":"6/20부터 평균이 좀 낮아진 느낌"},{"label":"해당 생산분 상태","value":"포장 완료 후 창고 보관","source_quote":"해당 시간 생산분은 포장까지 끝나서 창고에 있음"}],"affected_scope":"메모로 알 수 있는 것: 6/24 오후 검사분과 6/27 검사분에서 미달품이 나왔습니다. 해당 시간 생산분은 포장 후 창고에 있습니다. 6/20 이후 평균이 낮아졌다는 정성적 관찰도 있습니다.\\n메모로 알 수 없는 것: 로트번호, 생산 시간대, 생산 수량, 검사 샘플 수와 전체 측정값, 6/27분의 보관 또는 출고 상태, 6/20~6/27 사이 다른 날짜 생산분의 상태, 출고 여부, 표시중량, 연도.\\n6/20 이후 전체 생산분이 영향을 받았을 수 있습니다(추정). 데이터로 범위를 확정해야 합니다.","immediate_actions":["6/24 오후·6/27 해당 시간 생산분의 창고 재고를 출고 보류하고 식별표를 부착해 격리합니다.","6/20 이후 생산분의 출고 여부를 확인하고, 미출고분은 판정 전까지 보류를 검토합니다.","보류 재고에서 표본을 뽑아 중량을 다시 측정합니다. 가능하면 전수 선별 또는 체크웨이어로 재검을 검토합니다.","충진기 설정값과 변경 이력을 즉시 확인하고, 현재 생산분의 중량 모니터링 빈도를 높입니다.","계량기(저울) 영점과 교정 상태를 확인합니다."],"disposition":{"proposal":"hold","reason":"표시중량, 법적 허용오차, 재고 내 미달품 비율이 확인되지 않아 최종 처분을 결정할 수 없습니다. 재측정·선별 결과에 따라 미달품만 골라내는 선별(rework)이나 조건부 출하를 검토할 수 있습니다. 이는 제안이며, 최종 판정은 품질 책임자가 합니다."},"five_whys":[{"why":"왜 부적합인가?","answer":"6/24에 194.2g 2개, 6/27에 193.8g 1개가 하한 규격 195g에 못 미쳤습니다.","basis":"memo"},{"why":"왜 개별 제품 중량이 하한 아래로 내려갔는가?","answer":"충진량이 줄었거나 중량 산포가 커졌을 가능성이 있습니다. 6/20부터 평균이 낮아졌다는 관찰은 있지만 정량 데이터는 없습니다.","basis":"assumption"},{"why":"왜 충진량이 줄었거나 산포가 커졌는가?","answer":"충진기 설정값 변경·드리프트, 원료 물성(밀도·온도) 변화, 슬라이스 두께 편차 등이 후보입니다. 충진기 설정값은 아직 확인하지 않았습니다.","basis":"assumption"},{"why":"왜 6/20부터 시작된 평균 하락 경향이 미달 발생 전에 걸러지지 않았는가?","answer":"중량 데이터를 관리도(SPC) 등으로 추세 관리하지 않고 감각적 관찰에만 의존했을 가능성이 있습니다.","basis":"assumption"}],"corrective_actions":["충진기 설정값을 확인하고 기준값과 비교합니다. 차이가 있으면 기준값으로 복원하고 변경 이력을 남깁니다.","6/20 이후 중량 검사 기록을 날짜별 평균·표준편차로 정리해 하락 시점과 영향 범위를 확정합니다.","원인 확인 후 보류 재고를 재선별하고, 미달품은 품질 책임자 판정에 따라 처리합니다.","저울 교정 상태를 확인하고, 이상이 있으면 해당 기간 측정값의 유효성을 재검토합니다."],"preventive_actions":["중량 X-bar/R 관리도를 도입하고, 평균이 일정 기준을 벗어나는 추세가 보이면 조치 기준을 마련합니다.","하한 근접 시 경보가 울리도록 관리 하한(내부 관리 기준)을 규격보다 엄격하게 설정하는 방안을 검토합니다.","충진기 설정값 변경 시 승인·기록 절차를 마련하고, 시업 점검표에 설정값 확인 항목을 추가합니다.","체크웨이어 등 인라인 전수 중량 검사를 도입할지 검토합니다."],"missing_info":["해당 제품명, 품목코드, 로트번호(6/24, 6/27 각각)는 무엇입니까?","연도는 언제입니까? 오늘(10/13) 기준으로 시차가 있어 출고·유통 여부 확인이 필요합니다.","6/24 오후와 6/27 미달품이 나온 생산 시간대와 해당 시간 생산 수량은 얼마입니까?","검사 샘플 수와 전체 측정값(미달품 외 값 포함)은 어떻게 됩니까?","6/27 생산분도 창고에 있습니까? 이미 출고된 수량이 있습니까?","포장 표시중량은 몇 g입니까? 195~205g은 내부 규격입니까, 법적 기준과 연동된 규격입니까?","6/20 이후 평균 하락을 뒷받침하는 기록(일별 평균값)이 있습니까?","충진기 설정값과 최근 변경 이력(6/20 전후)은 어떻게 됩니까?","6/20 전후로 원료 로트, 작업자, 설비 정비 등 변경점이 있었습니까?","사용한 저울의 교정 일자와 상태는 어떻게 됩니까?","최초 발견자와 보고자는 누구이며, 발견 후 취한 조치가 있습니까?","사용 라인과 충진기 호기는 무엇입니까?"],"report_to_authority":false,"report_markdown":"# 부적합 보고서 (초안)\\n\\n**제목:** 햄 슬라이스 중량 하한 규격 미달 (6/24, 6/27)\\n**작성일:** 2026-10-13 (초안, 품질 책임자 검토 필요)\\n**작성자/발견자:** 확인 필요\\n\\n## 1. 개요\\n| 항목 | 내용 |\\n|---|---|\\n| 제품명/품목코드 | 햄 슬라이스 / 확인 필요 |\\n| 로트번호 | 확인 필요 |\\n| 발생일 | 6/24(오후 검사), 6/27 (연도 확인 필요) |\\n| 라인/설비 | 확인 필요 (충진기 호기 확인 필요) |\\n| 부적합 유형 | 규격 이탈(중량) |\\n| 심각도(제안) | Major |\\n\\n## 2. 부적합 내용\\n- 규격: 195~205g\\n- 6/24 오후 검사: **194.2g 2개**\\n- 6/27: **193.8g 1개**\\n- 현장 관찰: 6/20부터 평균이 낮아진 느낌 (정량 데이터 확인 필요)\\n- 충진기 설정값: **미확인**\\n- 검사 샘플 수와 전체 측정값: 확인 필요\\n- 표시중량과 법적 허용오차: 확인 필요\\n\\n## 3. 영향 범위\\n- 해당 시간 생산분: 포장 완료, 창고 보관 중 (수량 확인 필요)\\n- 6/27분 보관·출고 상태: 확인 필요\\n- 6/20 이후 생산분 영향 여부: 확인 필요 (추정상 잠재 영향 범위)\\n- 출고 여부: 확인 필요\\n\\n## 4. 즉시 조치\\n1. 해당 생산분 출고 보류, 식별표 부착, 격리\\n2. 6/20 이후 생산분 출고 여부 확인, 미출고분 보류 검토\\n3. 보류 재고 표본 재측정 또는 전수 선별 검토\\n4. 충진기 설정값 즉시 확인, 현재 생산분 중량 모니터링 강화\\n5. 저울 교정 상태 확인\\n\\n## 5. 처분 제안\\n- **제안: 보류(Hold)**. 재측정·선별 결과에 따라 선별 또는 조건부 출하를 검토합니다.\\n- 최종 판정: 품질 책임자 (확인 필요)\\n\\n## 6. 원인 분석 (5Why) — 원인 미확정\\n| 단계 | 질문 | 답 | 근거 |\\n|---|---|---|---|\\n| 1 | 왜 부적합인가? | 하한 195g 미달 (194.2g×2, 193.8g×1) | 메모 |\\n| 2 | 왜 하한 미달인가? | 충진량 감소 또는 산포 증가 가능성 | 가정 |\\n| 3 | 왜 충진량이 변했나? | 충진기 설정 변경·드리프트, 원료 물성, 슬라이스 두께 편차 등 후보 (설정값 미확인) | 가정 |\\n| 4 | 왜 추세를 미리 못 잡았나? | 추세 관리(SPC) 부재 가능성 | 가정 |\\n\\n※ 충진기 설정값과 6/20 전후 변경점을 확인하기 전까지 원인을 단정하지 않습니다.\\n\\n## 7. 시정 조치 (예정)\\n- 충진기 설정값 확인 및 기준값 복원, 변경 이력 기록\\n- 6/20 이후 중량 데이터 분석으로 영향 범위 확정\\n- 보류 재고 재선별, 품질 책임자 판정에 따라 처리\\n- 저울 교정 확인\\n\\n## 8. 재발 방지 (예정)\\n- 중량 관리도(SPC) 도입, 추세 이상 시 조치 기준 마련\\n- 규격보다 엄격한 내부 관리 하한 설정 검토\\n- 충진기 설정 변경 승인·기록 절차, 시업 점검 항목에 설정값 확인 추가\\n- 인라인 체크웨이어 도입 검토\\n\\n## 9. 관할 기관 보고\\n- 현재는 불필요로 판단합니다(제안). 다만 미달품이 출고되었고 표시중량 대비 법적 허용오차를 넘는 것으로 확인되면 다시 검토해야 합니다.\\n\\n## 10. 확인 필요 사항\\n- 로트번호, 연도, 생산 시간대와 수량, 샘플 수와 전체 측정값, 출고 여부, 표시중량, 충진기 설정값과 변경 이력, 6/20 전후 변경점, 저울 교정 상태, 발견자/보고자\\n\\n---\\n*본 문서는 AI가 작성한 초안이며, 처분과 원인은 품질 책임자의 검토·판정이 필요합니다.*"},"17200a3ea70f50":{"title":"[초안] 6/26 야간조 소시지라인 포장 후 금속검출기 3회 연속 반응 (로트 S0626-02, 금속 미발견)","nc_type":"foreign_matter","severity":"major","severity_reason":"금속검출(CCP 추정) 공정에서 3회 연속 반응이 나왔고, 커터 칼날 상태에 대한 우려가 있어 금속 이물이 섞였을 가능성을 배제할 수 없습니다. 다만 배출품 12개에서 금속을 찾지 못해 실제로 섞였는지는 확정되지 않았습니다. 그래서 현재는 major로 잠정 분류합니다. 금속이 확인되거나, 칼날 결손이 확인되거나, 해당 로트가 출하된 사실이 확인되면 critical로 올려야 합니다. 등급은 품질 책임자가 최종 판정합니다.","facts":[{"label":"발생 일자/근무조","value":"6/26 야간조","source_quote":"6/26 야간조"},{"label":"발생 라인/공정","value":"소시지라인 포장 후 금속검출기","source_quote":"소시지라인 포장 후 금속검출기"},{"label":"현상","value":"금속검출기 3회 연속 반응","source_quote":"금속검출기 3회 연속 반응함"},{"label":"배출품 확인 결과","value":"배출된 12개 개봉, 금속 미발견","source_quote":"배출된 12개 열어봤는데 금속은 못 찾음"},{"label":"작성자 의견(오작동 가능성)","value":"오작동 가능성 언급(확인 안 됨)","source_quote":"오작동일 수도 있는데"},{"label":"관련 우려(커터 칼날)","value":"요즘 커터 칼날 상태가 좋지 않다는 얘기가 있음(전언, 확인 안 됨)","source_quote":"요즘 커터 칼날 상태가 좀 안 좋다는 얘기가 있어서 걱정됨"},{"label":"로트","value":"S0626-02","source_quote":"로트 S0626-02"},{"label":"현장 조치","value":"라인 15분 정지 후 재가동","source_quote":"라인은 일단 15분 세우고 다시 돌림"}],"affected_scope":"[메모로 알 수 있는 것] 6/26 야간조, 소시지라인, 로트 S0626-02, 금속검출기 배출품 12개.\\n[확인 필요] 로트 S0626-02의 총 생산량과 출하 여부, 반응 시각과 그 전후 생산 구간, 15분 정지 후 재가동하고 나서 생산된 제품이 같은 로트인지, 같은 커터를 거친 다른 로트(전후 일자·근무조), 마지막으로 금속검출기 검증(테스트피스)을 정상 통과한 시점. 지금은 마지막 정상 검증 시점부터 지금까지 같은 커터로 생산된 제품 전체가 잠재적 영향 범위로 추정됩니다.","immediate_actions":["로트 S0626-02 전량 출하 보류 및 격리·식별 표시(재가동 후 생산분 포함)","배출품 12개는 폐기하지 말고 별도 보관(재검사용)","금속검출기 테스트피스(Fe/Non-Fe/SUS) 검증 즉시 실시하고 결과 기록. 감도 설정값 확인","커터 칼날 즉시 점검(결손·이빨 빠짐·마모 여부, 결손 조각 수량 대조)하고 사진 기록","검증된 금속검출기로 배출품 12개와 보류 로트 재통과 검사(가능하면 X-ray 검사 의뢰 검토)","출하 여부 확인. 이미 출하된 경우 품질 책임자에게 즉시 보고"],"disposition":{"proposal":"hold","reason":"금속이 섞였는지 확인되지 않았고(12개 개봉, 금속 미발견), 오작동인지도 검증되지 않았습니다. 커터 칼날 점검, 금속검출기 검증, 재검사 결과가 나올 때까지 로트 S0626-02 전량 보류를 제안합니다. 결과에 따라 재선별(rework) 후 출하할지 폐기(scrap)할지는 품질 책임자가 최종 판정합니다."},"five_whys":[{"why":"왜 금속검출기가 3회 연속 반응했는가?","answer":"원인 미확정. 금속 이물 혼입 또는 검출기 오작동 가능성이 메모에 함께 언급됨","basis":"memo"},{"why":"(금속 혼입이라면) 금속은 어디서 왔는가?","answer":"커터 칼날 결손·마모 조각일 가능성(추정). 메모에는 칼날 상태가 안 좋다는 전언만 있고 점검 결과는 없음","basis":"assumption"},{"why":"왜 칼날 상태 이상이 알려진 상태에서 조치되지 않았는가?","answer":"칼날 점검·교체 기준이나 주기가 없거나 지켜지지 않았을 가능성(추정)","basis":"assumption"},{"why":"왜 배출품 12개에서 금속을 찾지 못했는가?","answer":"미세 조각이라 눈으로 찾기 어려웠거나 실제로 오검출이었을 가능성(추정). 재통과 검사로 확인했는지는 메모에 없음","basis":"assumption"},{"why":"왜 원인 확인 없이 15분 후 재가동했는가?","answer":"금속검출기 반응 시 재가동 기준(검증·칼날 점검·책임자 승인)이 명확하지 않았을 가능성(추정)","basis":"assumption"}],"corrective_actions":["커터 칼날 점검 결과에 따라 칼날 교체. 결손이 확인되면 마지막 정상 점검 시점까지 거슬러 영향 로트 재평가","금속검출기 검증 결과에 따라 감도 재설정 또는 수리. 오작동으로 확인되면 정비 이력 기록","보류 로트 재검사 결과를 근거로 품질 책임자가 처분 판정하고 기록","이번 건 CCP 이탈 기록(일탈 일지) 작성 및 보완"],"preventive_actions":["금속검출기 반응 시 대응 절차 명확화: 즉시 테스트피스 검증 → 배출품 재통과 → 금속 발생원(커터 등) 점검 → 품질 책임자 승인 후 재가동","커터 칼날 정기 점검(작업 시작 전·후, 교대 시) 및 교체 기준(마모 한도) 수립과 기록화","설비 이상 징후('상태 안 좋다' 등)를 구두가 아닌 설비 이상 보고서로 올리는 체계 운영","작업자 교육: 배출품 개봉 시 육안 확인만으로 끝내지 않고 재통과 검사로 확인"],"missing_info":["금속검출기 반응 시각(3회 각각)과 담당자/작성자는?","반응 직전·직후 테스트피스(Fe/Non-Fe/SUS) 검증을 했는가? 결과와 감도 설정값은?","마지막으로 정상 검증된 시각은?","배출품 12개는 어떻게 확인했는가(육안 개봉만인지, 재통과 검사도 했는지)? 지금 보관 중인가?","12개가 3회 반응으로 배출된 전량인가?","15분 정지 동안 어떤 조치(검증·칼날 점검·청소 등)를 했는가? 재가동은 누가 승인했는가?","커터 칼날 실제 점검 결과(결손·마모 여부)는? '상태가 안 좋다'는 얘기는 언제부터, 누가 했는가?","로트 S0626-02의 총 생산 수량, 재가동 후 생산 수량, 현재 위치(창고/출하)는?","같은 커터로 생산된 다른 로트가 있는가?","재가동 이후 금속검출기 추가 반응이 있었는가?","금속검출기와 커터의 최근 정비·교체 이력은?"],"report_to_authority":false,"report_markdown":"# 부적합 보고서 (초안)\\n\\n> 사람이 검토하기 위한 초안입니다. 원인과 처분은 확정되지 않았고, 최종 판정은 품질 책임자가 합니다.\\n\\n## 1. 기본 정보\\n| 항목 | 내용 |\\n|---|---|\\n| 제목 | 6/26 야간조 소시지라인 포장 후 금속검출기 3회 연속 반응 |\\n| 부적합 유형 | 이물(금속) 의심 |\\n| 등급(잠정) | Major (금속 확인, 칼날 결손 확인, 출하 사실 확인 중 하나라도 해당하면 Critical로 상향 검토) |\\n| 발생 일자 | 6/26 (연도 확인 필요) |\\n| 발생 시각 | 확인 필요 |\\n| 근무조 | 야간조 |\\n| 라인/공정 | 소시지라인 / 포장 후 금속검출기 |\\n| 로트 | S0626-02 |\\n| 수량 | 배출 12개 / 로트 총량 확인 필요 |\\n| 작성자·발견자 | 확인 필요 |\\n\\n## 2. 현상\\n- 포장 후 금속검출기가 3회 연속 반응함\\n- 배출된 12개를 개봉했으나 금속은 발견되지 않음 (확인 방법: 확인 필요)\\n- 현장에서는 오작동 가능성을 언급했고, 최근 커터 칼날 상태가 좋지 않다는 전언이 있음 (둘 다 확인 안 됨)\\n- 라인을 15분 정지한 뒤 재가동함 (정지 중 조치 내용과 재가동 승인자: 확인 필요)\\n\\n## 3. 영향 범위\\n- 알 수 있는 것: 로트 S0626-02, 배출품 12개\\n- 확인 필요: 로트 총량, 출하 여부, 재가동 후 생산분, 마지막 정상 검증 시점 이후 같은 커터로 생산한 다른 로트\\n\\n## 4. 즉시 조치 (제안)\\n1. 로트 S0626-02 전량 보류·격리 (재가동 후 생산분 포함)\\n2. 배출품 12개 별도 보관\\n3. 금속검출기 테스트피스 검증과 감도 확인\\n4. 커터 칼날 점검 (결손·마모, 사진 기록)\\n5. 보류 로트와 배출품 재통과 검사 (X-ray 검사 검토)\\n6. 출하 여부 확인 후 품질 책임자에게 보고\\n\\n## 5. 처분 제안\\n- **보류(Hold)**: 검증과 재검사 결과가 나올 때까지 보류. 이후 재선별할지 폐기할지는 품질 책임자가 판정\\n\\n## 6. 원인 분석 (5Why, 미확정)\\n| 단계 | 질문 | 답 | 근거 |\\n|---|---|---|---|\\n| 1 | 왜 3회 연속 반응했나 | 금속 혼입 또는 검출기 오작동, 미확정 | 메모 |\\n| 2 | 금속이라면 발생원은 | 커터 칼날 결손·마모 가능성 | 추정 |\\n| 3 | 왜 칼날 이상이 방치됐나 | 점검·교체 기준 미비 가능성 | 추정 |\\n| 4 | 왜 12개에서 금속을 못 찾았나 | 미세 조각이거나 오검출 가능성 | 추정 |\\n| 5 | 왜 원인 확인 없이 재가동했나 | 재가동 기준 불명확 가능성 | 추정 |\\n\\n## 7. 시정 조치\\n- 점검 결과에 따라 칼날 교체 및 영향 로트 재평가\\n- 금속검출기 감도 재설정 또는 수리, 정비 기록\\n- CCP 이탈 기록 작성 및 처분 판정 기록\\n\\n## 8. 재발 방지\\n- 금속검출기 반응 시 대응 절차 명확화 (검증 → 재통과 → 발생원 점검 → 책임자 승인 후 재가동)\\n- 커터 칼날 정기 점검과 교체 기준 수립\\n- 설비 이상 징후를 공식 보고서로 올리는 체계 운영\\n- 배출품 확인 방법 교육 (재통과 검사 포함)\\n\\n## 9. 관할 기관 보고\\n- 현재: 금속이 확인되지 않았으므로 보고 대상 아님으로 판단 (잠정)\\n- 금속 이물이 확인되고 해당 제품이 출하된 경우 즉시 재검토 (품질 책임자 판단)\\n\\n## 10. 현장 확인 질문\\n- 반응 시각, 담당자\\n- 반응 전후 테스트피스 검증 결과와 감도 설정값\\n- 배출품 확인 방법, 보관 여부, 12개가 배출 전량인지\\n- 15분 정지 중 조치 내용과 재가동 승인자\\n- 커터 칼날 실제 점검 결과\\n- 로트 수량, 출하 여부, 재가동 후 추가 반응 여부\\n- 금속검출기와 커터의 정비 이력\\n\\n## 11. 승인\\n| 작성 | 검토 | 승인(품질 책임자) |\\n|---|---|---|\\n| 확인 필요 | 확인 필요 | 확인 필요 |\\n"},"00adc4ae25d61e":{"title":"발효유 라인 컵 누수 5개 발견 – 실링 온도 설정 변경(142→138) 기록 확인 (초안)","nc_type":"process_deviation","severity":"major","severity_reason":"밀봉이 불량하면 냉장 발효유에 미생물이 들어가 변질될 수 있고, 같은 시간대 생산분(파레트 2개)에도 실링 불량이 숨어 있을 수 있음. 다만 출하 여부, 소비자 클레임, 위해 확인 결과가 메모에 없어 critical로 판단할 근거는 부족함. 출하가 확인되면 critical로 재평가해야 함.","facts":[{"label":"제품/라인","value":"발효유 오전 라인","source_quote":"발효유 오전 라인에서"},{"label":"부적합 현상 및 수량","value":"컵 누수 5개","source_quote":"컵 누수 5개 발견"},{"label":"공정 설정 변경 기록","value":"실링 온도 설정 142 → 138 변경 기록 있음","source_quote":"실링 온도 설정이 142에서 138로 바뀐 기록이 있음"},{"label":"변경자","value":"모름","source_quote":"누가 바꿨는지는 모름"},{"label":"발생 시간대","value":"오후 3시~4시 생산분","source_quote":"오후 3시~4시 사이 생산분에서 나옴"},{"label":"누수품 조치","value":"폐기 완료","source_quote":"나온 컵은 폐기했고"},{"label":"해당 시간대 생산량","value":"파레트 2개","source_quote":"그 시간 생산분은 파레트 2개"}],"affected_scope":"[메모로 알 수 있는 것] 오후 3~4시 생산분 파레트 2개에서 누수 컵 5개가 나왔고, 이 5개는 폐기함.\\n[메모로 알 수 없는 것] ① '오전 라인'과 '오후 3~4시'가 서로 맞지 않음. 라인 이름인지 기록 오류인지 확인 필요. ② 실링 온도가 언제 바뀌었는지 모름. 3시 이전에 바뀌었다면 영향 범위가 3~4시보다 넓을 수 있음. ③ 4시 이후 생산분에 영향이 있는지, 설정이 원래대로 돌아왔는지 모름. ④ 파레트 2개의 로트, 컵 수량, 출하 여부 모름. ⑤ 다른 라인이나 제품에도 같은 설정 변경이 있었는지 모름.","immediate_actions":["오후 3~4시 생산분 파레트 2개를 즉시 격리하고 출하 보류 태그 부착","출하 여부 확인. 이미 출하된 물량이 있으면 즉시 품질 책임자에게 보고","실링 온도 현재 설정값을 확인하고, 표준 설정값(142로 추정, 단위·표준 확인 필요)으로 복구할지 품질/생산 책임자가 승인","설정이 바뀐 시점을 확인해 앞뒤 시간대 생산분도 격리 대상으로 넓힐지 검토","격리품 전수 선별 실시(누수, 실링 박리강도 또는 압착 검사 등)","남은 누수 샘플이나 사진이 있으면 보존. 폐기한 5개는 폐기 기록 확인"],"disposition":{"proposal":"hold","reason":"영향 범위(설정 변경 시점), 로트, 출하 여부, 선별 결과가 확인되지 않아 우선 보류를 제안함. 전수 선별 후 양품만 조건부 출하할지, 전량 폐기할지는 선별·검사 결과를 보고 품질 책임자가 최종 판정함."},"five_whys":[{"why":"왜 컵 누수가 발생했나?","answer":"실링이 불완전했을 가능성(추정). 실링 온도 설정이 142에서 138로 낮아진 기록이 있음.","basis":"memo"},{"why":"왜 실링 온도 설정이 바뀌었나?","answer":"누가, 왜 바꿨는지 메모상 알 수 없음. 의도적인 조정(예: 필름 교체 대응)인지 오조작인지 확인 필요(추정).","basis":"assumption"},{"why":"왜 설정 변경이 승인 없이(또는 인지되지 않은 채) 적용됐나?","answer":"설정 변경 권한 관리나 변경 승인 절차가 없거나 지켜지지 않았을 가능성(추정).","basis":"assumption"},{"why":"왜 변경된 설정으로 생산하는 동안 바로 발견되지 않았나?","answer":"실링 온도 허용범위 알람, 작업 시작 점검, 주기적인 실링 검사가 미흡했을 가능성(추정).","basis":"assumption"}],"corrective_actions":["설비 로그와 작업자 면담으로 설정 변경 시점, 변경자, 변경 사유 확인","138 설정과 누수의 인과관계 검증(설정별 실링 강도 비교 시험 등). 필름, 컵, 실링 헤드 상태 등 다른 원인도 함께 확인","실링 온도를 표준값으로 복구한 뒤 초품 실링 검사로 정상 여부 확인","선별 결과에 따라 격리품 처분 실행 및 기록"],"preventive_actions":["실링 온도 등 핵심 공정 변수는 권한 있는 사람만 바꿀 수 있게 하고, 변경 이력(변경자, 사유)이 자동으로 남도록 설정","공정 변수 변경 승인 절차(변경관리) 수립 또는 재교육","실링 온도 허용범위 알람과 인터록 적용 검토","작업 시작 점검과 정기(예: 시간당) 실링 누수·강도 검사 주기 수립 또는 점검","관련 작업자 교육"],"missing_info":["'오전 라인'과 '오후 3시~4시'가 서로 맞지 않습니다. 라인 이름이 '오전 라인'인가요, 아니면 시간이 잘못 적힌 건가요?","누수를 발견한 시각과 발견자는 누구인가요?","실링 온도 설정은 정확히 언제 바뀌었나요? 기록(로그) 출처는 무엇인가요?","실링 온도의 표준 설정값과 허용범위는 얼마인가요? 단위(℃)도 확인해 주세요.","현재 설정값은 몇인가요? 원래대로 복구했나요? 복구했다면 언제 했나요?","파레트 2개의 로트번호, 제품명, 규격, 컵 수량은 어떻게 되나요?","해당 파레트는 출하되었나요, 창고에 있나요?","4시 이후 생산분과 3시 이전 생산분에도 누수가 있었나요? 확인했나요?","누수 5개는 어떤 방법으로 발견했나요(육안, 검사기 등)? 누수 부위는 어디였나요(실링부, 컵 몸체 등)?","폐기한 5개의 샘플이나 사진이 남아 있나요?","같은 시간대에 필름 교체, 설비 정지, 작업자 교대 등 다른 변경점이 있었나요?","보고서 작성자와 부서는 누구인가요?"],"report_to_authority":false,"report_markdown":"# 부적합 보고서 (초안)\\n\\n> 본 문서는 AI가 작성한 검토용 초안입니다. 원인과 처분은 확정된 것이 아니며, 최종 판정은 품질 책임자가 합니다.\\n\\n## 1. 기본 정보\\n| 항목 | 내용 |\\n|---|---|\\n| 제목 | 발효유 라인 컵 누수 5개 발견 – 실링 온도 설정 변경(142→138) 기록 확인 |\\n| 제품명/규격 | 발효유 (제품명·규격 확인 필요) |\\n| 라인 | \\"오전 라인\\" (메모 표기. 발생 시간대와 맞지 않아 확인 필요) |\\n| 로트번호 | 확인 필요 |\\n| 발생 시간대 | 오후 3시~4시 생산분 |\\n| 발견 일시/발견자 | 확인 필요 |\\n| 작성자/부서 | 확인 필요 |\\n| 부적합 유형 | 공정 이탈(실링 공정) |\\n| 심각도(제안) | Major (출하가 확인되면 재평가) |\\n\\n## 2. 부적합 내용\\n- 컵 누수 5개 발견\\n- 실링 온도 설정이 142에서 138로 바뀐 기록 있음 (단위·표준값 확인 필요)\\n- 변경자: 모름 (확인 필요)\\n- 변경 시점: 확인 필요\\n\\n## 3. 영향 범위\\n- 확인된 범위: 오후 3~4시 생산분 **파레트 2개** (컵 수량 확인 필요)\\n- 확인 필요: 설정 변경 시점에 따라 3시 이전 생산분까지 영향이 있는지, 4시 이후 생산분, 출하 여부, 다른 라인의 동일 설정 여부\\n\\n## 4. 즉시 조치\\n| 조치 | 상태 |\\n|---|---|\\n| 누수 컵 5개 폐기 | 완료 (메모 기준) |\\n| 해당 파레트 2개 격리 및 출하 보류 | 확인 필요 |\\n| 출하 여부 확인 | 확인 필요 |\\n| 실링 온도 표준값 복구 및 초품 확인 | 확인 필요 |\\n| 격리품 전수 선별 | 확인 필요 |\\n\\n## 5. 원인 분석 (5Why, 추정 포함)\\n1. 누수 원인: 실링 불완전 가능성(추정). 실링 온도 142→138 변경 기록 있음 **[메모]**\\n2. 설정 변경 사유: 확인 필요 **[추정]**\\n3. 변경이 통제되지 않은 이유: 변경관리나 권한 관리 미흡 가능성 **[추정]**\\n4. 바로 발견되지 않은 이유: 알람이나 주기 검사 미흡 가능성 **[추정]**\\n\\n※ 온도 변경과 누수의 인과관계는 검증되지 않았습니다. 필름, 컵, 실링 헤드 등 다른 원인도 함께 확인해야 합니다.\\n\\n## 6. 처분 제안\\n- **보류(Hold)**: 선별·검사 결과에 따라 조건부 출하 또는 폐기를 결정\\n- 최종 판정: 품질 책임자 (서명/일자: 확인 필요)\\n\\n## 7. 시정 조치\\n- 설비 로그와 면담으로 설정 변경 시점, 변경자, 사유 확인\\n- 설정값과 누수의 인과관계 검증(실링 강도 비교 시험 등)\\n- 표준값으로 복구한 뒤 실링 검사로 정상 여부 확인\\n- 격리품 처분 실행 및 기록\\n\\n## 8. 재발 방지 조치\\n- 핵심 공정 변수의 변경 권한 제한과 변경 이력 자동 기록\\n- 변경관리 절차 수립 또는 재교육\\n- 실링 온도 이탈 알람·인터록 검토\\n- 작업 시작 점검과 정기 실링 검사 주기 수립\\n\\n## 9. 관할 기관 보고 검토\\n- 현재 메모 기준으로는 보고 대상으로 볼 근거가 부족함(출하 여부 미확인)\\n- **출하가 확인되면** 회수 필요성과 관할 기관 보고 여부를 즉시 재검토해야 함\\n\\n## 10. 확인 필요 사항\\n- 라인 표기(\\"오전 라인\\")와 발생 시간(오후 3~4시)이 맞지 않는 부분\\n- 발견 일시, 발견자, 발견 방법, 누수 부위\\n- 설정 변경 시점과 로그 출처, 표준값, 단위, 현재 설정값\\n- 로트번호, 컵 수량, 출하 여부\\n- 앞뒤 시간대 생산분의 누수 여부\\n- 같은 시간대의 다른 변경점(필름 교체, 교대 등)\\n- 폐기품 샘플이나 사진 보존 여부\\n"},"0e09c86a3fa403":{"title":"[입고 부적합] 공급사 B 소시지 케이싱 롤(로트 CS-0618) 두께 불균일 — COA는 정상","nc_type":"material","severity":"major","severity_reason":"케이싱 두께가 고르지 않으면 충전·가열 중 터지거나 결착이 불량해지고, 외관 불량이 생길 수 있음(추정). 다만 아직 사용하지 않고 창고에 있어 제품·고객에 영향이 미치지 않았으므로 critical이 아닌 major로 제안함. 육안 판단만 있는 상태이며 실측값과 규격 이탈 정도는 확인 필요.","facts":[{"label":"품목","value":"소시지 케이싱 롤(입고품)","source_quote":"입고된 소시지 케이싱 롤"},{"label":"부적합 현상","value":"일부 롤의 두께가 고르지 않음","source_quote":"일부 두께가 고르지 않음"},{"label":"성적서(COA)","value":"COA상 결과는 정상","source_quote":"성적서(COA)는 정상으로 나와 있음"},{"label":"공급사","value":"공급사 B","source_quote":"공급사 B"},{"label":"입고 로트","value":"CS-0618","source_quote":"입고 로트는 CS-0618"},{"label":"사용 여부","value":"미사용","source_quote":"사용은 아직 안 했고"},{"label":"현재 위치","value":"창고 보관 중","source_quote":"창고에 있음"}],"affected_scope":"[알 수 있는 것] 공급사 B의 입고 로트 CS-0618 케이싱 롤 중 '일부'가 해당됨. 아직 사용하지 않았고 창고에 있으므로 생산 제품으로는 번지지 않은 것으로 보임(메모 기준).\\n[알 수 없는 것(확인 필요)] 입고된 롤 총수량과 불균일 롤 수량, 불균일이 롤 안의 특정 구간에만 있는지 롤 전체에 있는지, 같은 공급사의 다른 로트(이전 입고분 포함)가 이미 생산에 쓰였는지 여부, 다른 창고나 라인에 재고가 나가 있는지 여부.","immediate_actions":["로트 CS-0618 전량에 '사용 금지/보류' 식별표를 붙이고 별도 구역에 격리(일부 롤만 해당되더라도 원인이 확인될 때까지 로트 전체 보류 제안)","라인으로 출고되었거나 다른 위치로 옮겨진 롤이 있는지 재고·출고 기록으로 확인","불균일이 의심되는 롤의 위치와 구간을 표시하고 사진을 촬영해 증거 보존","캘리퍼나 두께 게이지로 실측(롤별·구간별 여러 지점)하고 입고 검사 규격과 비교","공급사 B에 부적합을 통보하고 해당 로트의 출하 검사 원데이터와 보관 샘플을 요청","같은 공급사의 이전 로트 중 사용 중이거나 재고로 남은 것에 이상이 있는지 점검"],"disposition":{"proposal":"hold","reason":"두께를 실측하지 않았고 규격을 벗어난 정도와 해당 롤 수량도 아직 모르기 때문에 우선 보류를 제안함. 실측 결과 규격을 벗어난 것으로 확인되면 공급사 반품(return_to_supplier)을 검토할 것을 제안함. 최종 판정은 품질 책임자가 함."},"five_whys":[{"why":"왜 부적합인가?","answer":"입고된 케이싱 롤 일부의 두께가 고르지 않음","basis":"memo"},{"why":"왜 COA는 정상인데 두께 불균일이 발견되었나?","answer":"공급사의 출하 검사가 샘플링 위주라서(예: 롤 끝단만 측정) 부분적인 불균일을 놓쳤을 가능성이 있음","basis":"assumption"},{"why":"왜 두께가 불균일하게 만들어졌나?","answer":"공급사의 압출·성형 공정 조건(다이 간격, 장력, 온도 등)이 변동했을 가능성이 있음","basis":"assumption"},{"why":"왜 공정 변동이 걸러지지 않았나?","answer":"공급사에서 공정을 실시간으로 모니터링하거나 전수 검사하지 않았을 가능성이 있음","basis":"assumption"},{"why":"왜 당사 입고 단계에서 정량적으로 검증되지 않았나?","answer":"입고 검사가 COA 확인과 육안 검사에 의존하고 두께 실측 항목이 없거나 부족했을 가능성이 있음","basis":"assumption"}],"corrective_actions":["로트 CS-0618 전 롤의 두께를 실측해 적합한 롤과 부적합한 롤을 구분(품질 책임자가 판정)","공급사 B에 시정조치요구서(SCAR)를 발행해 원인 분석과 COA·실물 불일치에 대한 해명을 요청","실측 결과 부적합으로 확인된 롤은 반품 또는 교환 처리를 협의","같은 공급사의 다른 로트 재고를 실측해 문제가 번졌는지 확인"],"preventive_actions":["케이싱 입고 검사에 두께 실측 항목을 추가하거나 강화(측정 지점 수, 샘플링 기준, 허용 편차 명시)","COA만 믿지 않도록 주기적으로 COA 항목을 교차 검증(자체 측정 또는 외부 시험)","공급사 B를 일정 기간 강화 검사 대상으로 지정하고 공급사 평가에 반영","공급사와 맺은 품질 협약서(규격서)에 두께 균일성 기준과 측정 방법을 명확히 규정"],"missing_info":["입고 일자와 발견 일시는 언제인가요?","발견자와 보고자는 누구인가요?","입고된 롤 총수량과 두께 불균일 롤 수량은 몇 개인가요?","두께를 실측했나요? 했다면 측정값, 측정 방법, 측정 장비는 무엇인가요?","케이싱 두께 규격(공칭값·허용 편차)은 얼마인가요?","불균일이 롤 안의 특정 구간에만 있나요, 롤 전체에 있나요?","COA에 적힌 두께 측정값과 측정 조건은 무엇인가요?","케이싱 재질과 품목 코드(콜라겐, 셀룰로오스, 플라스틱 등)는 무엇인가요?","CS-0618 또는 같은 공급사의 이전 로트가 이미 생산에 쓰였나요?","현재 창고 위치는 어디이고, 보류 표시를 했나요?","공급사 B에 통보했나요?","사진 등 증거 자료가 있나요?"],"report_to_authority":false,"report_markdown":"# 부적합 보고서 (초안)\\n\\n**제목:** 공급사 B 소시지 케이싱 롤(로트 CS-0618) 두께 불균일 — COA는 정상\\n\\n| 항목 | 내용 |\\n|---|---|\\n| 보고서 번호 | 확인 필요 |\\n| 발견 일시 | 확인 필요 |\\n| 입고 일자 | 확인 필요 |\\n| 발견자/보고자 | 확인 필요 |\\n| 부적합 유형 | 원부자재(material) – 입고품 |\\n| 심각도(제안) | Major |\\n| 품목 | 소시지 케이싱 롤 (재질·품목 코드: 확인 필요) |\\n| 공급사 | 공급사 B |\\n| 로트 | CS-0618 |\\n| 수량(입고/부적합) | 확인 필요 / 확인 필요 (\\"일부\\") |\\n| 현재 상태 | 미사용, 창고 보관 (위치: 확인 필요) |\\n\\n## 1. 부적합 내용\\n- 입고된 소시지 케이싱 롤 중 **일부 두께가 고르지 않음**\\n- 성적서(COA)상 결과는 **정상**으로 나와 있어 COA와 실물이 불일치함\\n- 실측값과 규격: 확인 필요\\n\\n## 2. 영향 범위\\n- 메모 기준으로는 사용하지 않았고 창고에 있음 → 생산 제품에는 영향이 없는 것으로 보임\\n- 불균일 롤 수량, 같은 공급사 다른 로트의 사용 여부: 확인 필요\\n\\n## 3. 즉시 조치 (제안)\\n1. CS-0618 전량을 보류 표시하고 격리\\n2. 출고·이동된 롤이 있는지 확인\\n3. 사진 촬영, 해당 구간 표시\\n4. 두께 실측 후 규격과 비교\\n5. 공급사 B에 통보하고 출하 검사 원데이터 요청\\n\\n## 4. 원인 분석 (5Why, 추정 포함)\\n1. 왜 부적합인가 → 두께 불균일 *(메모)*\\n2. 왜 COA는 정상인가 → 공급사 검사가 샘플링 위주라서 놓쳤을 가능성 *(추정)*\\n3. 왜 불균일이 생겼나 → 공급사 성형 공정 조건 변동 가능성 *(추정)*\\n4. 왜 걸러지지 않았나 → 공급사의 공정 모니터링·검사 부족 가능성 *(추정)*\\n5. 왜 당사 입고에서 정량 검증이 안 됐나 → 두께 실측 항목이 없거나 부족했을 가능성 *(추정)*\\n\\n※ 원인은 확정되지 않았으며, 실측 결과와 공급사 회신으로 검증이 필요함.\\n\\n## 5. 처분 (제안)\\n- **보류(Hold)** — 실측 후 규격을 벗어난 것으로 확인되면 **공급사 반품**을 검토할 것을 제안\\n- 최종 판정: 품질 책임자 (확인 필요)\\n\\n## 6. 시정 조치\\n- 전 롤을 실측해 적합/부적합 판정\\n- 공급사 B에 SCAR 발행(원인 분석, COA 불일치 해명 요청)\\n- 부적합 롤은 반품 또는 교환 협의\\n- 같은 공급사의 다른 로트 재고 점검\\n\\n## 7. 재발 방지\\n- 입고 검사에 두께 실측 항목 추가 또는 강화\\n- COA 항목을 주기적으로 교차 검증\\n- 공급사 B를 강화 검사 대상으로 지정하고 공급사 평가에 반영\\n- 품질 협약서에 두께 균일성 기준 명시\\n\\n## 8. 관할 기관 보고\\n- 제품에 사용하지 않았고 출하도 없으므로 현재로서는 보고 대상이 아닌 것으로 판단됨 (제안). 이미 사용한 이력이 확인되면 다시 검토\\n\\n## 9. 확인 필요 사항\\n입고·발견 일시, 발견자, 총수량·부적합 수량, 실측값·규격, 불균일 구간, COA 측정값, 재질, 같은 공급사 이전 로트 사용 여부, 보관 위치·보류 표시 여부, 공급사 통보 여부, 사진 증거\\n\\n| 작성 | 검토 | 승인(품질 책임자) |\\n|---|---|---|\\n| 확인 필요 | 확인 필요 | 확인 필요 |\\n"},"1ff3fd90702e6a":{"title":"소스 라인 라벨 제조일자 이중 인쇄(판독 곤란) 부적합","nc_type":"labeling","severity":"major","severity_reason":"제조일자는 의무 표시사항인데 판독이 어려워 표시 기준을 위반했을 가능성이 있음. 출하분이 있는지 확인되지 않아 시장에 유통됐을 가능성도 배제할 수 없음. 다만 메모에는 안전 위해(이물·변질 등) 정보가 없어 critical이 아닌 major로 분류함(추정). 출하분이 확인되면 등급을 다시 검토해야 함.","facts":[{"label":"발생 라인/현상","value":"소스 라인 라벨 인쇄 이상","source_quote":"소스 라인 라벨 인쇄 이상"},{"label":"부적합 내용","value":"제조일자가 이중으로 인쇄되어 판독 곤란","source_quote":"제조일자가 두 번 겹쳐서 찍혀 읽기 어려움"},{"label":"수량(추정치)","value":"약 300병(현장 추정, 확정 수량 아님)","source_quote":"대략 300병쯤 되는 것 같음"},{"label":"설비 변경 이력","value":"인쇄기 헤드를 최근 교체함(교체 일자 미기재)","source_quote":"인쇄기 헤드 교체한 지 얼마 안 됨"},{"label":"출하 여부","value":"출하분 확인 안 됨","source_quote":"이미 출하된 건 확인 못 함"}],"affected_scope":"[메모로 알 수 있는 것] 소스 라인 제품. 제조일자 이중 인쇄. 영향 수량은 현장 추정으로 약 300병. 인쇄기 헤드를 최근 교체함.\\n[메모로 알 수 없는 것] 제품명·로트·제조일자, 발생 시작·종료 시각, 정확한 수량, 출하 여부와 출하 수량·거래처, 소비기한 등 다른 표시사항의 이상 여부, 헤드 교체 이후 생산된 다른 로트나 라인이 있는지(같은 인쇄기를 쓰는 경우). 헤드 교체 시점 이후 생산분 전체가 영향을 받았을 수 있음(추정).","immediate_actions":["해당 라인 라벨 인쇄기 사용을 중지하고, 인쇄 품질 확인 전까지 생산 재개 보류","이상 제품(약 300병 추정)을 식별 표시하고 격리 보관(출하 보류)","헤드 교체 시점 이후 생산된 재고 전체를 출하 보류하고 전수 선별","출하 기록을 즉시 조회해 해당 로트의 출하 여부·수량·거래처 확인","출하분이 있으면 품질 책임자에게 즉시 보고하고 회수 필요성 검토 착수","이상 라벨 샘플과 사진 확보(증거 보존)"],"disposition":{"proposal":"hold","reason":"수량·로트·출하 여부·다른 표시사항의 이상 여부가 확인되지 않아 우선 보류를 제안함. 선별 후 내용물에 이상이 없으면 라벨 재부착·재인쇄(rework)를 처분 후보로 검토할 수 있음(제안). 최종 판정은 품질 책임자가 함."},"five_whys":[{"why":"왜 라벨을 판독하기 어려운가?","answer":"제조일자가 두 번 겹쳐서 인쇄되었기 때문","basis":"memo"},{"why":"왜 제조일자가 이중으로 인쇄되었는가?","answer":"인쇄기(헤드)의 인쇄 동작이나 인쇄 위치·타이밍에 이상이 생겼을 가능성. 메모에는 '헤드 교체한 지 얼마 안 됨'이라는 사실만 있고, 인과관계는 확인되지 않음","basis":"assumption"},{"why":"왜 인쇄 동작에 이상이 생겼는가?","answer":"헤드 교체 후 설정(인쇄 트리거·센서·속도 동기화 등)이 맞지 않았을 가능성","basis":"assumption"},{"why":"왜 설정 이상이 교체 직후에 걸러지지 않았는가?","answer":"헤드 교체 후 인쇄 품질 검증(시험 인쇄·초품 확인) 절차가 없거나 지켜지지 않았을 가능성","basis":"assumption"},{"why":"왜 약 300병이 생산될 때까지 이상이 발견되지 않았는가?","answer":"인라인 인쇄 검사(비전 검사 또는 주기적 육안 확인)가 부족했을 가능성","basis":"assumption"}],"corrective_actions":["인쇄기 헤드 장착 상태·설정·센서를 점검하고 시험 인쇄로 정상 인쇄를 확인한 뒤 재가동(설비 담당 확인)","격리품 전수 선별 후 품질 책임자 판정에 따라 처분(라벨 재작업 등)","출하분이 확인되면 거래처 통보와 회수 여부를 결정하고 관할 기관 보고 필요성 검토","원인 조사 결과(헤드 교체와의 연관성 등)를 확인한 뒤 5Why 갱신"],"preventive_actions":["설비 부품(인쇄 헤드 등) 교체 후 시험 인쇄와 초품 승인 절차 수립 또는 강화(변경관리)","생산 중 표시사항(제조일자·소비기한 등) 판독 확인 주기 설정과 점검 기록화","인쇄 상태 자동 검사(비전 검사 등) 도입 검토","작업자 대상 표시 이상 발견 시 라인 정지·보고 기준 교육"],"missing_info":["제품명, 로트번호, 해당 제조일자는?","최초 발견 일시와 발견자는? 이상 인쇄가 시작된 시점은?","정확한 영향 수량은? ('대략 300병'의 산출 근거)","인쇄기 헤드 교체 일자·시각과 교체 작업자는? 교체 후 시험 인쇄를 했는가?","헤드 교체 이후 생산된 다른 로트나 제품이 있는가?","이미 출하된 수량과 출하처는? 출하 기록 확인 결과는?","소비기한 등 다른 표시사항도 이상이 있는가, 아니면 제조일자만 이상인가?","이상 제품은 현재 어디에 어떤 상태로 보관 중인가? 격리했는가?","라벨 사진이나 샘플이 확보되어 있는가?","인쇄 이상 발생 이후 라인을 정지했는가?"],"report_to_authority":true,"report_markdown":"# 부적합 보고서 (초안)\\n\\n**제목:** 소스 라인 라벨 제조일자 이중 인쇄(판독 곤란) 부적합\\n**작성 상태:** 초안. 품질 책임자 검토·승인 필요\\n\\n## 1. 기본 정보\\n| 항목 | 내용 |\\n|---|---|\\n| 발생 라인 | 소스 라인 |\\n| 제품명 / 로트 | 확인 필요 |\\n| 발생(발견) 일시 | 확인 필요 |\\n| 발견자 | 확인 필요 |\\n| 부적합 유형 | 표시(라벨링) |\\n| 심각도(제안) | Major (출하 여부 확인 후 재검토) |\\n\\n## 2. 부적합 내용\\n- 현상: 제조일자가 두 번 겹쳐 찍혀 판독이 어려움\\n- 수량: 약 300병 (현장 추정치, **정확한 수량 확인 필요**)\\n- 관련 이력: 인쇄기 헤드를 최근 교체함 (교체 일시 **확인 필요**)\\n- 출하 여부: **확인 필요** (현장에서 확인하지 못함)\\n- 다른 표시사항(소비기한 등)의 이상 여부: **확인 필요**\\n\\n## 3. 영향 범위\\n- 확인된 것: 소스 라인, 약 300병(추정)\\n- 미확인: 로트, 발생 기간, 헤드 교체 이후 생산된 다른 로트·제품, 출하분\\n- 헤드 교체 시점 이후 생산분 전체가 영향을 받았을 수 있음 (추정)\\n\\n## 4. 즉시 조치 (제안)\\n1. 라벨 인쇄기 사용 중지 및 생산 재개 보류\\n2. 이상 제품 식별 표시·격리, 출하 보류\\n3. 헤드 교체 이후 생산 재고 전수 선별\\n4. 출하 기록 조회 → 출하분이 있으면 품질 책임자에게 즉시 보고, 회수 검토\\n5. 이상 라벨 사진·샘플 확보\\n\\n## 5. 처분 (제안)\\n- **보류(Hold)**: 선별 후 내용물에 이상이 없으면 라벨 재작업(Rework)을 후보로 검토\\n- 최종 판정: 품질 책임자 (확인 필요)\\n\\n## 6. 원인 분석 (5Why, 초안)\\n| 단계 | 질문 | 답변 | 근거 |\\n|---|---|---|---|\\n| 1 | 왜 판독하기 어려운가? | 제조일자가 이중으로 인쇄됨 | 메모 |\\n| 2 | 왜 이중 인쇄되었나? | 인쇄 동작·위치·타이밍 이상 가능성 (헤드 교체와의 관련성은 미확인) | 추정 |\\n| 3 | 왜 인쇄 동작 이상이 생겼나? | 교체 후 설정·센서 동기화가 맞지 않았을 가능성 | 추정 |\\n| 4 | 왜 교체 직후에 걸러지지 않았나? | 교체 후 시험 인쇄·초품 확인 절차 부재 또는 미준수 가능성 | 추정 |\\n| 5 | 왜 약 300병까지 발견되지 않았나? | 인라인 인쇄 검사·주기 점검 부족 가능성 | 추정 |\\n\\n> 근본 원인은 아직 확정되지 않았으며, 설비 점검과 조사 후 갱신해야 함.\\n\\n## 7. 시정 조치 (제안)\\n- 인쇄기 헤드 장착·설정·센서 점검, 시험 인쇄 후 재가동\\n- 격리품 선별 및 판정에 따른 처분\\n- 출하분 확인 시 거래처 통보·회수 여부 결정, 관할 기관 보고 검토\\n\\n## 8. 재발 방지 조치 (제안)\\n- 부품 교체 후 시험 인쇄·초품 승인 절차 수립(변경관리)\\n- 생산 중 표시사항 판독 확인 주기 설정 및 기록\\n- 비전 검사 등 자동 인쇄 검사 도입 검토\\n- 표시 이상 발견 시 라인 정지·보고 기준 교육\\n\\n## 9. 관할 기관 보고 검토\\n- **검토 필요.** 제조일자 판독 불가 제품이 출하되었다면 표시기준 위반 및 회수 대상에 해당하는지 검토해야 함. 출하 여부 확인 후 품질 책임자가 판단\\n\\n## 10. 현장 확인 요청 사항\\n- 제품명·로트·제조일자 / 발견 일시·발견자 / 정확한 수량과 산출 근거\\n- 헤드 교체 일시·작업자·시험 인쇄 여부 / 교체 이후 생산된 다른 로트\\n- 출하 수량·출하처 / 소비기한 등 다른 표시사항의 이상 여부\\n- 격리·보관 상태 / 사진·샘플 확보 여부 / 라인 정지 여부\\n\\n## 11. 승인\\n| 작성 | 검토 | 승인(품질 책임자) |\\n|---|---|---|\\n| 확인 필요 | 확인 필요 | 확인 필요 |\\n"},"1779ea9de )\\n- 해당 로트 출하 전 두께 측정 원데이터(측정 위치별 값)\\n- 해당 로트 COA 원본, 시험 방법과 측정 장비 정보\\n- 두께 측정 장비 검교정 기록\\n- 해당 로트 보관·출하·운송 조건 기록\\n- 같은 로트 출하 롤 목록과 유사 불만 접수 여부\\n- SI-2025-07 시정조치 내용과 이후 이행·유효성 확인 기록\\n\\n3. 해당 롤 샘플은 당사가 보관하고 있으며, 필요하면 공동 확인 일정을 협의하겠습니다. 빠른 확인과 회신을 부탁드립니다.\\n\\n---\\n한결식품 품질보증팀\\n담당자: [확인 필요] / 전화: [확인 필요] / 이메일: [확인 필요]"},"1473da8dbe2627":{"subject":"[품질 이슈 공유 및 협조 요청] 소시지 케이싱(콜라겐) 롤 CS-0618 두께 불균일 관련","summary":"새봄케이싱(주)에서 입고된 콜라겐 케이싱 롤 CS-0618이 롤 안에서 두께가 고르지 않으며, 손으로 만져도 차이가 느껴지는 수준입니다. 함께 받은 COA에는 정상 값이 적혀 있습니다. 이 롤은 생산에 쓰지 않고 창고에 보관 중입니다.","facts":[{"label":"대상 롤","value":"새봄케이싱 롤 CS-0618 입고","source_quote":"새봄케이싱 롤 CS-0618 입고"},{"label":"발견 현상","value":"롤 안에서 두께가 고르지 않음","source_quote":"롤 안에서 두께가 고르지 않음"},{"label":"확인 방법/정도","value":"손으로 만져도 두께 차이가 느껴짐(계측값 없음)","source_quote":"손으로 만져도 차이가 느껴짐"},{"label":"COA","value":"COA상 값은 정상","source_quote":"COA는 정상 값으로 와 있음"},{"label":"사용·보관 상태","value":"생산 미투입, 창고 보관 중","source_quote":"아직 생산에는 안 쓰고 창고에 보관 중"},{"label":"유사 사례","value":"작년 11월에도 비슷한 일이 있었음","source_quote":"작년 11월에도 비슷한 일이 있었음"},{"label":"다음 입고 예정","value":"7/3","source_quote":"다음 입고 예정은 7/3"}],"our_impact":"해당 롤(CS-0618)은 생산에 쓰지 않고 창고에 보관 중입니다. 메모 기준으로 생산 피해(파열, 불량품 발생 등)는 아직 없습니다.","not_yet_confirmed":["두께 편차의 원인(제조 공정, 운송·보관 조건, 당사 취급 등). 아직 정해지지 않았음","귀책 주체","실제 두께 측정값과 규격 이탈 여부(현재는 손 감촉으로만 확인됨)","COA 값과 실제 롤 상태가 다른 이유(측정 위치, 샘플링 방식 등)","같은 로트·같은 출하분의 다른 롤에도 같은 현상이 있는지","SI-2025-07(2025-11 두께 편차) 건과 원인이 같은지"],"requests":[{"request":"롤 CS-0618이 속한 로트의 제조일지, 공정 검사 기록(두께 측정 원자료 포함) 공유","due":"접수 후 5영업일 이내","priority":"must"},{"request":"COA 두께 값의 측정 방법, 측정 위치·샘플링 기준, 측정 원자료 공유","due":"접수 후 5영업일 이내","priority":"must"},{"request":"해당 로트 보관 샘플(있는 경우) 두께 재측정 결과 공유","due":"접수 후 5영업일 이내","priority":"must"},{"request":"SI-2025-07 건 시정조치의 현재 운영 상황과, 이번 건과의 연관성에 대한 귀사 의견","due":"접수 후 5영업일 이내","priority":"must"},{"request":"다음 입고분의 출하 전 두께 측정 데이터 사전 공유 가능 여부 회신(데이터는 출하 전 제공)","due":"접수 후 5영업일 이내(가능 여부 회신)","priority":"should"},{"request":"보관 중인 롤 CS-0618의 공동 확인 당 로트의 제조일지 및 공정·출하 검사 기록(두께 측정 원자료 포함) 공유\\n2. COA 두께 값의 측정 방법, 측정 위치, 샘플링 기준 공유\\n3. 해당 로트 보관 샘플이 있다면 두께 재측정 결과 공유\\n4. SI-2025-07 시정조치의 현재 운영 상황과, 이번 건과의 연관성에 대한 귀사 의견\\n5. 다음 입고분(예정일 [확인 필요])의 출하 전 두께 측정 데이터를 미리 공유해 주실 수 있는지 회신\\n6. 보관 중인 롤 CS-0618의 공동 확인(현장 방문 또는 샘플 송부) 일정과 처리 방안에 대한 귀사 의견\\n\\n## 라. 요청 자료 목록\\n- 해당 로트 COA 원본 및 두께 측정 원자료(지점별 값)\\n- 제조일지(생산일, 설비, 주요 공정 조건)\\n- 공정·출하 검사 기록 및 판정 기준\\n- 콜라겐 케이싱 두께 규격서(규격값, 허용 편차)\\n- 보관 샘플 재측정 결과\\n- SI-2025-07 시정조치 보고서 및 유효성 확인 기록\\n- 포장·운송 조건 기록(해당하는 경우)\\n\\n3. 이번 공유는 원인을 함께 파악하고 같은 일이 다시 생기지 않도록 하기 위한 것입니다. 궁금한 점이 있으시면 아래 담당자에게 편하게 연락 주십시오.\\n\\n- 담당: 한결식품 품질보증팀 [확인 필요]\\n- 연락처: [확인 필요] / 이메일: [확인 필요]\\n\\n**한결식품 품질보증팀**"},"000e1cf1b96093":{"title":"햄 중량 규격 하한 이탈(최저 194.2) 및 평균의 지속적 하락 추세(06-20~06-27)","nc_type":"spec_deviation","severity":"major","severity_reason":"규격 하한(195g) 미만이 3건 확인됐고(최악값 194.2), 관리한계 이탈 4건·중심선 아래 11개 연속·통계적으로 유의한 하락 추세(t=-3.6)·Cpk 0.58로 보아 단발성 이상이 아니라 공정 평균이 이동한 것으로 판단됩니다(추정). 다만 안전 위해(이물·병원성 등)와 직접 관련된 정보는 메모에 없어 critical로는 분류하지 않았습니다. 표시 순중량 대비 부족량이 법정 허용오차를 넘으면 등급을 다시 정해야 합니다.","facts":[{"label":"대상 품목/검사 항목","value":"햄 중량, 규격 195~205g","source_quote":"햄 중량 (규격 195~205g)"},{"label":"규격 이탈","value":"3건, 기간 06-23~06-27, 최악값 194.2","source_quote":"규격 이탈 3건 (06-23~06-27, 최악값 194.2)"},{"label":"관리한계 이탈","value":"4건, 기간 06-20~06-27","source_quote":"관리한계 이탈 4건 (06-20~06-27)"},{"label":"연속 패턴","value":"중심선 아래 11개 연속(평균 하락)","source_quote":"중심선 아래에 11개 연속 (평균이 내려감)"},{"label":"추세","value":"최근 21개에서 하루 -0.2277씩 하락, t=-3.6","source_quote":"최근 21개가 하루 -0.2277씩 하락 (t=-3.6)"},{"label":"추세 예측","value":"현재 추세가 이어지면 약 4일 뒤 규격 하한 도달","source_quote":"이 추세면 약 4일 뒤 규격 하한에 닿습니다."},{"label":"공정능력","value":"최근 30개 Cpk 0.58(부족)","source_quote":"최근 30개 Cpk 0.58 (부족)"},{"label":"평균 변화","value":"최근 14개 평균 197.35g, 기준선 평균 199.883g","source_quote":"최근 14개 평균 197.35g (기준선 평균 199.883g)"}],"affected_scope":"[메모로 알 수 있는 것] 규격 이탈 3건이 나온 기간은 06-23~06-27이고, 관리한계 이탈은 06-20부터 시작됐습니다. 최근 14개 측정의 평균은 기준선보다 약 2.5g 낮습니다(199.883 → 197.35).\\n[메모로 알 수 없는 것] 연도, 제품명·규격(SKU), 라인·설비, 로트 번호, 기간 중 생산량·출하량, 측정이 전수인지 샘플링인지(샘플 크기 포함), 이탈품이 지금 어디에 있는지(창고 또는 출하), 06-27 이후의 생산 상황, 표시 순중량. 이번 하락 추세는 06-20 이전부터 시작됐을 수도 있으므로(추정), 영향 로트의 시작 시점은 데이터를 보고 다시 정해야 합니다.","immediate_actions":["06-20~06-27 생산 로트와 그 이후 생산분을 출하 보류하고 격리(로트 목록 확인 필요)","보류 로트를 전수 계량하거나 샘플링을 늘려 중량을 선별하고, 195g 미만품은 따로 분리","이미 출하된 로트가 있는지, 출하처는 어디인지 확인","해당 라인의 충전·성형·슬라이싱 설비의 중량 설정값과 계량기·체크웨어 교정 상태를 바로 점검","원인을 찾을 때까지 중량 측정 빈도를 늘리고, 관리한계 이탈 시 라인을 정지하는 기준을 임시로 적용","표시 순중량과 법정 허용오차 기준으로 적합한지 확인"],"disposition":{"proposal":"hold","reason":"규격 미만품은 확인됐지만 영향 로트 범위, 수량, 출하 여부가 정해지지 않았습니다. 선별을 마칠 때까지 보류하고, 선별 결과를 보고 재작업(재포장·재표시 등)·등급 전환·폐기 중에서 결정하자는 제안입니다. 최종 판정은 품질 책임자가 합니다."},"five_whys":[{"why":"왜 규격 하한(195g) 미만 제품이 나왔는가?","answer":"공정 평균이 아래로 이동했습니다(최근 14개 평균 197.35g, 기준선 199.883g, 중심선 아래 11개 연속).","basis":"memo"},{"why":"왜 공정 평균이 내려갔는가?","answer":"최근 21개 측정에서 하루 약 -0.23g씩 꾸준히 줄어드는 하락 추세가 있습니다(t=-3.6). 급변이 아니라 점진적인 드리프트로 보입니다.","basis":"memo"},{"why":"왜 점진적인 하락이 생겼는가?","answer":"추정: 충전·성형 설비의 마모나 설정값 드리프트, 원료육 수분·배합 변화, 가열·냉각 감량 변화, 계량기 교정 편차 등이 후보입니다. 메모에 근거가 없어 검증해야 합니다.","basis":"assumption"},{"why":"왜 규격 이탈 전에 막지 못했는가?","answer":"추정: 관리한계 이탈은 06-20부터 있었지만(메모), 이상 신호에 대한 대응 절차가 작동했는지는 확인되지 않았습니다. 실시간 경보나 대응 기준이 없었을 가능성이 있습니다.","basis":"assumption"},{"why":"왜 공정능력이 부족한가?","answer":"추정: 평균 이동이 Cpk 저하(0.58)에 주된 영향을 준 것으로 보입니다. 산포 자체도 커졌는지는 데이터를 보고 확인해야 합니다.","basis":"assumption"}],"corrective_actions":["원인 후보(설비 설정·마모, 원료 로트·배합, 가열 감량, 계량기 교정)별로 기록과 데이터를 대조해 원인 확정","확정된 원인에 맞춰 설비 조정·부품 교체·레시피 보정을 하고, 보정 뒤 연속 측정으로 평균이 중심선(약 200g)으로 돌아왔는지 검증","보정 후 Cpk를 다시 평가해 목표치(예: 1.33 이상, 사내 기준 확인 필요) 달성 여부 확인","보류 로트를 선별 결과에 따라 처분하고 기록"],"preventive_actions":["SPC 이상 규칙(관리한계 이탈, 연속 패턴, 추세)을 실시간 경보로 운영하고, 신호 발생 시 대응 절차(OCAP) 문서화","체크웨어·계량기 교정 주기와 일상 점검 강화","충전·성형 설비의 마모 부품을 예방 정비 항목에 반영","원료 로트가 바뀔 때 중량·감량 확인 절차 추가","Cpk 정기 모니터링과 기준 미달 시 검토 회의 운영"],"missing_info":["연도와 정확한 발생 일시, 그리고 이번 추세가 시작된 시점은 언제입니까?","제품명·SKU, 생산 라인과 설비(충전기·슬라이서 등)는 무엇입니까?","06-20~06-27 및 그 이후 생산 로트 번호와 로트별 생산 수량은 얼마입니까?","측정 방식은 전수(체크웨어)입니까, 샘플링입니까? 1개 데이터 포인트가 무엇(개별 제품, 일 평균 등)을 뜻합니까?","해당 로트 중 이미 출하된 수량이 있습니까? 있다면 출하처는 어디입니까?","제품 표시 순중량은 몇 g입니까? 195~205g이 사내 규격인지 표시 기준인지, 194.2g이 법정 허용오차 안에 드는지 알려 주세요.","규격 이탈 3건의 개별 측정값과 단위(g)를 확인할 수 있습니까?","06-20 관리한계 이탈 때 어떤 조치를 했습니까?","같은 기간 설비 정비·설정 변경, 원료 로트 변경, 작업자 교대 같은 변경점이 있었습니까?","계량기의 최근 교정 일자와 결과는 어떻습니까?","발견자·보고자와 담당 부서는 누구입니까?","06-27 이후 현재 생산 중량은 어떻습니까? 4일 뒤 하한 도달 예측의 기준 시점은 언제입니까?"],"report_to_authority":false,"report_markdown":"# 부적합 보고서 (초안)\\n\\n**제목:** 햄 중량 규격 하한 이탈(최저 194.2) 및 평균의 지속적 하락 추세(06-20~06-27)\\n**작성 상태:** 초안. 품질 책임자 검토 필요\\n\\n## 1. 기본 정보\\n| 항목 | 내용 |\\n|---|---|\\n| 보고 번호 | 확인 필요 |\\n| 발생 일시 | 06-20~06-27(연도 확인 필요) |\\n| 제품명 / SKU | 햄 / 확인 필요 |\\n| 라인·설비 | 확인 필요 |\\n| 로트 번호 | 확인 필요 |\\n| 발견자 / 보고자 | 확인 필요 |\\n| 부적합 유형 | 규격 이탈(spec_deviation) |\\n| 심각도(제안) | Major |\\n\\n## 2. 부적합 내용(메모 기준 사실)\\n- 검사 항목: 햄 중량, 규격 195~205g\\n- 규격 이탈 **3건**(06-23~06-27), 최악값 **194.2**(단위 g, 추정)\\n- 관리한계 이탈 **4건**(06-20~06-27)\\n- 중심선 아래 **11개 연속**(평균 하락)\\n- 최근 21개가 **하루 -0.2277씩 하락**(t=-3.6). 이 추세가 이어지면 **약 4일 뒤 규격 하한 도달** 예측\\n- 최근 30개 **Cpk 0.58**(부족)\\n- 최근 14개 평균 **197.35g**, 기준선 평균 **199.883g**\\n\\n## 3. 영향 범위\\n- 메모로 알 수 있는 것: 이탈 기간 06-20~06-27, 공정 평균 약 2.5g 하락\\n- 확인 필요: 로트 목록, 생산량·출하량, 측정 방식(전수/샘플), 표시 순중량, 06-27 이후 생산분, 추세 시작 시점\\n\\n## 4. 즉시 조치(제안)\\n1. 06-20 이후 생산 로트 출하 보류·격리\\n2. 보류 로트 중량 선별, 195g 미만품 분리\\n3. 출하 여부·출하처 확인\\n4. 중량 설정값과 계량기 교정 상태 점검\\n5. 측정 빈도 상향, 임시 라인 정지 기준 적용\\n6. 표시 순중량과 법정 허용오차 기준으로 적합성 확인\\n\\n## 5. 원인 분석(5Why) – 원인 미확정\\n| 단계 | 질문 | 답변 | 근거 |\\n|---|---|---|---|\\n| 1 | 왜 규격 미만품이 나왔나 | 공정 평균 하향 이동 | 메모 |\\n| 2 | 왜 평균이 내려갔나 | 하루 약 -0.23g씩 점진적 하락 추세 | 메모 |\\n| 3 | 왜 하락했나 | 설비 마모·설정 드리프트, 원료·감량 변화, 계량기 편차 등 | **추정** |\\n| 4 | 왜 사전에 막지 못했나 | 06-20 관리한계 이탈 신호에 대응했는지 불명 | **추정** |\\n| 5 | 왜 Cpk가 낮나 | 평균 이동이 주요인으로 보임 | **추정** |\\n\\n## 6. 처분(제안)\\n- **보류(Hold)**: 선별을 마친 뒤 재작업·등급 전환·폐기 중에서 결정\\n- 최종 판정: 품질 책임자(확인 필요)\\n\\n## 7. 시정 조치(제안)\\n- 원인 후보를 검증해 원인 확정 → 설비·레 내**)\\n1. 로트 HS-0620의 제조·포장 공정에서 금속 이물이 들어갈 가능성 조사 및 결과 회신\\n2. 금속 이물 관리 현황 자료 제출(금속검출기·자석·체 등 관리 설비와 운영 기준)\\n3. 로트 HS-0620 관련 기록 제출(아래 자료 목록 참조)\\n4. 개선이 필요한 사항이 확인되면 시정·예방 조치 계획(일정 포함) 회신\\n5. 로트 HS-0620 보관 샘플 보유 여부와 재검사 가능 여부 회신\\n\\n**라. 요청 자료**\\n- 로트 HS-0620 시험성적서(COA)\\n- 로트 HS-0620 제조일지(제조일, 원료 로트, 사용 설비)\\n- 로트 HS-0620 포장·출하 기록\\n- 해당 생산일 금속검출기 운영 기록(감도, 테스트피스 점검 결과, 반응·배출 이력)\\n- 자석 설치 위치와 자력·부착물 점검 기록\\n- 체(시브) 메시 규격과 파손 점검 기록\\n- 분쇄기·혼합기 등 금속 접촉 설비의 점검·보수 기록(해당 기간)\\n- 금속 이물 관리 기준서(HACCP CCP 관련 문서 등)\\n- SI-2025-09 개선 조치의 유지 현황\\n\\n3. 바쁘시더라도 정확한 원인 규명과 재발 방지를 위해 협조 부탁드립니다. 문의 사항은 위 담당자에게 연락해 주시기 바랍니다.\\n\\n**한결식품 품질보증팀**\\n담당: [확인 필요] / 연락처: [확인 필요] / 이메일: [확인 필요]"}}`),jobs:[{id:`claim:CL-001`,status:200,seconds:26.5},{id:`claim:CL-002`,status:200,seconds:32.5},{id:`claim:CL-003`,status:200,seconds:25},{id:`claim:CL-004`,status:200,seconds:28.8},{id:`claim:CL-005`,status:200,seconds:26.7},{id:`claim:CL-006`,status:200,seconds:38.2},{id:`claim:CL-007`,status:200,seconds:28.8},{id:`claim:CL-008`,status:200,seconds:20.9},{id:`equipment`,status:200,seconds:27.3},{id:`hygiene`,status:200,seconds:51},{id:`inspection`,status:200,seconds:77.1},{id:`ncr:from-inspection:햄|중량`,status:200,seconds:59.7},{id:`ncr:NM-001`,status:200,seconds:59.8},{id:`ncr:NM-002`,status:200,seconds:44.5},{id:`ncr:NM-003`,status:200,seconds:51.1},{id:`ncr:NM-004`,status:200,seconds:46.2},{id:`ncr:NM-005`,status:200,seconds:43.8},{id:`ncr:NM-006`,status:200,seconds:44.6},{id:`production:dairy-meat`,status:200,seconds:28},{id:`production:hangyeol`,status:200,seconds:25.4},{id:`regulation:example`,status:200,seconds:22.6},{id:`regulation:R-001`,status:200,seconds:22},{id:`regulation:R-002`,status:200,seconds:36},{id:`regulation:R-003`,status:200,seconds:41.3},{id:`supplier:SC-001:formal_corrective`,status:200,seconds:49.7},{id:`supplier:SC-001:inform`,status:200,seconds:45.2},{id:`supplier:SC-001:request_action`,status:200,seconds:40.5},{id:`supplier:SC-002:formal_corrective`,status:200,
