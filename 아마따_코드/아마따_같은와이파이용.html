<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>아 마따!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: 책상 위에 펼친 노트 한 장. 탭으로 상황을 나누고, 줄 노트처럼 항목을 한 줄씩 쓴다. 맨 아래 줄이 다음 항목을 쓰는 줄이다. */
:root {
  --desk: #E8E5DD;
  --paper: #FBFAF6;
  --ink: #23262C;
  --muted: #6A6964;
  --rule: #DDD9CD;
  --margin: #E8B9B1;
  --pen: #2B4C8C;
  --pen-ink: #FFFFFF;
  --red: #B03A2E;
  --hl: #FFE98A;
  --hl-ink: #4A3B00;
  --font-body: "Gowun Dodum", "Malgun Gothic", system-ui, sans-serif;
  --font-hand: "Nanum Pen Script", "Gowun Dodum", cursive;
  --font-mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #131519; --paper: #1D2026; --ink: #E6E4DE; --muted: #9B9990; --rule: #2D3139; --margin: #5C3C39;
    --pen: #8FB1F2; --pen-ink: #0E1220; --red: #F0907F; --hl: #5C4F14; --hl-ink: #FFF1B0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #131519; --paper: #1D2026; --ink: #E6E4DE; --muted: #9B9990; --rule: #2D3139; --margin: #5C3C39;
  --pen: #8FB1F2; --pen-ink: #0E1220; --red: #F0907F; --hl: #5C4F14; --hl-ink: #FFF1B0;
  color-scheme: dark;
}
body { background: var(--desk); color: var(--ink); font: 16px/1.6 var(--font-body); padding-inline: 16px; padding-block: 20px 56px; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

/* 머리말 */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding-inline: 4px; }
@media (max-width: 640px) { .top .acts { grid-column: 1 / -1; justify-content: flex-start; } }
h1 { display: flex; align-items: center; flex-wrap: wrap; margin: 0; justify-content: center; grid-column: 1 / -1; font-family: var(--font-hand); font-weight: 400; font-size: 40px; line-height: 1.05; color: var(--pen); }
h1 .vv { display: inline-block; transform: rotate(8deg); color: var(--red); margin-left: 1px; }
h1 .thumb { display: inline-block; vertical-align: middle; margin-left: 4px; }
h1 .thumb img { height: 92px; width: auto; display: block; transform: rotate(-7deg); filter: drop-shadow(0 2px 3px rgba(0,0,0,.28)); }
h1 .thumb.left { margin: 0 6px 0 0; }
h1 .thumb.left img { height: 88px; transform: rotate(5deg); }
@media (max-width: 480px) { h1 { padding: 0; } h1 .thumb img { height: 74px; } h1 .thumb.left img { height: 70px; } }
.status { margin-top: 10px; font: 13px/1.4 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ghost { background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--muted); min-height: 36px; }
.ghost:hover { color: var(--ink); border-color: var(--muted); }
.tpl { background: var(--paper); border: 1px dashed var(--rule); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.tpl .row { display: flex; flex-wrap: wrap; gap: 8px; }
.tpl p { margin: 0; font-size: 13.5px; color: var(--muted); }

/* 탭 */
.tabs { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 2px 4px 0; scrollbar-width: thin; }
.tab { flex: 0 0 auto; display: flex; align-items: baseline; gap: 6px; background: transparent; border: 1px solid transparent; border-bottom: 0; border-radius: 10px 10px 0 0; padding: 8px 14px 9px; color: var(--muted); font-size: 15px; min-height: 44px; white-space: nowrap; }
.tab small { font: 12px var(--font-mono); font-variant-numeric: tabular-nums; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--paper); border-color: var(--rule); color: var(--ink); font-weight: 700; }

/* 노트 한 장 */
.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 0 12px 12px 12px; box-shadow: 0 1px 0 var(--rule), 0 10px 24px -18px rgba(0,0,0,.35); padding: 6px 16px 14px 52px; position: relative; min-width: 0; }
.sheet::before { content: ""; position: absolute; left: 38px; top: 0; bottom: 0; width: 1px; background: var(--margin); }
.list { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); position: relative; }
.box { position: relative; width: 34px; height: 34px; margin-left: -4px; border: 0; background: transparent; padding: 0; display: grid; place-items: center; border-radius: 8px; }
.box::before { content: ""; width: 24px; height: 24px; border: 2px solid var(--pen); border-radius: 5px; }
.box:hover:not(:disabled)::before { background: color-mix(in srgb, var(--pen) 14%, transparent); }
.box svg { position: absolute; width: 30px; height: 30px; left: 2px; top: 0; fill: none; stroke: var(--pen); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.box:disabled { cursor: default; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.name { overflow-wrap: anywhere; }
.name em { font-style: normal; font-size: 12px; color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 0 8px; margin-right: 6px; white-space: nowrap; }
.side { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
.time { font: 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.x { background: transparent; border: 0; color: var(--muted); font-size: 18px; line-height: 1; width: 36px; height: 36px; border-radius: 8px; }
.x:hover { color: var(--red); }
.row2 { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.recheck { background: transparent; border: 1.5px solid var(--red); color: var(--red); border-radius: 999px; padding: 6px 16px; min-height: 40px; font-size: 14.5px; font-weight: 700; }
.recheck:hover { background: color-mix(in srgb, var(--red) 10%, transparent); }
.undo { background: transparent; border: 0; color: var(--muted); font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; min-height: 40px; }
.undo:hover { color: var(--ink); }
.tally { color: var(--red); display: inline-flex; align-items: center; gap: 8px; font: 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.tally svg { height: 22px; width: auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.ai { margin: 0; padding: 8px 12px; background: color-mix(in srgb, var(--red) 8%, transparent); border-radius: 8px; font-size: 14.5px; overflow-wrap: anywhere; }
.ai b { font: 700 11px var(--font-mono); color: var(--red); letter-spacing: .1em; margin-right: 8px; }
.ai.muted { background: transparent; color: var(--muted); padding: 0; font-size: 13.5px; }

/* 다음 줄 쓰기 */
.addrow { display: flex; align-items: center; gap: 12px; padding-top: 10px; }
.addrow .plus { width: 34px; margin-left: -4px; text-align: center; font-size: 24px; color: var(--muted); }
.addrow input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1.5px dashed var(--rule); padding: 8px 2px; border-radius: 0; }
.addrow input:focus { outline: none; border-bottom-color: var(--pen); }
.addrow input::placeholder { color: var(--muted); }
.btn { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 8px 16px; min-height: 40px; font-weight: 700; font-size: 14.5px; }
.btn:hover { border-color: var(--muted); }
.btn.pen { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); }
.btn.pen:hover { filter: brightness(1.1); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.hint { color: var(--muted); font-size: 13.5px; margin: 0; padding-inline: 4px; }
.empty { padding: 22px 0 10px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty p { margin: 0; color: var(--muted); }
.empty .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* 스크랩 공고: 형광펜으로 표시한 쪽지 */
.posts { margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
.ptog { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; width: 100%; text-align: left; background: transparent; border: 0; padding: 8px 0; min-height: 40px; color: var(--muted); font-size: 13.5px; }
.ptog:hover { color: var(--ink); }
.ptog .sub { background: var(--hl); color: var(--hl-ink); padding: 0 6px; border-radius: 3px; font-weight: 700; }
.pl { list-style: none; margin: 0; padding: 0; font-size: 14.5px; }
.pl li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px dashed var(--rule); align-items: start; }
.dd { font: 500 13px var(--font-mono); text-align: center; padding: 2px 0; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); font-variant-numeric: tabular-nums; }
.dd.hot { background: var(--hl); border-color: var(--hl); color: var(--hl-ink); font-weight: 700; }
.dd.soon { border-color: var(--red); color: var(--red); }
.pl .c { font-weight: 700; overflow-wrap: anywhere; }
.pl li.hotrow .c a, .pl li.hotrow .c > span:first-child { background: var(--hl); color: var(--hl-ink); padding: 0 4px; border-radius: 3px; }
.pl a { color: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.pl .m { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

.foot { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding-inline: 4px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm span { flex: 1 1 220px; }
.meta { color: var(--muted); font-size: 12.5px; margin: 0; padding-inline: 4px; }

/* 하루 요약: 노트 마지막 장 */
.sum { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 18px 18px 52px; position: relative; display: flex; flex-direction: column; gap: 16px; }
.sum::before { content: ""; position: absolute; left: 38px; top: 0; bottom: 0; width: 1px; background: var(--margin); }
.sum h2 { margin: 0; font: 400 30px/1.1 var(--font-hand); color: var(--pen); }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.num { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.num strong { font: 500 40px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
.num span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.verdict { padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--rule); font-weight: 700; }
.verdict.ok { border-color: var(--pen); color: var(--pen); }
.verdict.bad { border-color: var(--red); color: var(--red); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--rule); font-weight: 400; }
th { color: var(--muted); font-size: 12.5px; }
td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.copied { font: 13px var(--font-mono); color: var(--muted); }
pre.plain { margin: 0; white-space: pre-wrap; font: 13px/1.5 var(--font-mono); background: var(--desk); padding: 10px; border-radius: 8px; user-select: all; }

/* 세부 확인 기준, AI 버튼, AI 분석 */
.stepsbox { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.steps { list-style: none; margin: 0; padding: 0; width: 100%; }
.step { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 4px 0; background: transparent; border: 0; text-align: left; }
.step .sbox { flex: 0 0 22px; width: 22px; height: 22px; border: 1.5px solid var(--muted); border-radius: 4px; display: grid; place-items: center; position: relative; }
.step:hover:not(:disabled) .sbox { border-color: var(--pen); }
.step.done .sbox { border-color: var(--pen); }
.step .sbox svg { width: 20px; height: 20px; fill: none; stroke: var(--pen); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.step .t { flex: 1; min-width: 0; font-size: 14.5px; overflow-wrap: anywhere; }
.step.done .t { color: var(--muted); }
.step .time { font: 12px var(--font-mono); color: var(--muted); white-space: nowrap; }
.sprog { font: 12.5px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.aibtn { background: transparent; border: 1px dashed var(--pen); color: var(--pen); border-radius: 999px; padding: 4px 14px; min-height: 36px; font-size: 13.5px; font-weight: 700; }
.aibtn:hover { background: color-mix(in srgb, var(--pen) 10%, transparent); }
.analysis-wrap { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.analysis { margin: 0; width: 100%; white-space: pre-wrap; padding: 2px 0; background: none; font-size: 14.5px; overflow-wrap: anywhere; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.tabrow { display: flex; align-items: flex-end; gap: 8px; }
.tabrow .tabs { flex: 1; min-width: 0; }
.tabrow .ghost { margin-bottom: 6px; flex: 0 0 auto; }
.ghost[aria-pressed="true"] { border-color: var(--pen); color: var(--pen); font-weight: 700; }
.item.sel { background: color-mix(in srgb, var(--pen) 7%, transparent); box-shadow: -10px 0 0 color-mix(in srgb, var(--pen) 7%, transparent), 10px 0 0 color-mix(in srgb, var(--pen) 7%, transparent); }
.x.w { width: auto; padding: 0 8px; font-size: 13px; }
.name.editing { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* 큰 화면: 외출이나 자리를 비울 때 폰에서 크게 눌러 확인하는 모드 */
.bigbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; font-size: 18px; }
.bigbar.done { border-color: var(--pen); color: var(--pen); }
body.big .top, body.big #tplPanel, body.big #missPanel, body.big #histPanel, body.big #editBtn, body.big #bigBtn, body.big #addRow,
body.big #privacy, body.big #keyHint, body.big .stepsbox, body.big .posts, body.big #syncNote, body.big #foot, body.big #summary { display: none; }
body.big .tab { font-size: 17px; min-height: 52px; padding-inline: 18px; }
body.big .item { grid-template-columns: 56px minmax(0, 1fr); gap: 4px 14px; padding: 20px 0; }
body.big .box { width: 56px; height: 56px; margin-left: -6px; }
body.big .box::before { width: 40px; height: 40px; border-radius: 8px; border-width: 3px; }
body.big .box svg { width: 52px; height: 52px; left: 2px; top: 2px; }
body.big .name { font-size: 21px; line-height: 1.4; }
body.big .name em { font-size: 13px; }
body.big .time { font-size: 15px; }
body.big .recheck { min-height: 52px; font-size: 17px; padding-inline: 22px; }
body.big .undo { min-height: 48px; font-size: 15px; }
body.big .chip { min-height: 44px; font-size: 15px; }
body.big .btn.small { min-height: 52px; font-size: 17px; padding-inline: 24px; }
body.big .tally { font-size: 15px; }
.keys { display: none; }
@media (hover: hover) and (pointer: fine) { .keys { display: block; } }
.field { font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1.5px dashed var(--rule); padding: 8px 2px; border-radius: 0; min-width: 0; }
.field:focus { outline: none; border-bottom-color: var(--pen); }
.field.grow { flex: 1 1 200px; }
.field::placeholder { color: var(--muted); }
.misslist { list-style: none; margin: 0; padding: 0; font-size: 14.5px; }
.misslist li { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; border-top: 1px dashed var(--rule); }
.misslist .d { font: 12.5px var(--font-mono); color: var(--muted); white-space: nowrap; }
.misslist .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.reasons small { color: var(--muted); font-size: 12.5px; margin-right: 2px; }
.chip { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 4px 12px; min-height: 36px; font-size: 13.5px; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--pen-ink); font-weight: 700; }
.timer { font: 500 14px var(--font-mono); color: var(--red); font-variant-numeric: tabular-nums; }
.btn.small { padding: 4px 16px; min-height: 36px; }
.hbars { display: flex; flex-direction: column; gap: 6px; margin: 2px 0; }
.hbar { display: grid; grid-template-columns: 84px minmax(0, 1fr) 34px; gap: 10px; align-items: center; font: 12.5px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.hbar .track { height: 14px; background: var(--desk); border-radius: 3px; overflow: hidden; }
.hbar .fill { display: block; height: 100%; background: var(--red); border-radius: 3px; min-width: 2px; }
.hbar .fill.live { background: transparent; border: 1.5px dashed var(--red); }
.hbar b { color: var(--ink); font-weight: 500; text-align: right; }
.tag { display: inline-block; font: 12px var(--font-body); padding: 0 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); }
.tag.ok { border-color: var(--pen); color: var(--pen); }
.tag.bad { border-color: var(--red); color: var(--red); }
.pl .row2 { margin-top: 4px; }
.plh { margin: 10px 0 0; font: 700 12.5px var(--font-body); color: var(--muted); letter-spacing: .04em; }
.pl li.shut { opacity: .6; }
.posts details summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 8px 0; min-height: 36px; }
@media (max-width: 480px) {
  .sheet { padding-left: 44px; padding-right: 12px; }
  .sheet::before { left: 32px; }
  .sum { padding-left: 44px; padding-right: 14px; }
  .sum::before { left: 32px; }
  .num strong { font-size: 30px; }
  h1 { font-size: 34px; }
}
@media (prefers-reduced-motion: no-preference) {
  .box::before, .btn, .recheck, .tab { transition: background-color .12s, border-color .12s, color .12s; }
}
</style>

<div class="wrap">
  <div class="bigbar" id="bigBar" hidden>
    <strong id="bigTxt"></strong>
    <button class="btn" id="bigExit" type="button">큰 화면 끝</button>

    return rechecksOf(itemId).filter(function (r) { return r.timed && !r.endAt; })[0];
  }
  function itemSecs(item) {
    var sum = 0, n = 0;
    rechecksOf(item.id).forEach(function (r) { if (typeof r.sec === "number") { sum += r.sec; n++; } });
    return n ? fmtDur(sum) : "-";
  }
  function durLine(t) {
    return t.timed
      ? "재확인에 쓴 시간 합계 " + fmtDur(t.secs) + " (시간을 잰 재확인 " + t.timed + "/" + t.rechecks + "회, 평균 " + fmtDur(t.secs / t.timed) + ")"
      : "시간을 잰 재확인이 없습니다. 재확인할 때 '끝'을 눌러야 시간이 기록됩니다.";
  }
  // 재확인 때 Claude가 말하는 개입만 끈다. 확인 기준 쪼개기와 하루 분석은 기록 도구라 그대로 쓴다.
  function interventionOn() { return !!sampleFn && !state.aiOff; }
  function aiLocked() { return !!state.endedAt || state.events.some(function (e) { return e.type === "recheck"; }); }
  // 재확인 이유: 가장 최근 재확인에 선택형으로 하나 표시한다. 안 눌러도 기록은 그대로 남는다.
  function reasonCounts() {
    var c = { trust: 0, content: 0, habit: 0, real: 0, none: 0 };
    state.events.forEach(function (e) { if (e.type === "recheck") c[e.reason && c.hasOwnProperty(e.reason) ? e.reason : "none"]++; });
    return c;
  }
  function reasonLine() {
    var c = reasonCounts(), parts = [];
    REASONS.forEach(function (r) { if (c[r.id]) parts.push(r.name + " " + c[r.id] + "회"); });
    var line = parts.length ? "재확인 이유(표시한 것만): " + parts.join(", ") + (c.none ? ", 표시 안 함 " + c.none + "회" : "") + "." : "재확인 이유를 표시한 것이 없습니다.";
    if (c.trust) line += " '기록을 못 믿겠음'이 " + c.trust + "회 있습니다. 기록을 남겼는데도 믿지 못한다는, 가설의 반증 조건에 해당하는 신호입니다.";

  }
  function reasonNode(ev) {
    var wrap = h("div", { class: "reasons" }, h("small", { text: "왜 다시 봤나요? (선택)" }));
    REASONS.forEach(function (r) {
      wrap.appendChild(h("button", {
        class: "chip", type: "button", "aria-pressed": ev.reason === r.id ? "true" : "false",
        onclick: function () { ev.reason = ev.reason === r.id ? undefined : r.id; if (!ev.reason) delete ev.reason; save(); render(); }
      }, r.name));

    return wrap;
  }
  function findItem(id) { return state.items.filter(function (i) { return i.id === id; })[0]; }
  // 세부 확인은 단계별 step/unstep 이벤트의 마지막 값으로 정한다.
  function stepOn(itemId, stepId) {

    state.events.forEach(function (e) {

  function stepsDone(item) { return (item.steps || []).filter(function (s) { return stepOn(item.id, s.id); }).length; }
  function stepsLine(item) {
    return (item.steps || []).map(function (s) { var e = stepOn(item.id, s.id); return "- " + s.text + (e ? " (확인 " + hms(e.at) + ")" : " (미확인)"); }).join("\n");
  }
  function toggleStep(item, s) {
    if (state.endedAt) return;
    state.events.push({ itemId: item.id, type: stepOn(item.id, s.id) ? "unstep" : "step", stepId: s.id, at: new Date().toISOString() });

  function totals() {
    var checks = state.items.filter(function (i) { return checkOf(i.id); }).length;

    var items = state.items.filter(function (i) { return rechecksOf(i.id).length > 0; });
    var secs = 0, timed = 0;
    state.events.forEach(function (e) { if (e.type === "recheck" && typeof e.sec === "number") { secs += e.sec; timed++; } });
    return { checks: checks, rechecks: rechecks, rechecked: items, secs: secs, timed: timed };
  }
  function verdict(t) {
    if (t.rechecked.length >= 5 || t.rechecks >= 10) return { cls: "bad", text: "기준상 반증 쪽입니다. 기록을 남긴 뒤에도 재확인이 많아서, 원인이 기록 부재보다 불안 자체일 가능성이 큽니다." };
    if (t.rechecked.length <= 2 && t.rechecks <= 3) return { cls: "ok", text: "기준상 지지 쪽입니다. " + (state.aiOff ? "AI 개입 없이 기록만으로 나온 결과입니다." : "단, 이 결과는 기록과 Claude 개입이 합쳐진 효과입니다.") };

  }

  /* ---------- 사람인 스크랩 공고 ---------- */
  function isDeadlineItem(item) { return /마감/.test(item.text) && /(지원서|공고)/.test(item.text); }
  function kstDay(d) { var x = new Date(d.getTime() + 9 * 3600000); return Date.UTC(x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate()); }
  function dday(iso) { return Math.round((kstDay(new Date(iso)) - kstDay(new Date())) / 86400000); }
  function ddLabel(n) { return n === 0 ? "D-day" : "D-" + n; }
  function openDated() {
    return posts.filter(function (p) { return p.status === "open" && p.deadlineAt && new Date(p.deadlineAt) > new Date() && !marks[postKey(p)]; })
      .sort(function (a, b) { return new Date(a.deadlineAt) - new Date(b.deadlineAt); });
  }
  function nearestLine(item) {

  }
  // kind: "dated"(마감일 있음), "ongoing"(상시·채용시), "closed"(마감됨)

  function postingsNode() {

    var nearTxt = soon[0] ? "가장 가까운 마감 " + soon[0].company + " " + ddLabel(dday(soon[0].deadlineAt)) : "";

    var inner = h("div");
    function paint() {

    // 1) 마감 임박: 맨 위에 강조해서 보여 준다.

    if (soon.length) inner.appendChild(postList(soon, "dated"));
    else inner.appendChild(h("p", { class: "hint", text: NEAR_DAYS + "일 안에 마감되는 공고가 없습니다." }));
    // 2) 그 밖에 진행 중인 공고: 아래로 내리면 보인다.

      .sort(function (a, b) { return (b.closedDate || b.deadlineAt || "").localeCompare(a.closedDate || a.deadlineAt || ""); });

  /* ---------- 저장 ---------- */
  async function initStore() {
    try {
      var c = window.claude;
      if (c && c.use) {
        var parts = await Promise.all([c.use("db"), c.use("user")]);
        var db = parts[0], user = parts[1];
        if (db && user) {
          var id = await user.id();
          if (id) { store = { kind: "db", col: db.collection("data/users/" + id), db: db }; return; }
        }
      }
    } catch (e) {}
    try { localStorage.setItem("rc_probe", "1"); localStorage.removeItem("rc_probe"); store = { kind: "local" }; }
    catch (e) { store = { kind: "memory" }; }
  }
  async function readDoc(name) {
    if (store.kind === "db") { var snap = await store.col.doc(name).get(); return snap.exists ? snap.data() : null; }
    if (store.kind === "local") { try { var raw = localStorage.getItem("rc_" + name); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
    return null;
  }
  async function writeDoc(name, data) {
    if (store.kind === "db") await store.col.doc(name).set(data);
    else if (store.kind === "local") { try { localStorage.setItem("rc_" + name, JSON.stringify(data)); } catch (e) {} }
  }
  function save() {
    var snap = JSON.parse(JSON.stringify(state));
    saving = saving.then(function () { return writeDoc("current", snap); })
      .then(function () { setSync(false); })
      .catch(function () { setSync(true); });
    return saving;
  }
  function setSync(failed) {
    var t = {
      db: "저장: 내 Claude 계정의 이 페이지 저장소. 다음에 열어도 이어집니다.",
      local: "저장: 이 브라우저에만 저장됩니다. 기기를 바꾸면 보이지 않습니다.",
      memory: "저장되지 않습니다. 탭을 닫으면 기록이 사라지니 하루 끝 화면을 복사해 두세요."
    }[store.kind];
    $("syncNote").textContent = failed ? "저장에 실패했습니다. 잠시 뒤 다시 시도되며, 화면의 기록은 그대로 유지됩니다." : t;
  }

  /* ---------- 동작 ---------- */
  function addItem(text, group) {
    text = (text || "").trim();
    if (!text || state.endedAt) return false;
    state.items.push({ id: uid(), text: text, group: group || lastGroup, createdAt: new Date().toISOString() });
    save(); render();
    return true;
  }
  function removeItem(id) {
    if (checkOf(id) || state.endedAt) return;
    state.items = state.items.filter(function (i) { return i.id !== id; });
    save(); render();
  }
  function check(id) {
    if (state.endedAt || checkOf(id)) return;
    state.events.push({ itemId: id, type: "check", at: new Date().toISOString() });
    save(); render();
  }
  function uncheck(id) {
    if (state.endedAt || !checkOf(id) || rechecksOf(id).length) return;
    state.events.push({ itemId: id, type: "uncheck", at: new Date().toISOString() });
    delete msgs[id];
    save(); render();
  }

  var ERR = {
    not_granted: "Claude 사용을 허용하지 않아서 개입 없이 횟수만 기록합니다.",
    sampling_disabled: "이 계정에서는 Claude를 쓸 수 없어 횟수만 기록합니다.",
    rate_limited: "Claude 사용 한도에 걸렸습니다. 횟수는 기록되었습니다.",
    session_expired: "다시 로그인해야 Claude 개입이 동작합니다. 횟수는 기록되었습니다.",
    upstream_error: "Claude 연결이 불안정했습니다. 횟수는 기록되었습니다.",
    empty_completion: "Claude가 답을 만들지 못했습니다. 횟수는 기록되었습니다.",
    refused: "Claude가 이 항목에는 답하지 않았습니다. 횟수는 기록되었습니다."
  };

  function endRecheck(id) {
    var ev = openRecheck(id);
    if (!ev || state.endedAt) return;
    var now = new Date();
    ev.endAt = now.toISOString();
    ev.sec = Math.round((now.getTime() - new Date(ev.at).getTime()) / 1000);
    save(); render();
  }

  async function recheck(id) {
    if (state.endedAt) return;
    var item = state.items.filter(function (i) { return i.id === id; })[0];
    var first = checkOf(id);
    if (!item || !first) return;

    // 1) 횟수를 먼저 올리고 저장한다. 개입 결과가 횟수에 영향을 줄 수 없게 하는 순서.
    // 끝을 누르지 않고 새로 누른 경우 이전 타이머는 시간을 알 수 없는 것으로 남긴다.
    rechecksOf(id).forEach(function (r) { if (r.timed && !r.endAt) r.timed = false; });
    var ev = { itemId: id, type: "recheck", at: new Date().toISOString(), timed: true };
    state.events.push(ev);
    var n = rechecksOf(id).length;
    msgs[id] = interventionOn() ? { status: "wait", text: "" } : null;
    render();
    await save();

    // 2) 그 다음에 Claude가 개입한다. 개입을 끈 하루에는 여기서 끝난다.
    if (!interventionOn()) return;
    if (ctls[id]) ctls[id].abort();
    var ctl = new AbortController();
    ctls[id] = ctl;
    var prompt = [
      "너는 확인 기록을 읽어 주는 보조자다. 사용자는 업무를 끝낼 때마다 빠뜨린 것이 없는지 확인하고, 이미 확인한 것도 불안해서 다시 확인하는 습관이 있다. 아래는 사용자가 방금 '다시 확인했음'을 누른 항목의 기록이다.",
      "",
      "항목: " + item.text,
      "분류: " + groupName(groupOf(item)),
      "처음 체크한 시각: " + hms(first.at),
      "지금 시각: " + hms(ev.at),
      "이 항목의 재확인 횟수(방금 것 포함): " + n,
      nearestLine(item),
      item.steps && item.steps.length ? "세부 확인 기록:\n" + stepsLine(item) : "",
      "",
      "한국어로 두세 문장 이내로 답해라.",
      "1) 기록된 사실만 말한다. 몇 시에 체크했고 지금까지 몇 번 다시 확인했는지.",
      "2) 이 항목에서 실제로 다시 볼 필요가 있다면 무엇을 보면 되는지, 구체적인 확인 대상 하나를 제안한다. 항목 글만으로 알 수 없으면 추측하지 말고 '이 항목의 어떤 부분이 걱정되는지 한 가지만 적어 보세요'라고 한다.",
      "세부 확인 기록이 있으면 그 사실을 근거로 한다. 모두 확인했다면 그 사실과 시각을 말하고, 미확인 단계가 있으면 그 단계를 짚는다.",
      "위로, 칭찬, 훈계, 진단, 불안에 대한 해석은 하지 않는다. 마크다운 없이 평문으로 쓴다."
    ].join("\n");
    try {
      var res = await sampleFn(prompt, {
        modelTier: "quick",
        cache: false,
        signal: ctl.signal,
        onText: function (u) { msgs[id] = { status: "wait", text: u.text }; renderItemMsg(id); }
      });
      msgs[id] = { status: "done", text: res.text };
      ev.ai = res.text;
      save();
    } catch (e) {
      if (e && e.code === "cancelled") { if (e.text) { ev.ai = e.text; save(); } return; }
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) sampleFn = null;
      msgs[id] = { status: "err", text: (e && e.text ? e.text + "\n" : "") + (ERR[e && e.code] || ERR.upstream_error) };
    }
    render();
  }

  /* ---------- 항목 편집과 키보드 ---------- */
  function visibleItems() { return state.items.filter(function (i) { return tab === "all" || groupOf(i) === tab; }); }
  function moveItem(id, dir) {
    var vis = visibleItems(), i = -1;
    vis.forEach(function (x, k) { if (x.id === id) i = k; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= vis.length || state.endedAt) return;
    var a = state.items.indexOf(vis[i]), b = state.items.indexOf(vis[j]);
    var tmp = state.items[a]; state.items[a] = state.items[b]; state.items[b] = tmp;
    save(); render();
  }
  function commitEdit(id, text) {
    var item = findItem(id);
    text = (text || "").trim();
    editingId = null;
    if (item && text && text !== item.text && !state.endedAt) { item.text = text; save(); }
    render();
  }
  function selMove(dir) {
    var vis = visibleItems(), i = -1;
    if (!vis.length) return;
    vis.forEach(function (x, k) { if (x.id === selId) i = k; });
    i = i < 0 ? (dir > 0 ? 0 : vis.length - 1) : Math.min(vis.length - 1, Math.max(0, i + dir));
    selId = vis[i].id; scrollSel = true; render();
  }
  function onKey(e) {

      if (t.rechecks) notes.push(durLine(t));
      if (t.rechecks) notes.push(reasonLine());
      notes.push(missesToday().length ? "오늘 빠뜨림으로 기록한 것 " + missesToday().length + "건 (최근 7일 " + missRecent(7) + "건)." : "오늘 빠뜨림으로 기록한 것은 없습니다 (최근 7일 " + missRecent(7) + "건). 재확인이 있었는데 실제로 빠뜨린 일이 없었다면, 재확인이 위험을 막은 것인지 불안인지 이 숫자로 비교해 볼 수 있습니다.");
      if (unchecked > 0) notes.push("체크하지 못한 항목 " + unchecked + "개는 위 숫자에 들어가지 않았습니다.");
      if (undoCount()) notes.push("실수로 취소한 체크 " + undoCount() + "회는 이벤트 기록에 남아 있습니다.");
      var dl = state.items.filter(isDeadlineItem);
      if (dl.length) notes.push("마감 확인 항목은 공고 목록과 D-day가 함께 보였던 항목이라 다른 항목과 조건이 다릅니다: " + dl.map(function (i) { return i.text + " 재확인 " + rechecksOf(i.id).length + "회"; }).join(", ") + ".");
      notes.forEach(function (n) { s.appendChild(h("p", { class: "meta", style: "padding:0", text: n })); });
      if (t.rechecked.length) {
        var tbody = h("tbody");
        t.rechecked.forEach(function (i) {
          var list = rechecksOf(i.id);
          tbody.appendChild(h("tr", null,
            h("td", { text: i.text }),
            h("td", { class: "n", text: hms(checkOf(i.id).at) }),
            h("td", { class: "n", text: String(list.length) }),
            h("td", { class: "n", text: hms(list[list.length - 1].at) }),
            h("td", { class: "n", text: itemSecs(i) })
          ));
        });
        s.appendChild(h("div", { class: "tbl" }, h("table", null,
          h("thead", null, h("tr", null, h("th", { text: "항목" }), h("th", { class: "n", text: "체크" }), h("th", { class: "n", text: "재확인" }), h("th", { class: "n", text: "마지막" }), h("th", { class: "n", text: "시간" }))),
          tbody
        )));
      }
      s.appendChild(h("p", { class: "meta", style: "padding:0", text: "기준: 지지는 재확인 항목 2개 이하이고 총 3회 이하, 반증은 항목 5개 이상이거나 총 10회 이상입니다. " + (state.aiOff ? "이 하루는 AI 개입 없이 측정했습니다." : "Claude 개입이 켜진 상태의 측정이라 기록만의 효과는 분리되지 않습니다.") }));
      if (sampleFn || state.analysis) s.appendChild(analysisNode());
      var actions = h("div", { class: "row2" },
        h("button", { class: "btn", type: "button", onclick: function () {
          var txt = summaryText(t);
          copyNote = ""; copyFallback = "";
          var ok = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject();
          ok.then(function () { copyNote = "요약을 복사했습니다."; render(); }).catch(function () { copyFallback = txt; copyNote = "복사가 막혀 있어 아래 글을 직접 선택해 복사하세요."; render(); });
        } }, "요약 복사"),
        copyNote ? h("span", { class: "copied", text: copyNote }) : null
      );
      s.appendChild(actions);
      if (copyFallback) s.appendChild(h("pre", { class: "plain", text: copyFallback }));
      sum.appendChild(s);
    }
  }

  /* ---------- 시작 ---------- */
  function submitNew() {
    var i = $("newItem");
    if (addItem(i.value, tab === "all" ? lastGroup : tab)) { i.value = ""; }
    i.focus();
  }
  function wire() {
    $("addBtn").addEventListener("click", submitNew);
    $("newItem").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submitNew(); }
    });
    $("tplBtn").addEventListener("click", function () { tplOpen = !tplOpen; tplNote = ""; if (tplOpen) { histOpen = false; missOpen = false; } render(); });
    $("missDate").value = todayStr();
    $("missDate").max = todayStr();
    function submitMiss() {
      var t = $("missText");
      if (addMiss(t.value, $("missDate").value)) { t.value = ""; $("missDate").value = todayStr(); }
      t.focus();
    }
    $("missAdd").addEventListener("click", submitMiss);
    $("missText").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submitMiss(); } });
    $("missBtn").addEventListener("click", function () {
      missOpen = !missOpen;
      if (missOpen) { tplOpen = false; histOpen = false; }
      render();
    });
    $("editBtn").addEventListener("click", function () { editMode = !editMode; editingId = null; render(); });
    function setBig(on) {
      if (on === bigMode) return;
      bigMode = on;
      if (on) { prevTab = tab; if (tab === "all") tab = "out"; editMode = false; editingId = null; tplOpen = false; histOpen = false; missOpen = false; }
      else tab = prevTab;
      render();
      try { window.scrollTo(0, 0); } catch (e) {}
    }
    $("bigBtn").addEventListener("click", function () { setBig(true); });
    $("bigExit").addEventListener("click", function () { setBig(false); });
    document.addEventListener("keydown", onKey);
    $("aiBtn").addEventListener("click", function () {
      if (aiLocked()) return;
      state.aiOff = !state.aiOff;
      save(); render();
    });
    $("histBtn").addEventListener("click", function () {
      histOpen = !histOpen;
      if (histOpen) { tplOpen = false; missOpen = false; loadHistory(); } else render();
    });
  }

  async function boot() {
    wire();
    await initStore();
    try { sampleFn = (window.claude && window.claude.use) ? await window.claude.use("sample") : null; } catch (e) { sampleFn = null; }
    var s = null;
    try { s = await readDoc("current"); } catch (e) { s = null; }
    // db가 돌려주는 문서는 고정(frozen)되어 있으므로 복제해서 쓴다.
    state = (s && s.items && s.events) ? JSON.parse(JSON.stringify(s)) : freshDay();
    // 분류가 없던 이전 버전의 항목은 예시 문구로 분류를 찾고, 없으면 업무 마무리에 둔다.
    state.items.forEach(function (i) {
      if (i.group) return;
      var ex = EXAMPLES.filter(function (e) { return e.t === i.text; })[0];
      i.group = ex ? ex.g : "work";
    });
    try { var pm = await readDoc("postmarks"); marks = pm && pm.marks ? JSON.parse(JSON.stringify(pm.marks)) : {}; } catch (e) { marks = {}; }
    try { var mdoc = await readDoc("misses"); misses = mdoc && mdoc.list ? JSON.parse(JSON.stringify(mdoc.list)) : []; } catch (e) { misses = []; }
    try { tpl = await readDoc("templates"); tpl = tpl ? JSON.parse(JSON.stringify(tpl)) : null; } catch (e) { tpl = null; }
    setSync(false);
    if (!sampleFn) $("privacy").textContent = "이 화면에서는 Claude 개입을 쓸 수 없어 체크와 재확인 횟수만 기록합니다.";
    if (store.kind === "db") {
      try {
        store.db.collection("postings").onSnapshot(function (snap) { posts = snap.docs.map(function (d) { return d.data(); }); render(); }, function () {});
        store.db.doc("meta/postings").onSnapshot(function (snap) { postsAsOf = snap.exists ? snap.data().asOf : null; render(); }, function () {});
      } catch (e) {}
    }
    render();
    // 진행 중인 재확인 타이머 글자만 1초마다 갱신한다(화면을 다시 그리지 않는다).
    setInterval(function () {
      var els = document.querySelectorAll("[data-since]");
      for (var i = 0; i < els.length; i++) els[i].textContent = timerText(els[i].getAttribute("data-since"));
    }, 1000);
  }
  boot();
})();
</script>

</body></html>
