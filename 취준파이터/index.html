let ac = null;
function initAudio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(f, d=0.08, type='square', v=0.06){
  if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f; g.gain.value = v;
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
}

  {bpm:108, bass:[0,null,0,null,5,null,5,null,3,null,3,null,7,null,5,null],   lead:[12,null,15,12,null,10,null,12,null,15,17,null,15,null,12,null], wave:'square'},
  {bpm:128, bass:[0,null,7,null,0,null,7,null,5,null,12,null,5,null,12,null], lead:[19,null,16,null,19,21,null,19,16,null,14,null,16,null,null,null], wave:'triangle'},
  {bpm:96,  bass:[0,0,null,0,3,3,null,3,0,0,null,0,-2,-2,null,-2],            lead:[15,null,14,null,12,null,null,null,15,null,14,null,10,null,null,null], wave:'sawtooth'},
];
let bgmOn = true, bgmTimer = null, bgmStep = 0;
const noteF = n => 110*Math.pow(2,n/12);
function startBGM(){
  stopBGM(); if(!bgmOn) return;

    if(s.lead[i]!=null) beep(noteF(s.lead[i]), .1, s.wave, .022);
  }, 60000/s.bpm/2);
}
function stopBGM(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; } }
function syncBGM(){
  const inFight = scene==='intro' || scene==='fight' || scene==='roundEnd' || scene==='final';
  if(inFight && bgmOn && !bgmTimer && ac) startBGM();
  if(!inFight || !bgmOn) stopBGM();
}

  {name:'대기업',   lv:.7,  hp:1.2, pow:1.1,  company:'초일류그룹',   desc:'반응 빠르고 방어 철벽. 필살기도 놓치지 않는다'},

  {name:'실무진 면접',  sub:'현업 팀장의 압박 질문', map:0, opp:'rand', intro:'"그래서 그 프로젝트에서 본인 역할은요?"',  clear:'실무진 면접 통과! 임원 면접이 잡혔습니다.'},

const WIN_LINES = {dev:'내 PC에선 됐는데?', mkt:'이 승리, 바이럴 가자!', sales:'이번 건, 계약 성사입니다', hr:'결과는 개별 통보드립니다', des:'최종_진짜최종_final2.png', qc:'이 승리는 규격 적합입니다', exec:'자네, 다음 기회에 다시 보세'};

function mkFighter(p, ch){

/* ---------- 공격 정의 ---------- */
const ATK = {
  punch:{dur:.16, hit:[.05,.11], dmg:5,  reach:68, kb:320, stun:.28},
  kick: {dur:.30, hit:[.10,.19], dmg:10, reach:92, kb:640, stun:.45},
  skill:{dur:.30, spawn:.12, dmg:9},
  // 필살기: 펀치·킥 2번씩 4연타 (5+10+5+10 = 30). 가드 위로는 20%(6)만, KO 불가. 맞으면 마지막 타격에 0.5초 스턴
  low:  {dur:.30, hit:[.10,.19], dmg:8,  reach:88, kb:420, stun:.4},   // 앉아서 킥 = 하단킥
  ult:  {dur:.95, hits:[.4,.52,.64,.76], dmgs:[5,10,5,10]},
};

function onGround(f){ return f.y >= GROUND; }

function startAtk(f, type){
  f.atk = {type, t:0, done:false, hits:0, mode:null};
  if(type==='ult'){ f.ultUsed = true; f.vx = 0; cut = {t:1.0, f}; sfx.ult(); }
  else if(type==='skill'){ f.cd = f.ch.cd; sfx.skill(); popup(f.x, f.y-150, f.ch.shout, '#fff', 1.1); }
  else sfx.swing();
}

// type: punch | kick | low | proj | ult.
// 서서 막기(J)는 하단킥(↓+킥)을 못 막고, 앉아 막기(↓+J)는 하단킥만 막는다. 필살기는 가드 위로 50% 관통.
function hurt(att, def, dmg, kb, stun, big, type, pierce){
  if(def.ko) return;
  // 필살기 시전 중: 전신 슈퍼아머 (피해 12%, 경직·넉백 없음, 이걸로는 쓰러지지 않음)
  if(def.atk && def.atk.type==='ult'){
    def.hp = Math.max(Math.min(1,def.hp), def.hp - dmg*0.12);
    sfx.block(); popup(def.x, def.y-165, '슈퍼아머!', '#fd5', .8);
    for(let i=0;i<4;i++) sparks.push({x:def.x,y:def.y-80,vx:(Math.random()-.5)*300,vy:-Math.random()*200,t:.25});
    return;
  }
  let blocking = false, pierced = false;
  if(def.guard && type!=='ult') blocking = (type==='low') ? def.crouch : !def.crouch;
  if(pierce) pierced = true;
  if(pierced){
    dmg *= ULT_BLOCK_RATE; kb *= 0.5; stun = 0.1; sfx.block(); if(big) shake = 14;
    popup(def.x, def.y-140, '가드 붕괴!', '#f93', 1);
  } else if(blocking){
    dmg *= (type==='low') ? 0 : 0.12; kb *= 0.35; stun = 0.08; sfx.block();
    popup(def.x, def.y-140, BLOCK_WORDS[Math.random()*BLOCK_WORDS.length|0], '#7cf', 0.8);
  } else {
    if(def.guard && type!=='ult') popup(def.x, def.y-165, type==='low'?'하단 공격! 앉아서 막아':'가드 실패!', '#fa3', 0.8);
    sfx.hit(); if(big){ sfx.big(); shake = 10; }
    popup(def.x, def.y-140, HIT_WORDS[Math.random()*HIT_WORDS.length|0], big?'#ff5':'#fff', big?1.2:0.9);
    att.combo++; att.comboT = 1.2; def.atk = null;
  }
  def.hp = Math.max(pierced ? Math.min(1, def.hp) : 0, def.hp - dmg);   // 가드 위 필살기로는 쓰러지지 않음
  def.stun = stun; def.vx = att.x < def.x ? kb : -kb;
  if(!onGround(def) && !blocking && !pierced) def.vy = -200;
  for(let i=0;i<8;i++) sparks.push({x:def.x,y:def.y-80,vx:(Math.random()-.5)*400,vy:-Math.random()*300,t:.3});
  if(!blocking && !pierced) rings.push({x:def.x,y:def.y-80,t:.25,big});
  if(def.hp<=0) koFighter(def, att);
}
function koFighter(def, att){
  def.ko = true; def.vy=-350; def.vx = att.x<def.x?300:-300; sfx.ko(); shake=16;
  endRound(att.p);
}
function endRound(w, draw){
  if(scene!=='fight') return;
  scene='roundEnd'; sceneT=0; winner=w;
  if(draw){ banner='시간 초과 무승부! 😐'; }
  else { F[w].wins++; banner = '퇴사 처리!'; }
}

function popup(x,y,txt,color,size){ pops.push({x,y,txt,color,size:size||1,t:1}); }

/* ---------- 업데이트 ---------- */
function updateFighter(f, o, dt, down=GDOWN, just=GJUST){
  const k = CTRL[f.p]; f.t += dt;
  f.cd = Math.max(0, f.cd-dt); f.comboT -= dt; if(f.comboT<=0) f.combo=0;
  const air = !onGround(f);
  f.vy += 1900*dt; f.y += f.vy*dt;
  if(f.y>=GROUND){ f.y=GROUND; f.vy=0; if(f.ko){ f.vx*=0.9; } }
  f.x += f.vx*dt; f.vx *= air ? 0.995 : 0.86;
  f.x = Math.max(40, Math.min(W-40, f.x));
  f.guard = false; f.crouch = false;
  if(f.ko) return;

  if(f.stun>0){ f.stun-=dt; return; }
  if(f.lag>0){ f.lag-=dt; return; }   // 필살기가 막힌 뒤 딜레이 (품질팀): 이 동안 무방비

  if(f.atk){
    const a = f.atk, d = ATK[a.type]; a.t += dt;
    // 펀치/킥 직후 나머지 버튼을 늦게 눌러도 필살기로 이어짐
    if(ultReady(f) && (a.type==='punch'||a.type==='kick') && a.t<0.12 &&
       ((a.type==='punch' && just.has(k.b)) || (a.type==='kick' && just.has(k.a)))){ startAtk(f,'ult'); return; }
    if(a.type==='ult'){
      if(a.t>0.2 && a.t<0.36){ const gap=(o.x-f.x)*f.face; if(gap>58) f.x += f.face*Math.min(gap-58, 1000*dt); }
      while(a.hits<4 && a.t>=d.hits[a.hits]){
        const i = a.hits++, dx = (o.x-f.x)*f.face, u = ULTS[f.ch.id];
        fxs.push({style:u.style,i,x:f.x+f.face*30,y:f.y-85,tx:o.x,ty:o.y-85,t:.55,max:.55,rnd:Math.random(),
                  blobs:Array.from({length:6},()=>({dx:(Math.random()-.5)*130,dy:(Math.random()-.5)*130,r:14+Math.random()*26,c:['#ff4d6d','#ffd23f','#3bceac','#4d9de0','#9d4edd'][Math.random()*5|0]}))});
        for(let n=0;n<6;n++) emos.push({x:f.x+f.face*60,y:f.y-80,vx:f.face*(150+Math.random()*450),vy:-Math.random()*350,t:.8,e:u.fx[Math.random()*u.fx.length|0]});
        if(dx>-10 && dx<120 && Math.abs(o.y-f.y)<95 && !o.ko){
          if(a.mode===null) a.mode = o.guard ? 'block' : 'hit';
          hurt(f,o,d.dmgs[i]*f.ch.pow, i===3?720:240, i===3?.5:.25, i===3, 'ult', a.mode==='block');
          if(i===3 && a.mode!=='block') popup(o.x,o.y-170,'0.5초 스턴!','#ff0',1);
        }
      }
    } else if(a.type==='skill'){
      if(!a.done && a.t>=d.spawn){
        a.done=true;
        projs.push({x:f.x+f.face*40, y:f.y-85, vx:f.face*(f.ch.id==='sales'?620:480), owner:f.p, emoji:f.ch.proj, dmg:d.dmg*f.ch.pow*(f.ch.skillDmg||1), t:0, rot:0});
      }
    } else if(!a.done && a.t>=d.hit[0] && a.t<=d.hit[1]){
      const dx = (o.x-f.x)*f.face;
      if(dx>-10 && dx<d.reach+18 && Math.abs(o.y-f.y)<95){
        a.done=true; hurt(f,o,d.dmg*f.ch.pow,d.kb,d.stun,a.type==='kick',a.type);
      }
    }
    if(a.t>=d.dur){
      if(a.type==='ult' && a.mode==='block' && f.ch.ultBlockLag){ f.lag=f.ch.ultBlockLag; popup(f.x,f.y-150,'딜레이...','#9cf',.9); }
      f.atk=null;
    }
    if(f.atk && f.atk.type!=='skill') { /* 공격 중 약한 이동 */ }
    return;
  }

  // 방어
  if(down.has(k.d) && !air){ f.guard=true; f.crouch=down.has(k.down); f.vx*=0.5; if(!f.crouch) f.face = o.x>=f.x?1:-1; return; }
  f.crouch = !air && down.has(k.down);
  // 필살기: 펀치+킥 동시
  if(ultReady(f) && ((just.has(k.a)&&down.has(k.b)) || (just.has(k.b)&&down.has(k.a)))){ startAtk(f,'ult'); return; }
  // 이동 (앉으면 못 움직임)
  const sp = 230*f.ch.spd;
  let mv = 0;
  if(!f.crouch){ if(down.has(k.left)) mv-=1; if(down.has(k.right)) mv+=1; }
  if(mv){ f.x += mv*sp*dt; f.walkT += dt; }
  else f.walkT = 0;
  f.x = Math.max(40, Math.min(W-40, f.x));
  if(!air){ f.face = o.x>=f.x?1:-1; }
  if(just.has(k.up) && !air) f.vy = -760*(f.ch.jump||1);
  if(just.has(k.a)) startAtk(f,'punch');
  else if(just.has(k.b)) startAtk(f, f.crouch ? 'low' : 'kick');
  else if(just.has(k.c) && f.cd<=0) startAtk(f,'skill');
}

function update(dt){
  if(just.has('KeyM')){ bgmOn=!bgmOn; if(bgmOn) startBGM(); else stopBGM(); }
  if(scene==='select') return updateSelect(dt);
  if(scene==='map') return updateMap(dt);
  if(FLOW_SCENES.includes(scene)) return updateFlow(dt);
  sceneT += dt; shake = Math.max(0, shake-40*dt);
  if(just.has('Escape')){ scene = mode==='single' ? 'menu' : 'select'; cut=null; sel[0].lock=sel[1].lock=false; return; }
  // 필살기 컷신: 월드 정지
  if(cut){ cut.t -= dt; if(cut.t<=0) cut=null; updateFx(dt); return; }

  if(scene==='intro'){ if(sceneT>1.6){ scene='fight'; sceneT=0; banner='FIGHT!'; } }
  if(scene==='fight' || scene==='roundEnd' || scene==='intro'){
    if(scene!=='intro'){
      for(const f of F) if(f.cpu){ if(scene==='fight') aiThink(f,F[1-f.p],dt); else { f.cpu.down.clear(); f.cpu.just.clear(); } }
      for(const f of F) f.cpu ? updateFighter(f,F[1-f.p],dt,f.cpu.down,f.cpu.just) : updateFighter(f,F[1-f.p],dt);
      // 겹침 방지
      const dx = F[1].x-F[0].x;
      if(Math.abs(dx)<38 && !F[0].ko && !F[1].ko && Math.abs(F[0].y-F[1].y)<60){
        const push=(38-Math.abs(dx))/2*(dx>=0?1:-1);
        F[0].x-=push; F[1].x+=push;
      }
    }
    // 투사체
    for(const p of projs){
      p.x += p.vx*dt; p.t+=dt; p.rot += dt*12;
      const t = F[1-p.owner];
      if(!p.dead && !t.ko && Math.abs(p.x-t.x)<34 && Math.abs(p.y-(t.y-70))<70){
        p.dead=true; hurt(F[p.owner], t, p.dmg, 560, .4, true, 'proj');
      }
      if(p.x<-50||p.x>W+50) p.dead=true;
    }
    // 투사체끼리 상쇄
    if(projs.length>1){ for(let i=0;i<projs.length;i++)for(let j=i+1;j<projs.length;j++){ const a=projs[i],b=projs[j]; if(a.owner!==b.owner&&!a.dead&&!b.dead&&Math.abs(a.x-b.x)<30){a.dead=b.dead=true;sfx.block();popup((a.x+b.x)/2,a.y-30,'충돌!','#fc6',.8);} } }
    projs = projs.filter(p=>!p.dead);
  }
  if(scene==='fight'){
    if(sceneT>0.8 && banner==='FIGHT!') banner='';
    timeLeft -= dt;
    if(timeLeft<=0){
      timeLeft=0;
      if(F[0].hp===F[1].hp) endRound(-1,true);
      else { const w=F[0].hp>F[1].hp?0:1; F[1-w].ko=true; F[1-w].vy=-300; endRound(w); banner='타임업! 판정승'; }
    }
  }
  if(scene==='roundEnd' && sceneT>2.4){
    const maxW = Math.max(F[0].wins,F[1].wins);
    if(maxW>=2){ if(mode==='single') endStageMatch(); else { scene='final'; sceneT=0; } }
    else { round++; startRound(); }
  }
  if(scene==='final' && (just.has('Enter')||just.has('Space')||just.has(CTRL[0].a)||just.has(CTRL[1].a))){ scene='select'; sel[0].lock=sel[1].lock=false; }
  updateFx(dt);
}
function updateFx(dt){
  for(const p of pops){ p.t-=dt; p.y-=40*dt; } pops = pops.filter(p=>p.t>0);
  for(const s of sparks){ s.t-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=900*dt; } sparks = sparks.filter(s=>s.t>0);
  for(const r of rings) r.t-=dt; rings = rings.filter(r=>r.t>0);
  for(const x of fxs) x.t-=dt; fxs = fxs.filter(x=>x.t>0);
  for(const e of emos){ e.t-=dt; e.x+=e.vx*dt; e.y+=e.vy*dt; e.vy+=900*dt; } emos = emos.filter(e=>e.t>0);
}

function updateSelect(dt){
  if(just.has('Escape')){ scene='menu'; sel[0].lock=sel[1].lock=false; startDelay=0; return; }
  const players = mode==='single' ? [0] : [0,1];
  for(const p of players){
    const k=CTRL[p], s=sel[p];
    if(!s.lock){
      if(just.has(k.left)){ s.i=(s.i+5)%6; sfx.sel(); }
      if(just.has(k.right)){ s.i=(s.i+1)%6; sfx.sel(); }
      if(just.has(k.up)){ s.i=(s.i+3)%6; sfx.sel(); }
      if(just.has(k.a)){ s.lock=true; sfx.ok(); }
    } else if(just.has(k.b)){ s.lock=false; sfx.sel(); }
  }
  if(sel[0].lock && (mode==='single' || sel[1].lock)){
    startDelay+=dt;
    if(startDelay>0.5){ startDelay=0; if(mode==='single'){ scene='diff'; sceneT=0; } else { scene='map'; mapSel=curMap; } }
  } else startDelay=0;
}

/* ---------- 싱글 플레이 (Phase 4) ---------- */
const lerp = (a,b,t) => a + (b-a)*t;
function makeCpu(lv){ return {down:new Set(), just:new Set(), lv, t:.6, react:0, sawAtk:false, guardT:0, guardLow:false, reactLow:false}; }
// CPU: 가상 키 입력(Set)을 만들어 updateFighter에 넘긴다. lv(0~1)가 높을수록 반응이 빠르고 방어·필살기를 적극 사용
function aiThink(f, o, dt){
  const c=f.cpu, K=CTRL[f.p], lv=c.lv; c.just.clear();
  if(f.ko || o.ko){ c.down.clear(); return; }
  const dist=Math.abs(o.x-f.x), dir=o.x>=f.x?1:-1, air=f.y<GROUND-2;
  // 1) 상대 공격에 반응해 방어 (공격 종류 보고 서서/앉아 선택)
  if(o.atk && o.atk.type!=='ult' && !c.sawAtk){ c.sawAtk=true; c.react=lerp(.4,.1,lv)*(0.7+Math.random()*.6); }
  if(!o.atk) c.sawAtk=false;
  if(c.react>0){
    c.react-=dt;
    if(c.react<=0 && o.atk && dist<150 && Math.random()<lerp(.2,.75,lv)){ c.guardT=.3+Math.random()*.2; c.guardLow=o.atk.type==='low'; }
  }
  // 2) 날아오는 투사체: 방어하거나 점프
  const pr = projs.find(p=>p.owner!==f.p && Math.abs(p.x-f.x)<210 && (p.vx>0)===(f.x>p.x));
  if(pr && c.guardT<=0 && Math.random()<dt*lerp(2,10,lv)){
    if(lv>.4 && !air && Math.random()<.5) c.just.add(K.up); else { c.guardT=.35; c.guardLow=false; }
  }
  if(c.guardT>0){ c.guardT-=dt; c.down.clear(); c.down.add(K.d); if(c.guardLow) c.down.add(K.down); return; }
  // 3) 행동 결정 (lv가 높을수록 자주 판단)
  c.t-=dt;
  if(f.atk || f.stun>0 || f.lag>0){ c.down.clear(); return; }
  if(c.t>0) return;
  c.t = lerp(.34,.09,lv) + Math.random()*.08;
  c.down.clear();
  const r=Math.random();
  if(ultReady(f) && dist<130){ c.just.add(K.a); c.down.add(K.b); c.t=.4; return; }
  if(dist<100){
    const aggr=lerp(.45,.9,lv);
    if(r<aggr){
      const q=Math.random();
      if(q<.4) c.just.add(K.a);
      else if(q<.7) c.just.add(K.b);
      else if(q<.7+lerp(0,.2,lv)){ c.down.add(K.down); c.just.add(K.b); }
      else if(f.cd<=0) c.just.add(K.c);
      else c.just.add(K.a);
    } else if(r<aggr+.12){ c.down.add(dir===1?K.left:K.right); c.t=.25; }
    else { c.down.add(K.d); if(Math.random()<.3) c.down.add(K.down); c.t=.2+Math.random()*.2; }
  } else if(dist<340 && f.cd<=0 && Math.random()<lerp(.2,.6,lv)){ c.just.add(K.c); }
  else { c.down.add(dir===1?K.right:K.left); if(!air && Math.random()<.06) c.just.add(K.up); }
}
function enterStage(){
  const st = STAGES[stageIdx];
  curMap = st.map;
  if(st.opp==='rand'){ const pool = CHARS.filter(c=>c.id!==CHARS[sel[0].i].id); stageOpp = pool[Math.random()*pool.length|0]; }
  else if(st.opp==='exec') stageOpp = EXEC;
  else stageOpp = CHARS.find(c=>c.id===st.opp);
  scene='stageIntro'; sceneT=0; mode='single';
}
function endStageMatch(){
  if(F[0].wins>F[1].wins){
    stageIdx++;
    if(stageIdx>=STAGES.length){ scene='ending'; sceneT=0; sfx.ok(); }
    else { enterStage(); sfx.ok(); }
  } else { scene='gameover'; sceneT=0; sfx.ko(); }
}
function updateFlow(dt){
  sceneT += dt;
  const confirm = just.has('Enter') || just.has('Space') || just.has(CTRL[0].a) || just.has(CTRL[1].a);
  const move = (k)=> just.has(CTRL[0][k]) || just.has(CTRL[1][k]);
  if(scene==='menu'){
    if(move('up') || move('down')){ menuSel = 1-menuSel; sfx.sel(); }
    if(confirm){ sfx.ok(); mode = menuSel===0 ? 'single' : 'versus'; sel[0].lock=sel[1].lock=false; startDelay=0; scene='select'; }
  } else if(scene==='diff'){
    if(move('left')){ diffSel=(diffSel+2)%3; sfx.sel(); }
    if(move('right')){ diffSel=(diffSel+1)%3; sfx.sel(); }
    if(confirm){ diffIdx=diffSel; stageIdx=0; sfx.ok(); enterStage(); }
    if(just.has('Escape')){ scene='select'; sel[0].lock=false; }
  } else if(scene==='stageIntro'){
    if(just.has('Escape')){ scene='menu'; return; }
    if(sceneT>0.6 && (confirm || sceneT>4.5)) startMatch();
  } else if(scene==='gameover'){
    if(just.has('Escape')){ scene='menu'; return; }
    if(sceneT>0.8 && confirm){ stageIdx=0; enterStage(); }   // 같은 기업에 서류전형부터 재도전
  } else if(scene==='ending'){
    if(just.has('Escape') || (sceneT>7.5 && confirm)) scene='menu';
  }
}
function updateMap(dt){
  for(let p=0;p<2;p++){
    const k=CTRL[p];
    if(just.has(k.left)){ mapSel=(mapSel+MAPS.length-1)%MAPS.length; sfx.sel(); }
    if(just.has(k.right)){ mapSel=(mapSel+1)%MAPS.length; sfx.sel(); }
    if(just.has(k.a)){ curMap=mapSel; sfx.ok(); startMatch(); return; }
  }
  if(just.has('Escape')){ scene='select'; sel[0].lock=sel[1].lock=false; }
}

/* ---------- 그리기 ---------- */
function line(a,b,c,d){ ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d); ctx.stroke(); }

function drawStick(f, scale=1){
  const ch = f.ch, fc = f.face, x = f.x, y = f.y;
  const ko = f.ko, hitS = f.stun>0 && !ko;
  const atk = f.atk;
  const ptype = !atk ? null : atk.type==='ult' ? (atk.t<0.36 ? 'charge' : (Math.floor((atk.t-0.36)/0.12)%2===0 ? 'punch' : 'kick')) : atk.type;
  const prog = atk ? Math.min(1, atk.t/ATK[atk.type].dur) : 0;
  const ext = !atk ? 0 : atk.type==='ult' ? (atk.t<0.36 ? 0 : Math.abs(Math.sin(Math.PI*(((atk.t-0.36)%0.12)/0.12)))) : Math.sin(Math.PI*prog);
  const cr = f.crouch || (atk && atk.type==='low'), ready = ultReady(f), pulse = 0.5+0.5*Math.sin(performance.now()/110);
  const air = f.y < GROUND-2;
  ctx.save();
  ctx.translate(x,y); ctx.scale(scale,scale);
  // 그림자
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, (GROUND-y)+2, 28*(1-(GROUND-y)/500), 7, 0, 0, 7); ctx.fill();
  // 필살기 가능 / 충전 중: 붉은 오라 + 불꽃
  if((ready || ptype==='charge') && !ko){
    const g = ctx.createRadialGradient(0,-70,8,0,-70,70);
    g.addColorStop(0,`rgba(255,${120+pulse*100|0},40,${0.55+pulse*0.3})`); g.addColorStop(1,'rgba(255,60,20,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-70,70,0,7); ctx.fill();
    ctx.font='22px "Segoe UI Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🔥',-30,-30-pulse*8); ctx.fillText('🔥',30,-34-(1-pulse)*8); ctx.fillText('🔥',0,-136-pulse*6);
  }
  if(ko){ ctx.rotate(fc*-1.45); ctx.translate(0, 0); }
  else if(hitS){ ctx.rotate(-fc*0.25); }
  else if(f.lag>0){ ctx.rotate(fc*0.2); }
  else if(f.guard){ ctx.rotate(-fc*0.08); }
  ctx.lineCap='round'; ctx.lineJoin='round';
  const hipY = cr?-32:-52, shY = cr?-70:-92;
  const w = f.walkT ? Math.sin(f.walkT*12)*16 : 0;
  // 다리
  ctx.strokeStyle='#222'; ctx.lineWidth=6;
  let fl = {x: w, y: 0}, bl = {x: -w, y: 0};
  if(air){ fl={x:12*fc,y:-14}; bl={x:-12*fc,y:-6}; }
  if(ptype==='kick'){ fl={x:fc*(30+62*ext), y:-12-32*ext}; }
  if(f.guard){ fl={x:8*fc,y:0}; bl={x:-14*fc,y:0}; }
  if(ptype==='low'){
    fl={x:fc*(30+62*ext), y:-6}; bl={x:-fc*6,y:0};
    line(0,hipY,-fc*20,-18); line(-fc*20,-18,bl.x,0); line(0,hipY,fl.x,fl.y);
  } else if(cr){
    const kb={x:-fc*20,y:-18}, kf={x:fc*22,y:-18};
    bl={x:-fc*6,y:0}; fl={x:fc*14,y:0};
    line(0,hipY,kb.x,kb.y); line(kb.x,kb.y,bl.x,0); line(0,hipY,kf.x,kf.y); line(kf.x,kf.y,fl.x,0);
  } else { line(0,hipY,bl.x,bl.y+0); line(0,hipY,fl.x,fl.y); }
  // 신발
  ctx.strokeStyle='#111'; ctx.lineWidth=7; line(bl.x,bl.y,bl.x+7*fc,bl.y); line(fl.x,fl.y,fl.x+7*fc,fl.y);
  // 몸 (셔츠)
  ctx.strokeStyle=ch.color; ctx.lineWidth=11; line(0,hipY,0,shY);
  // 넥타이/직무 특징
  ctx.fillStyle = ch.id==='qc' ? '#1a1a1a' : '#fff';
  ctx.beginPath(); ctx.moveTo(0,shY+2); ctx.lineTo(-4,shY+10); ctx.lineTo(4,shY+10); ctx.fill();
  ctx.fillStyle = {dev:'#222',mkt:'#ffd400',sales:'#c0392b',hr:'#444',des:'#ff6b9a',qc:'#2a7',exec:'#d4af37'}[ch.id];
  ctx.beginPath(); ctx.moveTo(0,shY+8); ctx.lineTo(-4,shY+14); ctx.lineTo(0,shY+36); ctx.lineTo(4,shY+14); ctx.fill();
  // 팔
  ctx.strokeStyle='#222'; ctx.lineWidth=6;
  let fh = {x:fc*18, y:shY+28}, bh = {x:-fc*16, y:shY+28};
  if(walkArm(f)){ fh.y += w*0.3; bh.y -= w*0.3; }
  if(ptype==='punch'){ fh={x:fc*(22+52*ext), y:shY+4}; }
  if(ptype==='kick'){ fh={x:-fc*20,y:shY+10}; bh={x:fc*22,y:shY+20}; }
  if(ptype==='skill'){ fh={x:fc*(26+16*ext),y:shY+8}; bh={x:fc*(20+12*ext),y:shY+14}; }
  if(ptype==='charge'){ fh={x:fc*12,y:shY-26}; bh={x:-fc*12,y:shY-26}; }
  if(f.guard){ fh={x:fc*22,y:shY-8}; bh={x:fc*14,y:shY-4}; }
  if(hitS||ko){ fh={x:-fc*22,y:shY-8}; bh={x:fc*20,y:shY-16}; }
  if(f.lag>0 && !ko){ fh={x:fc*6,y:shY+36}; bh={x:-fc*6,y:shY+36}; }
  line(0,shY+2,bh.x,bh.y); line(0,shY+2,fh.x,fh.y);
  // 들고 있는 소품 (뒷손)
  ctx.font='26px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(!f.guard){ ctx.save(); ctx.translate(bh.x,bh.y+2); ctx.scale(fc,1); ctx.fillText(ch.prop,0,0); ctx.restore(); }
  else { ctx.save(); ctx.translate(fc*30,shY-2); ctx.font='34px "Segoe UI Emoji",sans-serif'; ctx.fillText('🛡️',0,0); ctx.restore(); }
  // 머리
  const hy = cr?-90:-112;
  ctx.fillStyle='#fff'; ctx.strokeStyle='#222'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(0,hy,15,0,7); ctx.fill(); ctx.stroke();
  // 머리 장식
  if(ch.id==='dev'){ ctx.strokeStyle='#333'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,hy,17,Math.PI,0); ctx.stroke(); ctx.fillStyle='#e33'; ctx.fillRect(-20,hy-4,6,12); ctx.fillRect(14,hy-4,6,12); }
  if(ch.id==='des'){ ctx.fillStyle='#d11'; ctx.beginPath(); ctx.ellipse(fc*2,hy-14,16,6,0,0,7); ctx.fill(); ctx.fillRect(fc*2-1,hy-24,3,6); }
  if(ch.id==='sales'){ ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(0,hy-3,15,Math.PI*1.05,Math.PI*1.95); ctx.fill(); }
  if(ch.id==='mkt'){ ctx.fillStyle='#ffd400'; ctx.fillRect(-15,hy-10,30,5); ctx.strokeStyle='#222'; ctx.lineWidth=2; ctx.strokeRect(-15,hy-10,30,5); }
  if(ch.id==='exec'){ // 백발 + 금테 안경
    ctx.fillStyle='#cfd3da'; ctx.beginPath(); ctx.arc(0,hy-2,15.5,Math.PI*1.0,Math.PI*2.0); ctx.fill();
    ctx.fillRect(-16,hy-4,5,10); ctx.fillRect(11,hy-4,5,10);
  }
  if(ch.id==='hr' || ch.id==='qc' || ch.id==='exec'){ ctx.strokeStyle='#222'; ctx.lineWidth=2.5; const ex=fc*5; ctx.strokeRect(ex-9,hy-6,8,8); ctx.strokeRect(ex+3,hy-6,8,8); line(ex-1,hy-2,ex+3,hy-2); }
  if(ch.id==='qc'){ // 흰 위생모
    ctx.fillStyle='#f4f4f4'; ctx.strokeStyle='#222'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(0,hy-4,15.5,Math.PI*1.02,Math.PI*1.98); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#2a7'; ctx.fillRect(-14,hy-8,28,3);
  }
  if(ch.id==='hr'){ ctx.fillStyle='#6a3fb0'; ctx.beginPath(); ctx.arc(-fc*8,hy-8,5,0,7); ctx.arc(-fc*13,hy,5,0,7); ctx.fill(); }
  if(f.lag>0 && !ko){ ctx.font='20px "Segoe UI Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('💦',-fc*20,hy-14+Math.sin(performance.now()/80)*3); }
  // 얼굴
  ctx.strokeStyle='#222'; ctx.lineWidth=2.5; const ex=fc*5;
  if(hitS||ko){ line(ex-7,hy-5,ex-2,hy); line(ex-2,hy-5,ex-7,hy); line(ex+3,hy-5,ex+8,hy); line(ex+8,hy-5,ex+3,hy);
    ctx.beginPath(); ctx.arc(ex,hy+8,3,0,7); ctx.stroke(); }
  else {
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(ex-3,hy-2,2.2,0,7); ctx.arc(ex+6,hy-2,2.2,0,7); ctx.fill();
    if(ready||ptype==='charge'){ ctx.lineWidth=3; line(ex-6,hy-9,ex-1,hy-5); line(ex+10,hy-9,ex+5,hy-5); ctx.lineWidth=2.5; }
    ctx.beginPath(); if(atk) ctx.arc(ex+1,hy+7,3.5,0,7); else ctx.arc(ex+1,hy+5,4,0.1,Math.PI-0.1); ctx.stroke();
  }
  ctx.restore();
}

function drawFight(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.drawImage(BGS[curMap],0,0);

function drawUltStyle(style,k){

    ctx.globalAlpha=1;

    for(let i=0;i<10;i++) ctx.fillText(['❤️','👍','🔥'][i%3],(i*97+now*80)%W,350-((now*120+i*40)%200));
  } else if(style==='contract'){
    for(let i=0;i<8;i++){ ctx.save(); ctx.translate((i*140+now*300)%(W+140)-70,170+(i%3)*60); ctx.rotate(0.3*Math.sin(now*3+i));
      ctx.fillStyle='#fffbe8'; ctx.fillRect(-30,-38,60,76); ctx.fillStyle='#c33'; ctx.fillRect(-20,-24,40,4); ctx.fillRect(-20,-14,40,4); ctx.fillRect(-20,-4,26,4); ctx.restore(); }
    const s=Math.min(1,k*3); ctx.globalAlpha=s; ctx.strokeStyle='#e33'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(W-170,255,44*(2-s),0,7); ctx.stroke();

    ctx.strokeStyle='rgba(255,70,70,.8)'; ctx.lineWidth=8; ctx.beginPath(); ctx.arc(0,0,110,0,7); ctx.stroke(); ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,98,0,7); ctx.stroke();
    ctx.fillStyle='rgba(255,70,70,.5)'; ctx.font='900 64px Malgun Gothic'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('불합격',0,0);
  } else if(style==='paint'){
    const cols=['#ff4d6d','#ffd23f','#3bceac','#4d9de0','#9d4edd'];
    for(let i=0;i<14;i++){ const r=Math.min(1,Math.max(0,k*2-i*0.05))*(26+(i*13)%40); ctx.fillStyle=cols[i%5]; ctx.globalAlpha=.8; ctx.beginPath(); ctx.arc((i*173)%W,150+(i*61)%200,r,0,7); ctx.fill(); }
  } else if(style==='scan'){
    ctx.fillStyle='rgba(0,40,20,.6)'; ctx.fillRect(0,140,W,220); ctx.strokeStyle='rgba(120,255,160,.35)'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=30){ ctx.beginPath(); ctx.moveTo(x,140); ctx.lineTo(x,360); ctx.stroke(); }

    ctx.fillStyle='rgba(120,255,160,.7)'; ctx.fillRect((now*500)%W,140,6,220);

    for(let i=0;i<6;i++) ctx.fillText(i%2?'NG':'OK',(i*170+60)%W,190+(i%3)*50);

function drawHitFx(){
  for(const r of rings){ const p=r.t/.25; ctx.strokeStyle=`rgba(255,255,255,${p})`; ctx.lineWidth=r.big?6:3; ctx.beginPath(); ctx.arc(r.x,r.y,(1-p)*(r.big?90:50)+10,0,7); ctx.stroke(); }
  for(const e of fxs){
    const p=e.t/e.max; ctx.save(); ctx.globalAlpha=Math.min(1,p*1.6); ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    if(e.style==='glitch'){
      ctx.fillStyle=`rgba(20,80,255,${0.2*p})`; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#7ff'; ctx.font='bold 22px monospace'; ctx.fillText(['ERROR 0x00','SEGFAULT','500','NULL!'][e.i],e.tx,e.ty-60);
      for(let j=0;j<3;j++){ ctx.fillStyle=j%2?'rgba(255,0,100,.5)':'rgba(0,255,255,.5)'; ctx.fillRect(e.tx-60+e.rnd*20*j,e.ty-40+j*18,120,6); }
    } else if(e.style==='viral'){
      ctx.strokeStyle='#ff4fa3'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(e.tx,e.ty,(1-p)*190+20,0,7); ctx.stroke();
      ctx.font='bold 20px Malgun Gothic'; ctx.fillStyle='#fff'; ctx.fillText(['+1K','+10K','+100K','+1M'][e.i]+' 조회',e.tx,e.ty-70-(1-p)*30);
    } else if(e.style==='contract'){
      ctx.translate(e.tx,e.ty-60); ctx.rotate(-0.2); ctx.strokeStyle='#e33'; ctx.lineWidth=4; ctx.strokeRect(-48,-20,96,34);
      ctx.fillStyle='#e33'; ctx.font='bold 22px Malgun Gothic'; ctx.fillText(e.i===3?'계약 체결':'서명 ✔',0,4);
    } else if(e.style==='reject'){
      if(e.i===3){ ctx.translate(W/2,250); ctx.rotate(-0.2); const s=1+(1-p)*0.4; ctx.scale(s,s);
        ctx.strokeStyle='rgba(255,50,50,.9)'; ctx.lineWidth=10; ctx.beginPath(); ctx.arc(0,0,120,0,7); ctx.stroke();
        ctx.fillStyle='rgba(255,50,50,.85)'; ctx.font='900 78px Malgun Gothic'; ctx.textBaseline='middle'; ctx.fillText('불합격',0,0); }
      else { ctx.fillStyle='#f33'; ctx.font='900 46px sans-serif'; ctx.fillText('✖',e.tx,e.ty); }
    } else if(e.style==='paint'){
      for(const b of e.blobs){ ctx.fillStyle=b.c; ctx.beginPath(); ctx.arc(e.tx+b.dx,e.ty+b.dy,b.r*(1.3-p*0.3),0,7); ctx.fill(); }
    } else if(e.style==='scan'){
      ctx.save(); ctx.shadowColor='#6f9'; ctx.shadowBlur=14; ctx.strokeStyle='#8fa'; ctx.lineWidth=2+8*p;
      ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.tx,e.ty); ctx.stroke(); ctx.restore();
      ctx.font='bold 28px monospace'; ctx.fillStyle='#f55'; ctx.fillText('NG',e.tx,e.ty-60);
    }
    ctx.restore();
  }
}

  ctx.fillStyle='#2f6fb5'; ctx.fillRect(sx,sy,sw,20); txt('✉ 메일  ·  받은편지함',sx+8,sy+14,11,'#fff','left');
  if(t<4.4){
    const rows=[[`${company} · [채용] 최종 결과 안내`,true],['회식 공지 (필참)',false],['[광고] 연봉 2배 이직 지금 상담',false],['택배 배송 안내',false],['스터디 모임 일정',false]];
    rows.forEach(([r,b],i)=>{ const y=sy+20+i*30; ctx.fillStyle=b?'#e8f1ff':'#fff'; ctx.fillRect(sx,y,sw,30); ctx.fillStyle='#dde'; ctx.fillRect(sx,y+30,sw,1);
      if(b){ ctx.fillStyle='#e33'; ctx.beginPath(); ctx.arc(sx+12,y+15,4+Math.sin(t*8)*1,0,7); ctx.fill(); }
      txt(r,sx+24,y+19,11,b?'#111':'#777','left',b); });
  } else {
    txt(`[${company}] ${job} 직무 최종 합격 안내`,sx+10,sy+40,11,'#111','left');
    ctx.fillStyle='#dde'; ctx.fillRect(sx+8,sy+48,sw-16,1);
    txt(`${company} 인사팀입니다.`,sx+10,sy+68,10,'#444','left',false);
    txt('서류전형부터 임원 면접까지 모든 전형을 통과하신',sx+10,sy+84,10,'#444','left',false);
    txt('지원자님께 기쁜 소식을 전합니다.',sx+10,sy+98,10,'#444','left',false);
    const pulse=1+Math.sin(t*6)*0.03; ctx.save(); ctx.translate(sx+sw/2,sy+132); ctx.scale(pulse,pulse);
    txt('최종 합격하셨습니다!',0,0,22,'#d6264a'); ctx.restore();
    txt('입사를 진심으로 환영합니다 🎉',sx+sw/2,sy+158,11,'#2f6fb5');
    txt('※ 본 메일은 발신 전용입니다',sx+sw/2,sy+182,8,'#aaa',undefined,false);
  }
  ctx.restore();
  ctx.restore();
  if(t<2.2){ ctx.globalAlpha=Math.min(1,(2.2-t)); txt('며칠 뒤…',W/2,90,34,'#fff'); ctx.globalAlpha=1; }
  if(t>6.6){ // 축하 컨페티
    const tt=t-6.6; const cols=['#ff4d6d','#ffd23f','#3bceac','#4d9de0','#9d4edd'];
    for(let i=0;i<90;i++){ const x=(i*97)%W + Math.sin(tt*2+i)*14, y=((tt*(110+(i%5)*40)+i*53)%(H+40))-20; ctx.fillStyle=cols[i%5]; ctx.fillRect(x,y,7,11); }
    const ba = tt<.4 ? tt/.4 : Math.max(0,1-(tt-2.2)/.8);   // 잠깐 떴다가 사라져서 메일 제목을 가리지 않음
    if(ba>0){ ctx.globalAlpha=ba; bigText('🎉 축하합니다! 🎉',52,'#ffd24a',H-34); ctx.globalAlpha=1; }
  }
  if(t>7.5) txt('Enter / Y / 5 : 메인으로',W/2,H-18,16,'#fff');
}

/* ---------- 메인 루프 ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033,(now-last)/1000); last=now;
  update(dt);
  syncBGM();
  if(scene==='select') drawSelect(); else if(scene==='map') drawMap();
  else if(scene==='menu') drawMenu(); else if(scene==='diff') drawDiff(); else if(scene==='stageIntro') drawStageIntro();
  else if(scene==='gameover') drawGameOver(); else if(scene==='ending') drawEnding(); else drawFight();
  just.clear();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
